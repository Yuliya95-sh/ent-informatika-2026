<table>
<tr><th>Формула</th><th>Результат</th><th>Пояснение</th></tr>
<tr><td><code>=ВПР("Дана";A2:C5;2;ЛОЖЬ)</code></td><td>48</td><td>Ищет «Дана» в первом столбце диапазона, возвращает значение из 2-го столбца диапазона. ЛОЖЬ — точное совпадение</td></tr>
<tr><td><code>=ВПР("Болат";A2:C5;3;ЛОЖЬ)</code></td><td>45</td><td>3-й столбец диапазона — Математика</td></tr>
<tr><td><code>=ИНДЕКС(B2:B5;ПОИСКПОЗ(МАКС(B2:B5);B2:B5;0))</code></td><td>48</td><td>ПОИСКПОЗ находит позицию максимума, ИНДЕКС берёт значение по позиции. Так можно искать и влево, что ВПР не умеет</td></tr>
<tr><td><code>=СУММЕСЛИ(B2:B5;">40";C2:C5)</code></td><td>78</td><td>Сумма баллов по математике у тех, у кого информатика больше 40: Асель 38 + Дана 40</td></tr>
<tr><td><code>=СЧЁТЕСЛИМН(B2:B5;">=35";C2:C5;">=40")</code></td><td>2</td><td>Оба условия: Болат и Дана</td></tr>
<tr><td><code>=СРЗНАЧЕСЛИ(C2:C5;">35")</code></td><td>41</td><td>Среднее из 38, 45, 40</td></tr>
</table>
<p>В английской версии: VLOOKUP, INDEX, MATCH, SUMIF, COUNTIFS, AVERAGEIF. В новых версиях Excel есть ПРОСМОТРX (XLOOKUP), который заменяет ВПР.</p>

<h3>Вложенные ЕСЛИ</h3>
[[txt]]
=ЕСЛИ(B2>=85;5;ЕСЛИ(B2>=70;4;ЕСЛИ(B2>=50;3;2)))
[[/txt]]
<p>Проверки идут сверху вниз до первого выполненного условия. При B2 = 72 первое условие ложно, второе истинно — результат 4. Порядок важен: если начать с B2 &gt;= 50, то и 90 баллов дадут 3.</p>

<h2>Копирование формул: углублённо</h2>
<div class="task"><b>Задача 1</b>В C1 записано <code>=A1+$B1</code>. Формулу скопировали в D3. Какой она станет?
<details class="sol"><summary>Решение</summary>Сдвиг: на 1 столбец вправо (C → D) и на 2 строки вниз (1 → 3). A → B, строка 1 → 3; у $B столбец закреплён, строка 1 → 3. Получится <code>=B3+$B3</code>.</details></div>
<div class="task"><b>Задача 2</b>A1 = 1, A2 = 2, A3 = 3, B1 = 10. В C1 записали <code>=A1*$B$1</code> и скопировали в C2:C3. Чему равно <code>=СУММ(C1:C3)</code>?
<details class="sol"><summary>Решение</summary>C2 = A2 · B1 = 20, C3 = A3 · B1 = 30, C1 = 10. Сумма 60. Если бы ссылка была относительной (B1), в C2 получилось бы A2 · B2 = 0.</details></div>
<div class="task"><b>Задача 3</b>В A2:A10 числа 1–9, в B1:J1 тоже 1–9. Какую формулу записать в B2, чтобы после копирования на B2:J10 получилась таблица умножения?
<details class="sol"><summary>Решение</summary><code>=$A2*B$1</code>. Множитель из столбца A должен оставаться в столбце A ($A), а множитель из строки 1 — в строке 1 ($1).</details></div>
<p>Ссылки на другие листы: <code>=Лист2!B3</code>, <code>='Итоги 2026'!A1</code> (имя с пробелом — в кавычках). Диапазону можно дать имя («Баллы») и писать <code>=СУММ(Баллы)</code>.</p>
<p><b>Автозаполнение</b>: если в двух ячейках 1 и 3, протяжка продолжит 5, 7, 9; «Пн» продолжится днями недели; формулы копируются с изменением относительных ссылок.</p>

<h2>Анализ данных в электронных таблицах</h2>
<table>
<tr><th>Инструмент</th><th>Назначение</th></tr>
<tr><td>Многоуровневая сортировка</td><td>Например, по классу, а внутри класса по убыванию балла</td></tr>

<tr><td>Условное форматирование</td><td>Меняет оформление ячейки по её значению: красный цвет для баллов ниже 30, цветовые шкалы</td></tr>
<tr><td>Сводная таблица</td><td>Группирует данные и считает итоги по категориям (аналог GROUP BY в SQL)</td></tr>
<tr><td>Проверка данных</td><td>Ограничивает ввод: выпадающий список, диапазон чисел</td></tr>
<tr><td>Подбор параметра</td><td>Находит значение исходной ячейки, при котором формула даёт нужный результат</td></tr>
</table>
<p><b>Элементы диаграммы</b>: заголовок, оси (горизонтальная — категории, вертикальная — значения), ряды данных, легенда, подписи данных. По диаграмме часто нужно определить, какой диапазон ячеек она изображает: сопоставьте число столбиков или секторов с числом ячеек и их высоты со значениями.</p>

<h2>Текстовый процессор: продвинутые возможности</h2>
<ul>
<li><b>Стили и оглавление</b>: заголовки оформляют стилями «Заголовок 1», «Заголовок 2», и оглавление собирается автоматически вместе с номерами страниц.</li>
<li><b>Разрыв раздела</b> позволяет сделать одну страницу альбомной в книжном документе или сменить колонтитулы и нумерацию.</li>
<li><b>Слияние (рассылка)</b>: шаблон документа + таблица данных (имена, адреса) → много персональных документов, например приглашений.</li>
<li><b>Шаблоны</b> (.dotx) задают готовое оформление.</li>
<li><b>Рецензирование</b>: режим исправлений показывает правки, которые можно принять или отклонить; примечания — комментарии на полях.</li>
<li>Сноски (внизу страницы) и концевые сноски (в конце документа), перекрёстные ссылки, многоуровневые списки, колонки, вставка формул.</li>
</ul>
<h3>Правила набора текста</h3>
<ul>
<li>Пробел ставится после знака препинания, но не перед ним.</li>
<li>Между числом и единицей измерения, инициалами и фамилией ставят неразрывный пробел (Ctrl + Shift + Пробел): «10 кг», «А. С. Пушкин».</li>
<li>Дефис (-) соединяет части слова, тире (—) отделяет части предложения.</li>
<li>Абзацный отступ и выравнивание задают параметрами абзаца, а не пробелами и табуляцией; новую страницу начинают разрывом страницы, а не пустыми строками.</li>
<li>В русских текстах используют кавычки «ёлочки».</li>
</ul>

<h2>Обработка изображений</h2>
<ul>
<li><b>ppi</b> — пикселей на дюйм экрана или файла, <b>dpi</b> — точек на дюйм при печати. Для качественной печати нужно около 300 dpi: фото 10 × 15 см (≈ 3,9 × 5,9 дюйма) требует примерно 1181 × 1772 пикселя.</li>
<li>Уменьшение растрового изображения теряет детали, увеличение даёт размытие и пикселизацию.</li>
<li><b>Слои и маски</b> позволяют менять части изображения независимо; <b>альфа-канал</b> хранит прозрачность пикселя.</li>
<li>В векторной графике контуры строятся <b>кривыми Безье</b>: опорные точки и направляющие задают изгиб.</li>
<li><b>Растеризация</b> переводит вектор в растр; <b>трассировка (векторизация)</b> — растр в вектор.</li>
<li>Коррекция: яркость, контраст, уровни, кривые, цветовой баланс, насыщенность.</li>
</ul>

<h2>Видео и презентации</h2>
<p>Этапы видеопроекта: сценарий и раскадровка → съёмка → монтаж на таймлайне → цветокоррекция → звук и музыка → титры → экспорт. <b>Хромакей</b> — замена однотонного (обычно зелёного) фона. Стандартное соотношение сторон 16:9, для вертикального видео 9:16.</p>
<p>Правило <b>10/20/30</b> для презентаций: не больше 10 слайдов, не дольше 20 минут, шрифт не меньше 30 пт. На слайде одна мысль, высокий контраст текста и фона, единый стиль. Текст выступления хранят в заметках докладчика, а не на слайде.</p>

<h2>Протокол HTTP подробнее</h2>
<table>
<tr><th>Метод</th><th>Назначение</th></tr>
<tr><td>GET</td><td>Получить ресурс. Параметры передаются в адресе: <code>search?q=ент&amp;page=2</code>. Видны в истории и закладках</td></tr>
<tr><td>POST</td><td>Отправить данные (форму) в теле запроса. В адресе их не видно</td></tr>
<tr><td>PUT / DELETE</td><td>Изменить / удалить ресурс (используются в веб-API)</td></tr>
</table>
<table>
<tr><th>Код</th><th>Значение</th></tr>
<tr><td>200 OK</td><td>Успешно</td></tr>
<tr><td>301 / 302</td><td>Ресурс перемещён навсегда / временно (перенаправление)</td></tr>
<tr><td>304</td><td>Не изменился, можно взять из кэша</td></tr>
<tr><td>400 / 401 / 403 / 404</td><td>Ошибка запроса / нужна авторизация / доступ запрещён / не найдено</td></tr>
<tr><td>500 / 503</td><td>Внутренняя ошибка сервера / сервер недоступен</td></tr>
</table>
<p>HTTP сам не помнит пользователя между запросами. Для этого сервер сохраняет в браузере <b>cookie</b> с идентификатором <b>сессии</b>.</p>

<h2>Формы</h2>
[[html]]
<form action="/register" method="post">
  <label for="name">Имя</label>
  <input type="text" id="name" name="name" placeholder="Аружан" required>

  <label for="age">Возраст</label>
  <input type="number" id="age" name="age" min="14" max="20">

  <input type="radio" id="m" name="lang" value="ru"><label for="m">Русский</label>
  <input type="radio" id="k" name="lang" value="kz"><label for="k">Қазақ</label>

  <select name="class">
    <option value="10">10 класс</option>
    <option value="11" selected>11 класс</option>
  </select>
  <textarea name="about" rows="3"></textarea>
  <button type="submit">Отправить</button>
</form>
[[/html]]
<p><code>action</code> — адрес обработчика, <code>method</code> — GET или POST, <code>name</code> — имя, под которым значение уйдёт на сервер. Радиокнопки с одинаковым name образуют группу, где выбрать можно только одну. <code>label for</code> связывает подпись с полем по id: щелчок по подписи ставит фокус в поле. <code>required</code>, <code>min</code>, <code>max</code>, <code>pattern</code> проверяют ввод ещё в браузере.</p>

<h2>Сложные таблицы и медиа</h2>
[[html]]
<table border="1">
  <tr><th colspan="2">Ученик</th><th rowspan="2">Балл</th></tr>
  <tr><th>Имя</th><th>Класс</th></tr>
  <tr><td>Дана</td><td>11A</td><td>118</td></tr>
</table>
[[/html]]
<p>Таблица имеет 3 столбца: в первой строке ячейка «Ученик» занимает два столбца, а «Балл» растянута на две строки, поэтому во второй строке всего две ячейки.</p>
<p>Медиа: <code>&lt;audio src="a.mp3" controls&gt;</code>, <code>&lt;video src="v.mp4" controls width="640"&gt;</code>, встраивание чужой страницы (карты, видео) — <code>&lt;iframe&gt;</code>.</p>

<h2>SEO и доступность</h2>
<ul>
<li>Уникальные <code>&lt;title&gt;</code> и <code>&lt;meta name="description"&gt;</code> для каждой страницы.</li>
<li>Один <code>&lt;h1&gt;</code> на странице, заголовки идут по порядку уровней.</li>
<li>Понятные адреса (<code>/kursy/informatika</code>), карта сайта, быстрая загрузка, адаптивность.</li>
<li>Атрибут <code>alt</code> у изображений, подписи <code>label</code> у полей, достаточный контраст, работа с клавиатуры — для людей с нарушениями зрения и моторики.</li>
</ul>

<h2>CSS: каскад, наследование, специфичность</h2>
<p><b>Наследуются</b> свойства текста: <code>color</code>, <code>font-family</code>, <code>font-size</code>, <code>line-height</code>, <code>text-align</code>. <b>Не наследуются</b> свойства блока: <code>margin</code>, <code>padding</code>, <code>border</code>, <code>width</code>, <code>background</code>.</p>
<p>Специфичность записывается тройкой (id, классы, теги). Классы включают атрибуты и псевдоклассы, теги — псевдоэлементы. Тройки сравниваются слева направо.</p>
<table>
<tr><th>Селектор</th><th>Специфичность</th></tr>
<tr><td><code>ul li a</code></td><td>(0, 0, 3)</td></tr>
<tr><td><code>.menu a:hover</code></td><td>(0, 2, 1)</td></tr>
<tr><td><code>#nav .item a</code></td><td>(1, 1, 1) — побеждает</td></tr>

/* data/tb11.js */

// Арман-ПВ (Салгараева, Базаева, Маханова, 2020) и Атамұра (11 класс ЕМН)

// Стабильное перемешивание вариантов (одинаковое при каждой загрузке)
var TB_SEED=11;
function tbMix(list){
  const rnd=()=>{TB_SEED=(TB_SEED*9301+49297)%233280;return TB_SEED/233280};
  return list.map(q=>{
    if(!q.opts)return q;
    const n=q.opts.length,p=[...Array(n).keys()];
    for(let i=n-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[p[i],p[j]]=[p[j],p[i]]}
    const inv=[];p.forEach((old,neu)=>{inv[old]=neu});
    const a=Array.isArray(q.a)?q.a.map(x=>inv[x]).sort((x,y)=>x-y):inv[q.a];
    return Object.assign({},q,{opts:p.map(i=>q.opts[i]),a});
  });
}

ext("t11",{html:String.raw`
<h2>По учебнику 11 класса: искусственный интеллект</h2>
<h3>Определения и история</h3>
<ul>
<li><b>Искусственный интеллект (ИИ)</b> — способность интеллектуальных машин выполнять творческие задачи, которые традиционно считаются прерогативой человека. Этим же словом называют науку и технологию создания таких машин.</li>
<li>Термин ввёл американский учёный <b>Джон Маккарти в 1956 году</b>. Слово «intelligence» в «artificial intelligence» означает <b>«умение рассуждать разумно»</b>, а не «интеллект».</li>
<li><b>Алан Тьюринг</b> в 1950 году описал в статье «Может ли машина мыслить?» процедуру, позже названную <b>тестом Тьюринга</b>. Она определяет, сравнялась ли машина по разумности с человеком.</li>
<li><b>Машинное обучение</b> — ветвь (направление) ИИ, основная идея которой в том, чтобы компьютер сам обучился решению поставленной задачи на больших наборах данных.</li>
<li><b>Искусственная нейронная сеть (ИНС)</b> — математическая модель, которая анализирует сложные данные, имитируя человеческий мозг, и имеет аппаратное и программное воплощение.</li>
<li><b>Глубокое обучение (Deep Learning)</b> — обучение многослойных нейронных сетей.</li>
</ul>
<h3>Составляющие машинного обучения</h3>
<p>В учебнике Атамұра цель машинного обучения — предсказать результат по входным данным. Для этого нужны три составляющие:</p>
<table>
<tr><th>Составляющая</th><th>Суть</th></tr>
<tr><td>Данные (Data)</td><td>Основа обучения. Набор данных для обучения модели называют <b>тренировочным (обучающим) сетом</b></td></tr>
<tr><td>Признаки (Features)</td><td>Характеристики объектов. <b>Количественные</b>: доход, рост, цена. <b>Категориальные</b>: марка автомобиля, модель телефона</td></tr>
<tr><td>Алгоритм (Algorithm)</td><td>Процедура, от выбора которой зависят скорость работы и точность результата</td></tr>
</table>
<p>Схема работы: исходные данные → извлечение признаков → выбор алгоритма → результат.</p>
<h3>Виды машинного обучения</h3>
<table>
<tr><th>Вид</th><th>Данные</th><th>Задачи</th></tr>
<tr><td>С учителем</td><td>Размеченные: у каждого примера есть правильный ответ</td><td><b>Классификация</b> (предсказать категорию: кошка, собака) и <b>регрессия</b> (предсказать число: цена автомобиля на kolesa.kz)</td></tr>
<tr><td>Без учителя</td><td>Неразмеченные, машина сама ищет закономерности</td><td><b>Кластеризация</b> (разбить на группы по сходству), <b>обобщение</b> (уменьшение размерности), <b>ассоциация</b> (найти часто встречающиеся вместе элементы, например товары в корзине)</td></tr>
<tr><td>С частичным привлечением учителя</td><td>Немного размеченных и много неразмеченных данных</td><td>Промежуточный вариант</td></tr>
<tr><td>С подкреплением</td><td>Готовых данных нет, есть среда, с которой можно взаимодействовать</td><td>Обучение за счёт системы поощрений</td></tr>
</table>
<p>Области применения обучения с учителем (Арман-ПВ): компьютерное зрение, распознавание речи, компьютерная лингвистика, медицинская и техническая диагностика, биоинформатика, финансовые приложения, интеллектуальные игры, экспертные системы.</p>
<h3>Биологический и искусственный нейрон</h3>
<table>
<tr><th>Биологический нейрон</th><th>Искусственный нейрон</th></tr>
<tr><td><b>Дендриты</b> — входные порты, получают сигналы от других нейронов</td><td>Входы x₁ … xₙ</td></tr>
<tr><td><b>Синапсы</b> — связи между нейронами, у каждой своя степень веса</td><td>Веса w₁ … wₙ</td></tr>
<tr><td>Тело (сома) суммирует сигналы</td><td><b>Сумматор</b>: S = x₁·w₁ + … + xₙ·wₙ (+ смещение b)</td></tr>
<tr><td><b>Аксон</b> — единственный выход, передаёт импульс дальше</td><td>Выход после <b>функции активации</b></td></tr>
</table>
<p>Арман-ПВ подчёркивает: на результат вычислений напрямую влияют <b>синапсы</b> (их веса), а не сами нейроны.</p>
<p><b>Функция активации</b> получает входной сигнал и генерирует выходной с учётом порогового значения. <b>Ступенчатая</b> функция выдаёт 0 или 1. <b>Сигмоида</b> (логистическая функция) сглаживает ступеньку: <span class="f">y = 1 / (1 + e<sup>−x</sup>)</span>. При x = 0 сигмоида равна 0,5, при больших x стремится к 1, при больших отрицательных x — к 0.</p>
<h3>Строение сетей</h3>
<ul>
<li>Типы нейронов: <b>входной, скрытый, выходной</b>. Есть ещё нейрон смещения и контекстный нейрон.</li>
<li>Входной слой ничего не вычисляет, только принимает и распределяет сигналы. Поэтому сеть «вход → один рабочий слой» называется <b>однослойной</b>.</li>
<li><b>Многослойная</b> сеть содержит один или несколько <b>скрытых</b> слоёв между входным и выходным.</li>
<li>Сети <b>прямого распространения</b> (однонаправленные) передают сигнал строго от входа к выходу.</li>
<li><b>Рекуррентные</b> сети (с обратными связями) возвращают выход на вход, у них есть кратковременная память.</li>
<li>По типам нейронов сети бывают <b>однородные</b> и <b>гибридные</b>.</li>
</ul>
<p>Задачи нейросетей по учебникам: <b>классификация</b> (кредитный робот решает, одобрить ли заём), <b>распознавание образов</b>, <b>прогнозирование</b> (предсказание следующего шага на торгах).</p>
<h3>Обучение нейрона: правило из практикума</h3>
<p><span class="f">ошибка e = d − o</span> (желаемый выход минус фактический)<br><span class="f">Δw = LR · e · x</span>, новый вес = старый вес + Δw</p>
<p>Здесь LR (learning rate) — <b>скорость обучения</b>, обычно от 0,01 до 0,5. Слишком маленькая скорость делает обучение очень долгим, слишком большая мешает сети сойтись. <b>Обучение нейронной сети</b> по глоссарию Атамұра — это поиск весовых коэффициентов связей, управляемый ошибкой.</p>
<div class="task"><b>Задача 1 (модель из учебника)</b>Нейрон решает, есть ли продукт. Вход 1 — белый цвет (альбедо), вход 2 — сладость. Выход равен 1, если w₁·x₁ + w₂·x₂ ≥ порог. Продукты: ничего (0, 0), шоколад (0, 1), соль (1, 0), мороженое (1, 1). При каких весах и пороге нейрон «съест» только мороженое: (1; 1; порог 1) или (1; 1; порог 2)?
<details class="sol"><summary>Решение</summary>При пороге 1 сработают шоколад (1 ≥ 1), соль (1 ≥ 1) и мороженое (2 ≥ 1). При пороге 2 сработает только мороженое: 1 + 1 = 2 ≥ 2, а у шоколада и соли сумма 1 &lt; 2. Ответ: веса 1 и 1, порог 2.</details></div>
<div class="task"><b>Задача 2 (шаг обучения)</b>Входы (1, 1), веса (0,5; 0,5), порог 2, желаемый выход 1, LR = 0,2. Найдите новые веса после одного шага. Сколько таких шагов нужно, чтобы нейрон начал выдавать 1?
<details class="sol"><summary>Решение</summary>Активация 0,5 + 0,5 = 1 &lt; 2, выход 0. Ошибка e = 1 − 0 = 1. Δw = 0,2 · 1 · 1 = 0,2 для каждого веса, новые веса (0,7; 0,7). Сумма весов растёт на 0,4 за шаг: 1,0 → 1,4 → 1,8 → 2,2. Нужно 3 шага.</details></div>
<div class="task"><b>Задача 3 (регрессия из практикума Арман-ПВ)</b>По курсу доллара за 30 дней апреля 2020 года в Excel построена модель Y = −0,5996·X + 439,51 с R² = 0,512. Каков прогноз на день X = 31 и что означает R²?
<details class="sol"><summary>Решение</summary>Y = −0,5996 · 31 + 439,51 = −18,59 + 439,51 ≈ 420,92 тенге. R² (коэффициент детерминации) = 0,512: модель объясняет 51,2% изменения курса. Чем ближе R² к 1, тем качественнее модель. Знак «−» у коэффициента означает, что курс в среднем снижался.</details></div>

<h2>Виртуальная и дополненная реальность, 3D-панорамы</h2>
<h3>Определения</h3>
<table>
<tr><th>Термин</th><th>Определение по учебнику</th></tr>
<tr><td>Виртуальная реальность (VR)</td><td>Искусственный мир, созданный человеком посредством технического и программного обеспечения. Создаёт <b>новый</b> мир</td></tr>
<tr><td>Дополненная реальность (AR)</td><td>Среда, в реальном времени дополняющая физический мир цифровыми данными с помощью смартфонов, планшетов, очков. Добавляет элементы в <b>реальную</b> картину</td></tr>
<tr><td>Смешанная (гибридная) реальность (MR)</td><td>Объединение реального и виртуального миров, где физические и цифровые объекты сосуществуют и взаимодействуют в реальном времени</td></tr>
<tr><td>Интерактивный мир</td><td>Сочетание ощущений человека и воздействия на него</td></tr>
</table>
<p>История (рубрика «Это интересно» в Арман-ПВ): Фрэнк Баум в 1901 году описал идею электронного дисплея поверх реальности; Джарон Ланье в 1989 году ввёл понятие «виртуальная реальность»; Томас Коделл в 1990 году ввёл понятие «дополненная реальность».</p>
<h3>Виды VR и AR</h3>
<table>
<tr><th>Вид VR</th><th>Суть и примеры</th></tr>
<tr><td>Простой VR</td><td>Пользователь в центре 360-градусного пространства, без взаимодействия с объектами. Очки для смартфона: Cardboard, Gear VR</td></tr>
<tr><td>3D-модель VR</td><td>Пользователь создаёт и изменяет объекты. Шлемы с контроллерами и датчиками: Oculus Rift, HTC Vive</td></tr>
<tr><td>VR для нескольких пользователей</td><td>Онлайн-среда для многих участников, например ролевые онлайн-игры</td></tr>
</table>
<table>
<tr><th>Вид AR</th><th>Как работает</th></tr>
<tr><td>На основе маркеров</td><td>Камера сканирует маркер, например <b>QR-код</b>, и выводит информацию</td></tr>
<tr><td>Позиционная</td><td>Использует местоположение (<b>GPS</b>): подсказки о достопримечательностях, магазинах, маршрутах</td></tr>
<tr><td>На основе проекций</td><td>Искусственный свет проецируется на физические поверхности</td></tr>
<tr><td>На основе суперпозиции</td><td>Распознаёт объекты и в реальном времени заменяет или дополняет их виртуальными</td></tr>
</table>
<p>Применение VR: обучение (тренажёры хирургов и водителей техники), наука, медицина, архитектура и дизайн, развлечения и туризм. <b>QR-код</b> — двумерный штрихкод из контрастных блоков, кодирует до нескольких сотен символов.</p>
<h3>Здоровье в VR</h3>
<p>Учебники называют риски: <b>«виртуальная зависимость»</b> (virtual addiction disorder) и проблемы вестибулярной системы. Признаки зависимости: человек не контролирует время за компьютером, лжёт о нём, страдает от последствий. Рекомендации: шлем не больше <b>3 часов в день</b> с перерывом <b>каждые полчаса</b>; детям до <b>13 лет</b> шлем не используют или используют под контролем взрослых. Зрение VR-очки, по учебнику, утомляют не сильнее монитора.</p>
<h3>3D-панорамы и виртуальные туры</h3>
<p><b>3D-панорама</b> — 360-градусное изображение окружающего пространства для просмотра на мониторе. Зритель сам меняет направление обзора и масштаб.</p>
<table>
<tr><th>Вид панорамы</th><th>Охват</th></tr>
<tr><td>Плоскостная</td><td>Обычное широкоугольное фото из нескольких кадров</td></tr>
<tr><td>Цилиндрическая (циклорама)</td><td>360° по горизонтали, меньше 180° по вертикали. Нельзя посмотреть вверх и вниз</td></tr>
<tr><td>Сферическая</td><td>360° по горизонтали и 180° по вертикали, всё пространство вокруг</td></tr>
<tr><td>Кубическая</td><td>Проецируется на 6 квадратных граней куба. Проще изготовить и хранить, чем сферическую</td></tr>
</table>
<p><b>Виртуальный тур (3D-тур)</b> — несколько 3D-панорам, связанных <b>активными зонами</b> (точками перехода), с музыкой, озвучкой, надписями, планом-навигатором. Этапы создания: <b>съёмка</b> серии фото → <b>обработка</b> (сшивка в панораму, коррекция, наложение активных зон) → <b>сборка</b> тура. Правила съёмки: камера на штативе с уровнями, все кадры в фокусе, швы на однотонных местах, поворот камеры на равные углы (в учебнике 3 кадра через 120°). <b>Нодальная точка</b> — точка на оси объектива, где пересекаются оптические лучи. Вокруг неё вращают камеру, чтобы не было параллакса. <b>Панорамная фотография</b> перекрывает поле зрения человека: 160° по горизонтали и 75° по вертикали, иногда до 360°.</p>
<p>Программы из учебника: Microsoft Image Composite Editor (этапы Импорт, Склейка, Обрезка, Экспорт), Фотогалерея Windows, сайт Dermandar. Сферы применения туров: недвижимость, гостиницы, рестораны, заводы, клиники, автосалоны.</p>
<div class="task"><b>Задача (связь с темой 03)</b>Сферическую панораму хранят в равнопромежуточной проекции: 360° по ширине и 180° по высоте, поэтому стороны относятся как 2 : 1. Ширина 8000 пикселей, глубина цвета 24 бита. Найдите высоту и информационный объём без сжатия.
<details class="sol"><summary>Решение</summary>Высота 8000 / 2 = 4000 пикселей. Объём 8000 · 4000 · 3 байта = 96 000 000 байт ≈ 91,6 МиБ.</details></div>

<h2>Интернет вещей, умный дом и мобильные приложения</h2>
<h3>Интернет вещей</h3>
<p><b>Интернет вещей (Internet of Things, IoT)</b> — концепция вычислительной сети физических объектов («вещей») со встроенными технологиями для взаимодействия друг с другом или с внешней средой. Она исключает из части действий необходимость участия человека. Атамұра даёт краткое определение: сенсорная сеть из миллиардов интеллектуальных устройств для сбора и обмена данными.</p>
<ul>
<li><b>Промышленный IoT</b>: машиностроение, транспорт, умные города, производство, здравоохранение. <b>Пользовательский IoT</b>: носимые гаджеты, смартфоны, телевизоры, бытовая техника, умный дом.</li>
<li>Условия для работы IoT: <b>единый центр</b> (устройство, которое управляет остальными и собирает данные), <b>единые стандарты</b> (их отсутствие — главное препятствие), <b>безопасность</b>.</li>
<li>Примеры из учебника: Яндекс.Навигатор (устройства и сервер обмениваются данными о пробках без человека), спортивные жилеты с датчиками, умные счётчики ЖКХ, датчики влажности почвы, удалённый контроль ветрогенераторов, носимые медицинские датчики.</li>
<li>Архитектура IoT (по МСЭ): уровень <b>устройства</b> → уровень <b>сети</b> → уровень <b>поддержки услуг и приложений</b> → уровень <b>приложения</b>. Через все уровни проходят возможности управления и обеспечения безопасности.</li>
<li>Проблемы внедрения: поиск альтернативных методов программирования (устройство только выполняет заданный алгоритм и не учится на ошибках), раздробленность разработок корпораций, энергоснабжение. Слабые места: зависимость элементов друг от друга (сбой датчика вызывает цепную реакцию), хакерские атаки, зависимость от энергии.</li>
<li>Стандарты IoT разрабатывают IEEE-SA и МСЭ (Международный союз электросвязи). Путь развития: умный дом → умный город → умная страна → умная планета.</li>
</ul>
<h3>Умный дом</h3>
<p><b>Умный дом</b> — жилой дом, организованный для удобства проживания людей при помощи высокотехнологичных устройств. Он реагирует на ситуации по заранее выработанным алгоритмам. Главный компонент любой «умной» системы — <b>контроллер</b>, его основная функция — <b>мониторинг</b>.</p>
<table>
<tr><th>Датчик</th><th>Что делает</th></tr>
<tr><td>Мультисенсор</td><td>Измеряет температуру, освещённость, открытие двери, присутствие человека</td></tr>
<tr><td>Датчик протечки</td><td>Определяет разлитую жидкость по замыканию контактов выносного щупа</td></tr>
<tr><td>Датчик задымления</td><td>Срабатывает при попадании частиц дыма в камеру</td></tr>
<tr><td>Датчик движения</td><td>Анализирует <b>инфракрасное излучение</b> тела человека</td></tr>
<tr><td>Умная розетка</td><td>Измеряет потребление энергии (кВт·ч), мощность (Вт), напряжение (В), ток (А)</td></tr>
</table>
<p><b>Исполнительные устройства</b> — элементы автоматики, создающие управляющее воздействие на объект: лампы, моторы, сервоприводы, кондиционер, пожаротушитель, динамики. Моделировать умный дом учебник предлагает в <b>Cisco Packet Tracer</b>, бесплатном симуляторе сетей и IoT. <b>IoT Manager</b> — мобильное приложение, совмещающее табло показаний датчиков и пульт управления.</p>
<h3>Мобильные приложения в MIT App Inventor</h3>
<ul>
<li><b>MIT App Inventor</b> — облачная среда визуальной разработки приложений для <b>Android</b>. Знать Java не нужно, программа собирается из блоков. Нужен аккаунт Google.</li>
<li>Два этапа и два режима: <b>«Дизайнер»</b> — интерфейс, «как это будет выглядеть»; <b>«Блоки»</b> — поведение, «как компоненты будут себя вести».</li>
<li>Окно дизайнера: <b>Палитра</b> (группы компонентов: кнопки, изображения, поля, датчики — акселерометр, GPS), <b>Просмотр</b> (экран приложения), <b>Компоненты</b> (уже добавленные), <b>Свойства</b>, <b>Медиа</b>.</li>
<li>В проекте не больше <b>10 экранов</b>: при создании 11-го появляется предупреждение. Запуск всегда со стартового экрана.</li>
<li>Правило имени компонента: «название компонента + действие», например «КнопкаНазад».</li>
<li>Группы блоков: <b>встроенные</b> (Управление, Логика, Математика, Текст, Массивы (списки), Цвета, Переменные, Процедуры), <b>блоки компонентов</b> (события и действия конкретных кнопок, полей), <b>«Любой компонент»</b> (для многих однотипных объектов).</li>
<li>Форматы: <b>.aia</b> — исходный код проекта, его можно редактировать; <b>.apk</b> — исполняемый файл для установки на устройство. Установить приложение можно по <b>QR-коду</b> через MIT AI2 Companion, для отладки без телефона есть <b>эмулятор</b>.</li>
</ul>
<p>Дизайн интерфейса. <b>Графический</b> дизайн отвечает за красоту, тон, стиль и фирменный стиль. <b>Информационный</b> — за визуализацию данных и навигации. Строительные блоки визуального дизайна: форма, размер, цвет, яркость, направление, текстура, расположение. Элементы управления делятся на командные (выполнить функцию), выбора, ввода и отображения.</p>

<h2>Стартап по учебнику: этапы, краудфандинг, продвижение</h2>
<h3>Понятие и характеристики</h3>
<ul>
<li><b>Startup</b> (Арман-ПВ) — компания с короткой историей операционной деятельности. Учебник связывает термин со Стивом Бланком. <b>Стартап</b> (глоссарий Атамұра) — временная организация для поиска масштабируемой, повторяемой и прибыльной бизнес-модели в условиях экстремальной неопределённости.</li>
<li>Пол Грэм (Y Combinator): «Startup = это рост». От малого бизнеса стартап отличает способность расти без географических ограничений.</li>
<li>Четыре характеристики: <b>интенсивный рост</b>, <b>инновационный подход к решению проблемы</b>, <b>гибкость</b> (готовность развернуть направление на 180°), <b>финансирование для роста</b>.</li>
<li>Цель стартапа — продажа крупной корпорации или выход акций на биржу. Каждый раз, получая деньги, стартап отдаёт часть компании, и инвестор становится совладельцем.</li>
<li><b>Бизнес-модель</b> — последовательность запланированных действий (бизнес-процессов) для получения прибыли. <b>Бизнес-план</b> — документ, описывающий бизнес-модель.</li>
</ul>
<table>
<tr><th>Этап запуска (Арман-ПВ)</th><th>Что происходит</th></tr>
<tr><td>Pre-seed</td><td>Идея сформирована, но нет понимания, как реализовать её и получать доход</td></tr>
<tr><td>Seed</td><td>Изучение рынка, детальный план, подготовка к запуску, поиск инвесторов</td></tr>
<tr><td>Прототип</td><td>Рабочая модель только с основными функциями</td></tr>
<tr><td>Альфа-версия</td><td>Тестирование, чтобы найти и устранить недостатки</td></tr>
<tr><td>Закрытая бета-версия</td><td>Тестирует небольшая приглашённая группа пользователей</td></tr>
<tr><td>Открытая бета-версия</td><td>Выход на рынок: продвижение, привлечение пользователей, продажи</td></tr>
</table>
<h3>Краудфандинг</h3>
<p><b>Краудфандинг</b> (народное финансирование; crowd — толпа, funding — финансирование) — сбор небольших сумм с большого числа людей через интернет. Спонсоров называют <b>бэккерами</b>. Платформы: Kickstarter (творческие проекты), IndieGoGo (любые идеи). В Казахстане: <b>Starttime.kz</b> и <b>BariBirge.kz</b> (первая платформа краудфандинга в Казахстане).</p>
<table>
<tr><th>Пять моделей Стивена Брэдфорда</th><th>Группа</th></tr>
<tr><td>Благотворительность</td><td rowspan="3">Патронажный краудфандинг: бэккеры получают незначительные льготы или ничего</td></tr>
<tr><td>Нефинансовое вознаграждение</td></tr>
<tr><td>Предварительный заказ</td></tr>
<tr><td>Привлечение заёмного капитала</td><td rowspan="2">Инвестиционный краудфандинг (<b>краудинвестинг</b>): есть финансовое вознаграждение</td></tr>
<tr><td>Привлечение акционерного капитала</td></tr>
</table>
<p>Поддержка стартапов в Казахстане: <b>НАТР</b> (Национальное агентство по технологическому развитию) и его программа <b>KazInno</b>, которая собирает проекты по четырём направлениям: АПК, биотехнологии и фармацевтика; IT-технологии; машиностроение; возобновляемые источники энергии. Также действуют StartUp.kz, iStartUpSchool, Atameken Startup, Astana Hub. <b>Акселераторы</b> помогают сформировать проект, написать бизнес-план и выйти на инвесторов.</p>
<h3>Продвижение и реклама</h3>
<p><b>Продвижение</b> — деятельность, направленная на повышение результативности продаж через коммуникативное стимулирование клиентов, партнёров и сотрудников.</p>
<table>
<tr><th>Метод продвижения</th><th>Суть</th><th>Недостаток</th></tr>
<tr><td>Реклама</td><td>Платные сообщения через СМИ, большой охват, дешёвый контакт</td><td>Нет обратной связи, трудно персонализировать</td></tr>
<tr><td>Личная продажа</td><td>Устное представление товара в беседе с покупателем</td><td>Высокие издержки</td></tr>
<tr><td>Общественные связи (PR)</td><td>Неоплачиваемое напрямую распространение сведений через СМИ</td><td>Только информирует, не продаёт</td></tr>
<tr><td>Стимулирование сбыта</td><td>Скидки, акции, поощрение покупки</td><td>Кратковременность</td></tr>
</table>
<p>Способы реализации продаж: <b>консультативный</b> (продавец-консультант для сложных дорогих товаров), <b>завершающий</b> (показ и получение заказа), <b>продажа через взаимоотношения</b>, <b>расположение товаров на витрине</b>.</p>
<p><b>Реклама</b> по Закону РК «О рекламе» — информация, распространяемая в любой форме и предназначенная для неопределённого круга лиц, чтобы формировать интерес к лицу, товару или услуге. Самая распространённая модель дохода IT-стартапа — <b>рекламная</b>: она окупается при высокой посещаемости и выводит на продажи B2B. <b>Рекламное обращение</b> — форма готовой рекламной продукции, с которой рекламодатель обращается к клиентам.</p>
<ul>
<li>Текстовые элементы объявления: тема, <b>слоган</b>, вводная часть, информационный блок, справочные данные, <b>эхо-фраза</b>.</li>
<li>Изобразительные элементы: фотографии, шрифты, цвета, графические элементы, «воздух» (свободное пространство), форма объявления.</li>
</ul>
<p><b>Инфографика</b> — графический способ передачи информации, данных и знаний. Виды: <b>статистическая</b> (факты и цифры, самая простая), <b>«Карты»</b> (самая универсальная), <b>«Иерархия»</b> (положение и ранжирование объектов, например пирамида Маслоу), <b>«Матрица»</b> (много данных об одной проблеме), <b>«Фото»</b>. Сервисы: Canva, Infogram, Piktochart, Easel.ly.</p>

<h2>Цифровизация Казахстана и блокчейн</h2>
<p><b>Цифровизация</b> — трансформация экономики и общества за счёт массового внедрения цифровых технологий. Её цель в Казахстане — ускорить развитие экономики и улучшить качество жизни. Основа — госпрограмма <b>«Цифровой Казахстан»</b> (постановление Правительства № 827 от 12 декабря 2017 года).</p>
<table>
<tr><th>Пять направлений</th><th>Задачи</th></tr>
<tr><td>Цифровизация отраслей экономики</td><td>Промышленность и энергетика, транспорт и логистика, сельское хозяйство, электронная торговля, финтех и безналичные платежи</td></tr>
<tr><td>Переход к цифровому государству</td><td>Государство — гражданам, государство — бизнесу, умные города, цифровизация госорганов</td></tr>
<tr><td>Цифровой Шёлковый путь</td><td>Сети связи и ИКТ-инфраструктура, информационная безопасность</td></tr>
<tr><td>Развитие человеческого капитала</td><td>Цифровая грамотность в школах, колледжах, вузах и у населения</td></tr>
<tr><td>Инновационная экосистема</td><td>Технологическое предпринимательство, стартапы и НИОКР, венчурное финансирование</td></tr>
</table>
<p>Тенденции по учебнику: <b>Big Data</b> (методы хранения и изучения огромных массивов, которые нельзя продуктивно обработать традиционными СУБД), <b>блокчейн</b>, <b>Smart City</b> (концепция управления городским имуществом и услугами для повышения качества жизни).</p>
<h3>Блокчейн по учебнику</h3>
<ul>
<li><b>Блокчейн</b> (block — блок, chain — цепочка) — непрерывная последовательная цепочка блоков, построенная по определённым правилам. Копии хранятся на разных компьютерах независимо друг от друга.</li>
<li><b>Блоки</b> — данные о транзакциях, сделках и контрактах в криптографической форме, связанные в цепочку.</li>
<li>Виды: <b>публичный</b> (каждый может читать и записывать), <b>приватный</b> (есть ограничения, могут быть приоритетные узлы), <b>эксклюзивный</b> (подвид приватного: транзакции обрабатывает установленная группа лиц).</li>
<li>Преимущества из-за дублирования данных: <b>надёжность</b>, <b>децентрализованность</b> (нет единого центра), <b>прозрачность</b> (подделку быстро заметят). Изменить блок нельзя, можно только добавлять новые записи.</li>
<li>Недостаток: систему нельзя использовать там, где возможно юридическое вмешательство, например оспаривание транзакции в суде.</li>
</ul>
<p>Схема перевода из учебника: А хочет перевести деньги В → транзакции передаются в сеть и собираются в блок с номером и хешем предыдущего блока → блоки рассылаются всем участникам для проверки → если ошибок нет, каждый записывает блок в свой экземпляр базы → блок добавляется к цепочке → деньги переведены.</p>
`,

<h2>Виртуальные машины</h2>
<p><b>Виртуальная машина (ВМ)</b> — искусственно созданный с помощью специального ПО виртуальный компьютер, «компьютер в компьютере». Она использует часть ресурсов основного компьютера: оперативную память, процессор, жёсткий диск. На ВМ ставят полноценную ОС со своим виртуальным диском. Основную систему называют <b>хостовой</b>, систему внутри ВМ — <b>гостевой</b>. Программу, которая распределяет ресурсы между ВМ, называют <b>гипервизором</b>.</p>
<p>Зачем нужна ВМ: установить другую ОС; тестировать программы; безопасно запускать подозрительные программы; эмулировать компьютерную сеть; запускать приложения, несовместимые с основной ОС.</p>
<table>
<tr><th>Вид ВМ</th><th>Описание</th></tr>
<tr><td>Процессная</td><td>Платформа для одного процесса: создаётся при его запуске и удаляется после окончания. Пример — виртуальная машина Java (JVM)</td></tr>
<tr><td>Системная</td><td>Постоянная полнофункциональная среда для целой ОС с её процессами. Даёт гостевой ОС доступ к виртуальному процессору, памяти, устройствам ввода-вывода</td></tr>
</table>
<table>
<tr><th>Программа</th><th>Особенности по учебнику</th></tr>
<tr><td>VirtualBox</td><td>Бесплатная. Windows, Linux, FreeBSD, Mac OS; 32- и 64-разрядные ОС; открывает машины VMware</td></tr>
<tr><td>VMware Workstation / Player</td><td>Workstation — мощная платная версия для крупных компаний; Player — бесплатная урезанная</td></tr>
<tr><td>Microsoft Virtual PC</td><td>Бесплатная, но работает только с Windows</td></tr>
</table>
<p>Плюсы ВМ: несколько ОС на одном компьютере, простое управление, аварийное восстановление. Минусы: ВМ работает медленнее физического компьютера, несколько ВМ на одной машине могут работать нестабильно. Учебник Атамұра называет и разновидности виртуализации: серверов, операционных систем, центров обработки данных.</p>

<h2>Мобильные устройства</h2>
<p><b>Мобильное устройство</b> — небольшое портативное устройство с дисплеем, которое можно держать в руке: смартфон, планшет, электронная книга, ноутбук (ультрабук, нетбук). <b>Электронная книга</b> работает на матрице <b>e-ink</b> без подсветки, которая выглядит как бумага. Автономность по учебнику: электронная книга 3–10 дней, смартфон 1–3 дня, планшет до 10 часов. <b>Форм-фактор</b> (типоразмер) — стандарт, задающий габариты и форму устройства.</p>
<table>
<tr><th>Модуль</th><th>Назначение и характеристики</th></tr>
<tr><td>Аккумуляторная батарея (АКБ)</td><td>Основной источник питания. Номинальное напряжение 3,6–3,7 В, заряженная 4,2–4,3 В, ёмкость примерно 700–5000 мА·ч. Со временем необратимо <b>стареет</b>: теряет ёмкость. Встроенная плата защищает от короткого замыкания, перегрева, глубокого разряда и перезаряда</td></tr>
<tr><td>Контроллер питания</td><td>Преобразует напряжение АКБ для разных узлов и управляет зарядкой</td></tr>
<tr><td>Системная плата</td><td>Несёт процессор, память, видеоускоритель. Боится влаги, температуры, скачков напряжения</td></tr>
<tr><td>Процессор (CPU)</td><td>«Мозг» устройства: выполняет команды, выводит изображение, обрабатывает сигналы сети и камеры</td></tr>
<tr><td>RAM (ОЗУ)</td><td>Временное хранение данных работающих приложений</td></tr>
<tr><td>Дисплей</td><td>Характеристики: разрешение (число пикселей) и число цветов: 4096 → 65 тыс. → 262 тыс. → 16 млн</td></tr>
<tr><td>Сенсорный экран</td><td>Типы: резистивный, ёмкостный, матричный, проекционно-ёмкостный, на поверхностно-акустических волнах, инфракрасный. Чаще всего встречаются первые три</td></tr>
<tr><td>Приёмопередатчик и антенна</td><td>Приём и передача сотового сигнала GSM</td></tr>
</table>
<p><b>GSM</b> — глобальный стандарт цифровой сотовой связи с разделением каналов по времени (TDMA) и частоте (FDMA). <b>Bluetooth</b> — беспроводная персональная сеть (WPAN): около 10 м в старых версиях, по учебнику до 1500 м начиная с Bluetooth 5. <b>Android</b> — бесплатная ОС с открытым кодом на ядре Linux. Linux — Unix-подобная система, поэтому в тестах встречается и формулировка «на базе ядра Unix».</p>
<div class="task"><b>Задача (связь с темой 03)</b>Дисплей показывает 262 144 цвета. Какова глубина цвета? Сколько байт видеопамяти нужно для кадра 1080 × 2400 при 16,7 млн цветов?
<details class="sol"><summary>Решение</summary>262 144 = 2¹⁸, глубина 18 бит. 16,7 млн ≈ 2²⁴, то есть 24 бита = 3 байта. Кадр: 1080 · 2400 · 3 = 7 776 000 байт ≈ 7,4 МиБ.</details></div>
<div class="task"><b>Задача</b>Аккумулятор ёмкостью 5000 мА·ч питает смартфон со средним током 500 мА. Сколько он проработает? Какую энергию запасает аккумулятор при 3,7 В?
<details class="sol"><summary>Решение</summary>5000 / 500 = 10 ч. Энергия 5 А·ч · 3,7 В = 18,5 Вт·ч.</details></div>

<h2>Закономерности развития аппаратного и программного обеспечения</h2>
<ol>
<li><b>Наследование основных принципов</b>: все поколения используют программное управление и двоичное представление информации.</li>
<li><b>Вещественно-энергетическая и информационная целостность</b>: процессы обработки вещества, энергии и информации взаимосвязаны.</li>

<li><b>Наследование основных функций PMTC</b>: Processing (обработка), Memory (хранение), Transfer (передача), Control (управление). Сильнее всего меняются сервисные функции.</li>

<li><b>Аппаратные и программные решения</b>: аппаратное решение быстрее, но дороже и менее гибко; программное дешевле и легко обновляется, но требует мощного компьютера.</li>
<li><b>Преемственность технологий</b>: технология устаревает и возвращается на новом уровне.</li>
</ol>

ext("t02",{html:String.raw`
<h2>Правовая защита информации по учебнику 11 класса</h2>
<p><b>Правовая защита информации</b> — специальные законы, нормативные акты, правила, процедуры и мероприятия, обеспечивающие защиту информации на правовой основе. На международном уровне её обеспечивают договоры и конвенции, на практике — патенты, авторское право и лицензии. В Казахстане это Конституция, законы, гражданский, административный и уголовный кодексы.</p>
<table>
<tr><th>Закон РК</th><th>Дата</th></tr>
<tr><td>«Об авторском праве и смежных правах»</td><td>10 июня 1996 года</td></tr>
<tr><td>«Об электронном документе и электронной цифровой подписи»</td><td>7 января 2003 года</td></tr>
<tr><td>«О доступе к информации»</td><td>16 ноября 2015 года</td></tr>
</table>
<ul>
<li><b>Персональные данные</b> — конфиденциальная информация. Собирать и распространять сведения о частной жизни без согласия человека нельзя, кроме как по решению суда.</li>
<li><b>Коммерческая тайна</b> — вид конфиденциальной информации. Защищается законом, только если выполнены все три условия: информация имеет коммерческую ценность из-за неизвестности третьим лицам; к ней нет свободного законного доступа; владелец принимает меры к охране её конфиденциальности.</li>
<li><b>Интеллектуальная собственность</b> — исключительные права личного и имущественного характера на результаты интеллектуальной и творческой деятельности. <b>Авторское право</b> — личные неимущественные и имущественные права автора.</li>
<li><b>Пиратство</b> — копирование, использование и распространение ПО без разрешения правообладателя. <b>Плагиат</b> — намеренное присвоение авторства чужого произведения или изобретения.</li>
</ul>
<table>
<tr><th>Институт интеллектуальной собственности</th><th>Объекты</th></tr>
<tr><td>Авторское право и смежные права</td><td>Произведения науки, литературы, искусства (авторское); исполнения, звуко- и видеозаписи, радио- и телепередачи (смежные)</td></tr>
<tr><td>Патентное право</td><td>Изобретения, полезные модели, промышленные образцы</td></tr>
<tr><td>Средства индивидуализации</td><td>Фирменные наименования, товарные знаки, знаки обслуживания, наименования мест происхождения товаров</td></tr>
<tr><td>Нетрадиционные объекты</td><td>Селекционные достижения, топологии интегральных микросхем, служебная и коммерческая тайна</td></tr>
</table>

<h2>ЭЦП и сертификаты в Казахстане</h2>
<p>ЭЦП внедрили в Казахстане в <b>2008 году</b>. По закону <b>электронная цифровая подпись</b> — набор электронных цифровых символов, созданный средствами ЭЦП и подтверждающий достоверность электронного документа, его принадлежность и неизменность содержания. Электронный документ, удостоверенный ЭЦП, имеет ту же юридическую силу, что и бумажный с собственноручной подписью.</p>
<table>
<tr><th>Понятие</th><th>Смысл</th></tr>
<tr><td>Закрытый ключ</td><td>Известен только владельцу, им <b>создают</b> подпись</td></tr>
<tr><td>Открытый ключ</td><td>Доступен всем, им <b>проверяют</b> подлинность подписи</td></tr>
<tr><td>Регистрационное свидетельство</td><td>В международной практике <b>сертификат открытого ключа</b>. Выдаёт удостоверяющий центр</td></tr>
<tr><td>НУЦ РК</td><td>Национальный удостоверяющий центр, обслуживает участников «электронного правительства» (pki.gov.kz)</td></tr>
<tr><td>Корневой сертификат</td><td>Сертификат центра сертификации. По нему проверяют достоверность всех выданных центром сертификатов, поэтому его заранее устанавливают в ОС или браузер</td></tr>
<tr><td>RSA и AUTH_RSA</td><td>RSA — для <b>подписания</b> запросов и документов, AUTH_RSA — для <b>аутентификации</b> (входа на портал)</td></tr>
</table>
<p>Порядок получения: установка корневых сертификатов → установка Java → подача заявления на pki.gov.kz (нужен ИИН) → подтверждение в <b>ЦОН</b> или НУЦ → получение сертификатов. Где хранят ключи: файловая система, удостоверение личности, Kaztoken, eToken, JaCarta, SIM-карта. НУЦ не хранит пароли: утерянный пароль ЭЦП не восстанавливается. История: идею цифровой подписи предложили У. Диффи и М. Хеллман (1976), алгоритм RSA создали Р. Ривест, А. Шамир и Л. Адлеман (1977).</p>

<h2>Электронное правительство</h2>
<p><b>Электронное правительство</b> — единый механизм взаимодействия государства с гражданами и госорганов друг с другом, обеспечивающий их согласованность при помощи информационных технологий. Идею впервые озвучили в <b>2004 году</b>, портал — <b>egov.kz</b>, единый контакт-центр — <b>1414</b>.</p>
<table>
<tr><th>Этап развития</th><th>Что появилось</th></tr>
<tr><td>1. Информационный</td><td>Портал наполнен сведениями о госорганах и их услугах</td></tr>
<tr><td>2. Интерактивный</td><td>Электронные услуги: справки, запросы в госорганы с отслеживанием статуса</td></tr>
<tr><td>3. Транзакционный</td><td>Онлайн-оплата пошлин, штрафов, коммунальных услуг</td></tr>
<tr><td>4. Трансформационный</td><td>Интерактивные и транзакционные сервисы объединены в комплексные услуги</td></tr>
</table>
<p>Мобильная версия eGov работает на iOS и Android. Телефон привязывают к ИИН в личном кабинете или в ЦОНе, после чего часть услуг доступна по одноразовому коду: справки о недвижимости, запись к врачу, прикрепление к поликлинике.</p>
`,

ext("t12",{html:String.raw`
<h2>Электронные таблицы в учебнике 11 класса</h2>
<p>В учебнике электронная таблица служит моделью нейрона. Активация считается формулой <code>=B1*B2+D1*D2</code>, выход — <code>=ЕСЛИ(C3&gt;=C4;1;0)</code>. Функция <b>ВЫБОР(номер; значение1; значение2; …)</b> возвращает значение по номеру: <code>=ВЫБОР(F8;F2;F3;F4;F5)</code> при F8 = 3 вернёт содержимое F4. Ошибка считается как <code>=C7-C5</code>, изменение веса как <code>=F11*C8*B1</code>. Формула вида <code>B2 = B11</code>, где B11 зависит от B2, создаёт <b>циклическую ссылку</b>. Чтобы Excel её посчитал, в параметрах включают <b>итеративные вычисления</b>.</p>
<p>В практикуме по регрессии на диаграмму добавляют <b>линию тренда</b> с уравнением и величиной достоверности аппроксимации <b>R²</b>, а надстройка «Пакет анализа» → «Регрессия» выдаёт коэффициенты модели <span class="f">Y = kX + b</span>.</p>
`,

<h2>По учебнику 10 класса: процедуры и функции</h2>
<p>В учебниках подпрограммы делятся на два вида. В самом Python различия нет: обе записываются через <code>def</code>.</p>
<table>
<tr><th>Термин учебника</th><th>Что значит</th><th>Пример</th></tr>
<tr><td>Процедура</td><td>Вспомогательный алгоритм, который выполняет действия и <b>не возвращает</b> значение (технически возвращает <code>None</code>)</td><td><code>def Err(): print("Ошибка")</code></td></tr>
<tr><td>Функция</td><td>Подпрограмма, которая <b>возвращает</b> значение оператором <code>return</code></td><td><code>def add(x, y): return x + y</code></td></tr>
<tr><td>Параметр</td><td>Локальная переменная в заголовке, получает значение при вызове</td><td><code>x</code>, <code>y</code></td></tr>
<tr><td>Аргумент</td><td>Конкретное значение, переданное при вызове</td><td><code>add(5, 6)</code></td></tr>
<tr><td>Глобальная переменная</td><td>Объявлена в основной программе, видна везде</td><td></td></tr>
<tr><td>Локальная переменная</td><td>Объявлена внутри подпрограммы, видна только там</td><td></td></tr>
</table>
<ul>
<li>Подпрограмму нужно <b>определить до вызова</b>. Вызов — имя и скобки: <code>Err()</code>.</li>
<li>Встроенные функции учебник делит на две группы: работающие с символами (<code>ord()</code>, <code>chr()</code>, <code>len()</code>) и математические (<code>abs()</code>, <code>round()</code>, <code>divmod()</code>, <code>pow()</code>, <code>max()</code>, <code>min()</code>, <code>sum()</code>).</li>
<li><code>*args</code> — функция принимает любое число аргументов. <b>Лямбда-функция</b> — функция без имени: <code>lambda x, y: x + y</code>.</li>
<li>Определение подпрограммы по В. Ф. Очкову: «припев песни, который поют несколько раз, а печатают один раз».</li>
</ul>

<h2>Рекурсия: термины учебника</h2>
<ul>
<li><b>Рекурсия</b> (от лат. recursio — возвращение) — способ описания объектов или процессов через самих себя. <b>Рекурсивная функция</b> вызывает сама себя непосредственно (<b>прямая</b> рекурсия) или через другие функции (<b>косвенная</b>).</li>
<li><b>Базовый случай</b> — условие остановки, без него рекурсия бесконечна. <b>Шаг рекурсии</b> — обращение функции к себе с другим значением параметра, которое приближает к базовому случаю.</li>
<li><b>Глубина рекурсии</b> — общее количество вложенных вызовов. Для <code>factorial(n)</code> по учебнику всего <b>n + 1</b> вызов: factorial(2) → factorial(1) → factorial(0).</li>
<li>При каждом вызове компьютер запоминает <b>адрес возврата</b> в <b>стеке</b>, специальной области ОЗУ. Бесконечная рекурсия переполняет стек, и программа аварийно завершается.</li>
</ul>
<div class="task"><b>Задача (формат теста Атамұра)</b>Чему равна сумма чисел, которые напечатает вызов F(11)?
[[py]]
def F(n):
    if n > 3:
        print(n)
        F(n - 2)
        F(n - 5)
[[/py]]
<details class="sol"><summary>Решение</summary>Обозначим S(n) — сумму напечатанного. S(n) = 0 при n ≤ 3, иначе S(n) = n + S(n − 2) + S(n − 5). Считаем снизу: S(4) = 4, S(5) = 5, S(6) = 6 + S(4) = 10, S(7) = 7 + S(5) = 12, S(8) = 8 + S(6) = 18, S(9) = 9 + S(7) + S(4) = 25, S(10) = 10 + S(8) + S(5) = 33, S(11) = 11 + S(9) + S(6) = 46. Ответ: 46.</details></div>

<h2>Строки по учебнику: форматирование и методы</h2>
<p>Строка в Python — <b>неизменяемый</b> объект: <code>s[0] = "h"</code> вызовет ошибку TypeError. Чтобы изменить строку, собирают новую из частей. Учебник показывает два старых способа форматирования и <code>format()</code>:</p>
[[py]]
print("one %d %f" % (2, 3.5))        # one 2 3.500000
print("%.2f" % 3.14159)              # 3.14
print("{1}-{0}-{1}".format("a", "b"))  # b-a-b
s = "Python"
print(f"{s} {len(s)}")               # Python 6
[[/py]]
<table>
<tr><th>Спецификатор %</th><th>Что подставляет</th></tr>
<tr><td>%s</td><td>строку</td></tr>
<tr><td>%d, %i</td><td>целое десятичное</td></tr>
<tr><td>%f</td><td>вещественное (по умолчанию 6 знаков после запятой)</td></tr>
<tr><td>%o, %x, %X</td><td>восьмеричное, шестнадцатеричное, шестнадцатеричное заглавными</td></tr>
<tr><td>%e</td><td>экспоненциальная запись</td></tr>
</table>
<p>Методы из таблицы учебника: <code>split()</code> (разбивает строку на список), <code>join()</code> (собирает список в строку), <code>find()</code> (индекс первого вхождения или <b>−1</b>), <code>replace()</code>, <code>isdigit()</code> (True, если <b>все</b> символы — цифры), <code>isalpha()</code>, <code>upper()</code>, <code>lower()</code>, <code>isupper()</code>, <code>islower()</code>, <code>strip()</code>, <code>lstrip()</code>, <code>rstrip()</code>.</p>
<div class="task"><b>Задача</b>Что напечатает программа?
[[py]]
text = "Hello, world!"
marks = ".,!?"
n = marks.find(text[5])
print(n)
[[/py]]
<details class="sol"><summary>Решение</summary>text[5] — шестой символ, запятая. В строке marks запятая стоит под индексом 1. Ответ: 1.</details></div>

<h2>Файлы по учебнику</h2>
<p>Этапы работы с файлом: <b>открытие</b> → <b>работа</b> (чтение или запись) → <b>закрытие</b>. Файлы бывают <b>текстовые</b> и <b>двоичные</b> (бинарные: изображения, звук, видео).</p>
<table>
<tr><th>Режим open()</th><th>Действие</th></tr>
<tr><td>"r"</td><td>Чтение (режим по умолчанию)</td></tr>
<tr><td>"w"</td><td>Запись. Если файл существует, его содержимое <b>удаляется</b></td></tr>
<tr><td>"a"</td><td>Добавление в конец файла</td></tr>
<tr><td>"r+", "w+"</td><td>Чтение и запись</td></tr>
<tr><td>"rb", "wb"</td><td>Чтение или запись в двоичном формате</td></tr>
</table>
<p>Методы и свойства: <code>read(count)</code> читает count символов или весь файл, <code>readline()</code> — одну строку, <code>write()</code> записывает строку, <code>close()</code> закрывает файл. Свойства <code>closed</code> (True, если файл закрыт), <code>mode</code> (режим), <code>name</code> (имя).</p>

<h2>Сортировки по учебнику</h2>
<ul>
<li>Упорядочение по возрастанию с повторами называют <b>неубыванием</b>, по убыванию с повторами — <b>невозрастанием</b>.</li>
<li><b>Внутренняя</b> сортировка работает в оперативной памяти, <b>внешняя</b> — с данными на внешних носителях.</li>
<li><b>Простые</b> сортировки (выбором, пузырьковая) требуют порядка C·N² действий. <b>Улучшенные</b> (например, быстрая сортировка Хоара) сложнее, но эффективнее.</li>
<li><b>Сортировка выбором</b>: найти минимальный элемент неотсортированной части и поменять его с её первым элементом. Для массива из N элементов нужно N − 1 проходов.</li>
<li><b>Пузырьковая сортировка</b> сравнивает соседние элементы. Число сравнений в простом варианте <span class="f">n(n − 1)/2</span>: для 10 элементов 45. <b>Оптимизированный</b> вариант с флагом <code>swapped</code> останавливается, если за проход не было ни одного обмена.</li>
</ul>
<div class="note trap"><b>Учебники проходят пузырёк в разные стороны</b>В Арман-ПВ сравнение идёт слева направо, и за первый проход в <b>конец</b> массива уходит наибольший элемент. В Атамұра внутренний цикл идёт с конца (<code>range(N-2, i-1, -1)</code>), и в <b>начало</b> массива поднимается наименьший. В задании смотрите на код, а не на название.</div>
<div class="task"><b>Задача</b>Массив [5, 1, 9, 2, 7] сортируют по возрастанию пузырьком. Каким он станет после первого прохода: а) слева направо (Арман-ПВ); б) справа налево (Атамұра)?
<details class="sol"><summary>Решение</summary>а) 5 и 1 меняются → [1, 5, 9, 2, 7]; 5 и 9 нет; 9 и 2 меняются → [1, 5, 2, 9, 7]; 9 и 7 меняются → <b>[1, 5, 2, 7, 9]</b>, максимум в конце. б) 2 и 7 не меняются; 9 и 2 меняются → [5, 1, 2, 9, 7]; 1 и 2 нет; 5 и 1 меняются → <b>[1, 5, 2, 9, 7]</b>, минимум в начале.</details></div>
<div class="task"><b>Задача</b>Что будет в массиве [40, 25, 90, 3, −2, 11] после второго прохода сортировки выбором (минимум ставится в начало неотсортированной части)?
<details class="sol"><summary>Решение</summary>Проход 1: минимум −2 меняется с 40 → [−2, 25, 90, 3, 40, 11]. Проход 2: минимум оставшейся части 3 меняется с 25 → <b>[−2, 3, 90, 25, 40, 11]</b>.</details></div>
<p>Встроенные средства: <code>sorted(a)</code> возвращает новый отсортированный список, <code>a.sort()</code> сортирует сам список, <code>a.reverse()</code> только <b>переворачивает</b> порядок и ничего не сортирует.</p>

<h2>Графы по учебнику</h2>
<p><b>Граф</b> — совокупность двух конечных множеств: <b>вершин</b> (узлов) и <b>рёбер</b> (дуг), попарно соединяющих некоторые вершины. Первую работу по теории графов написал Леонард Эйлер в 1736 году (задача о кёнигсбергских мостах). По учебнику Атамұра, термин «граф» ввёл Денеш Кёниг в 1936 году.</p>
<table>
<tr><th>Понятие</th><th>Определение</th></tr>
<tr><td>Ориентированный (орграф) / неориентированный / смешанный</td><td>Все рёбра имеют направление / ни одно не имеет / есть и те, и другие</td></tr>
<tr><td>Петля</td><td>Ребро, соединяющее вершину саму с собой</td></tr>
<tr><td>Кратные рёбра</td><td>Несколько рёбер между одной парой вершин</td></tr>
<tr><td>Простой граф / мультиграф</td><td>Без петель и кратных рёбер / с кратными рёбрами</td></tr>
<tr><td>Смежные вершины</td><td>Соединены ребром</td></tr>
<tr><td>Маршрут</td><td>Чередующаяся последовательность смежных вершин и рёбер. Открытый — концы различны, замкнутый — совпадают</td></tr>
<tr><td>Цепь</td><td>Маршрут, в котором все <b>рёбра</b> различны</td></tr>
<tr><td>Путь</td><td>Открытая цепь, в которой все <b>вершины</b> различны</td></tr>
<tr><td>Цикл</td><td>Замкнутая цепь, в которой различны все вершины, кроме концевых</td></tr>
<tr><td>Связный граф</td><td>Между любыми двумя вершинами есть путь</td></tr>
<tr><td>Взвешенный граф</td><td>Каждому ребру сопоставлено число (вес): длина, стоимость, пропускная способность</td></tr>
</table>
<h3>Способы представления графа</h3>
<table>
<tr><th>Способ</th><th>Размер и особенности</th></tr>
<tr><td>Список рёбер</td><td>m пар вершин (плюс вес). Удобен для многих алгоритмов</td></tr>
<tr><td>Матрица смежности</td><td>n × n. На пересечении строки A и столбца B — число рёбер (1 или 0). У неориентированного графа <b>симметрична</b> относительно главной диагонали, петля стоит на диагонали. Число рёбер = сумма элементов / 2</td></tr>
<tr><td>Весовая матрица</td><td>n × n с весами рёбер. Отсутствие ребра обозначают 0, −1 или очень большим числом (∞)</td></tr>
<tr><td>Матрица инцидентности</td><td><b>n × m</b>: строки — вершины, столбцы — рёбра. Ненулевое значение означает, что вершина является концом ребра</td></tr>
</table>
<h3>Обходы и «жадный» алгоритм</h3>
<ul>
<li><b>Поиск в глубину (DFS)</b>: идти по рёбрам до тупика (все соседи посещены), затем возвращаться назад. Реализуется рекурсией или <b>стеком</b>.</li>
<li><b>Поиск в ширину (BFS)</b>: сначала все вершины на расстоянии 1, затем 2 и т. д. Использует <b>очередь</b> (добавление в конец, удаление из начала) и сразу находит длину кратчайшего маршрута по числу рёбер. Если в коде элемент берётся <code>pop(0)</code> из начала списка, это очередь, как бы ни называлась переменная.</li>
<li><b>«Жадный» алгоритм</b> на каждом шаге делает локально лучший выбор, например идёт к ближайшей вершине. Он <b>не всегда</b> находит оптимальное решение.</li>
<li><b>Задача Прима–Краскала</b> (минимальное остовное дерево): соединить все N вершин рёбрами минимальной суммарной длины без циклов. Жадный выбор здесь всегда даёт оптимум. В дереве ровно <b>N − 1</b> ребро.</li>
</ul>
<div class="task"><b>Задача (формат теста Атамұра)</b>Длины дорог: A–B 1, A–C 4, B–C 6, B–D 8, C–E 2, D–F 1, E–F 3. Какой путь из A в F построит «жадный» алгоритм (каждый раз идти по самой короткой дороге в ещё не посещённую вершину)? Оптимален ли он?
<details class="sol"><summary>Решение</summary>Из A ближе всего B (1). Из B: C (6) или D (8), выбираем C. Из C: E (2). Из E: F (3). Жадный путь A–B–C–E–F длиной 1 + 6 + 2 + 3 = 12. Кратчайший путь A–C–E–F = 4 + 2 + 3 = 9, поэтому жадный ответ не оптимален.</details></div>

`,

ext("t09",{html:String.raw`
<h2>По учебнику 10 класса: ключи, связи, типы данных</h2>
<ul>
<li><b>База данных</b> — совместно используемый набор логически связанных данных (и их описание), предназначенный для информационных потребностей организации. <b>СУБД</b> — ПО, с помощью которого определяют, создают и поддерживают базы данных и получают контролируемый доступ к ним. Примеры реляционных СУБД: MySQL, PostgreSQL.</li>
<li><b>Первичный ключ (PK)</b> — <b>минимальный</b> набор полей, уникально идентифицирующий запись. Три признака: это набор полей; каждое значение определяет единственную запись; набор минимален.</li>
<li><b>Естественный (логический)</b> ключ строится из реальных характеристик: номер паспорта, ИИН. <b>Суррогатный (искусственный)</b> — дополнительное поле, обычно целочисленный <code>id</code>. Его вводят, когда естественный ключ громоздкий или его трудно выделить.</li>
<li><b>Внешний ключ</b> — поле, значения которого ссылаются на первичный ключ другой таблицы. Он организует связи между родительской и дочерней таблицами и поддерживает <b>ссылочную целостность</b>.</li>
<li><b>Индекс</b> ускоряет поиск: без него таблица просматривается с первой записи, а с индексом СУБД сразу находит нужную позицию.</li>
<li>Связи: «один-к-одному», «один-ко-многим», «многие-ко-многим». Связь «многие-ко-многим» в реляционной базе заменяют двумя связями «один-ко-многим» через дополнительную (связующую) таблицу.</li>
</ul>
<h3>Типы данных MySQL</h3>
<table>
<tr><th>Тип</th><th>Особенность</th></tr>
<tr><td>CHAR(n)</td><td>Строка <b>фиксированной</b> длины, дополняется пробелами (до 255 символов)</td></tr>
<tr><td>VARCHAR(n)</td><td>Строка <b>переменной</b> длины</td></tr>
<tr><td>TINYTEXT, TEXT, MEDIUMTEXT, LONGTEXT</td><td>Длинные тексты разного размера</td></tr>
<tr><td>TINYINT, SMALLINT, MEDIUMINT, INT, BIGINT</td><td>Целые от 1 до 8 байт. UNSIGNED — только неотрицательные</td></tr>
<tr><td>DATE / DATETIME</td><td>Формат 'YYYY-MM-DD' / 'YYYY-MM-DD HH:MI:SS'</td></tr>
</table>
<p>В тестах Атамұра встречаются и типы полей настольных СУБД: текстовый, числовой, дата/время, <b>логический</b> (Да/Нет), <b>OLE</b> (вложенный объект или файл), счётчик, денежный.</p>
`,
traps:["Первичный ключ должен быть минимальным: лишние поля в него не включают.","Связь «многие-ко-многим» реализуют через третью (связующую) таблицу.","CHAR — фиксированная длина, VARCHAR — переменная."],
quiz:tbMix([
{t:"single",lv:"A",q:"Как называется дополнительное поле id, введённое только для однозначной идентификации записей?",opts:["Суррогатный ключ","Естественный ключ","Внешний ключ","Индекс"],a:0},
{t:"single",lv:"B",q:"Как в реляционной базе реализуют связь «многие-ко-многим»?",opts:["Через дополнительную таблицу и две связи «один-ко-многим»","Через одну связь «один-к-одному»","Объединяя таблицы в одну","Это невозможно"],a:0},
{t:"single",lv:"B",q:"Чем тип CHAR(10) отличается от VARCHAR(10) в MySQL?",opts:["CHAR хранит строку фиксированной длины, VARCHAR — переменной","CHAR хранит числа, VARCHAR — текст","VARCHAR не может содержать цифры","Разницы нет"],a:0},
{t:"single",lv:"A",q:"В каком формате MySQL хранит значение типа DATE?",opts:["YYYY-MM-DD","DD.MM.YYYY","MM/DD/YYYY","YYYYMMDD HH:MI"],a:0},
{t:"multi",lv:"A",q:"Какие поля подходят в качестве первичного ключа таблицы сотрудников?",opts:["ИИН сотрудника","Порядковый номер сотрудника (уникальный)","Фамилия","Дата рождения","Должность"],a:[0,1]},
{t:"match",lv:"A",q:"Установите соответствие между полем таблицы и подходящим типом данных.",left:["Занимается в секции (Да/Нет)","Дата рождения","Фото достижения (файл)"],right:["Числовой","Логический","OLE","Дата/время"],a:[1,3,2]}
])});

ext("t10",{html:String.raw`
<h2>SQL по учебнику 10 класса</h2>
<p>Перед выполнением запроса сервер проверяет три вещи: есть ли разрешение на выполнение выражения, есть ли доступ к данным, правилен ли синтаксис. Затем <b>оптимизатор запросов</b> выбирает самый эффективный план с учётом порядка соединения таблиц и индексов. Результат возвращается как <b>результирующий набор</b> (result set).</p>
<table>
<tr><th>Блок SELECT</th><th>Назначение</th><th>Обязателен (по Атамұра)</th></tr>
<tr><td>SELECT</td><td>Какие столбцы включить в результат</td><td>Да</td></tr>
<tr><td>FROM</td><td>Из каких таблиц брать данные и как их соединить</td><td>Да</td></tr>
<tr><td>WHERE</td><td>Отбор строк до группировки</td><td>Нет</td></tr>
<tr><td>GROUP BY</td><td>Группировка строк с одинаковыми значениями</td><td>Нет</td></tr>
<tr><td>HAVING</td><td>Отбор групп после группировки</td><td>Нет</td></tr>
<tr><td>ORDER BY</td><td>Сортировка: ASC (по возрастанию, по умолчанию) или DESC</td><td>Нет</td></tr>
</table>
<p>Блок SELECT записывается первым, но сервер обрабатывает его <b>одним из последних</b>: сначала FROM, затем WHERE, GROUP BY, HAVING, потом SELECT и ORDER BY. В блоке FROM могут стоять три типа таблиц: <b>постоянные</b> (созданные CREATE TABLE), <b>временные</b> (результат подзапроса) и <b>виртуальные</b> (представления, CREATE VIEW).</p>
<p><code>DELETE FROM имя WHERE условие;</code> удаляет записи навсегда. Без WHERE будут удалены <b>все</b> строки таблицы.</p>
<div class="task"><b>Задача (формат теста Атамұра)</b>Записи о погоде (температура, осадки): (+12, дождь), (+7, дождь), (+5, нет), (+9, дождь), (+10, дождь), (+3, снег), (+8, дождь), (+11, нет). Сколько записей удовлетворяют условию Осадки = «дождь» И Температура &lt; 10?
<details class="sol"><summary>Решение</summary>Подходят +7, +9 и +8. Запись +10 не подходит: 10 не меньше 10. Ответ: 3.</details></div>
<div class="task"><b>Задача</b>В таблице goods есть поля name, category, maker, sale_date. Запишите запрос: кондитерские изделия фабрики «Рахат», проданные с 01.12.2018 включительно.
<details class="sol"><summary>Решение</summary>
[[sql]]
SELECT name FROM goods
WHERE category = 'Кондитерские изделия'
  AND maker = 'Рахат'
  AND sale_date >= '2018-12-01';
[[/sql]]
Слово «включительно» требует знака &gt;=, а не &gt;. Все условия должны выполняться одновременно, поэтому их соединяют через AND.</details></div>
`,
traps:["«С даты включительно» — знак >=, «после даты» — знак >.","DELETE без WHERE удаляет все строки таблицы.","ORDER BY по умолчанию сортирует по возрастанию (ASC)."],
quiz:tbMix([
{t:"single",lv:"A",q:"Какие блоки инструкции SELECT учебник Атамұра называет обязательными?",opts:["SELECT и FROM","SELECT и WHERE","FROM и ORDER BY","Только WHERE"],a:0},
{t:"single",lv:"B",q:"Какой блок запроса сервер обрабатывает первым?",opts:["FROM","SELECT","ORDER BY","HAVING"],a:0},
{t:"single",lv:"B",q:"Записи погоды: (+12, дождь), (+7, дождь), (+5, нет), (+9, дождь), (+10, дождь), (+3, снег), (+8, дождь). Сколько записей удовлетворяют условию Осадки = «дождь» И Температура < 10?",opts:["3","4","5","2"],a:0},
{t:"single",lv:"B",q:"Как отобрать товары, проданные с 01.12.2018 включительно?",opts:["WHERE sale_date >= '2018-12-01'","WHERE sale_date > '2018-12-01'","WHERE sale_date = '2018-12-01'","WHERE sale_date <= '2018-12-01'"],a:0},
{t:"single",lv:"A",q:"Что произойдёт после выполнения DELETE FROM students; (без WHERE)?",opts:["Будут удалены все строки таблицы","Будет удалена сама таблица","Ничего не произойдёт","Будет удалена первая строка"],a:0},
{t:"match",lv:"B",q:"Установите соответствие между типом таблицы в блоке FROM и способом её получения.",left:["Постоянная","Временная","Виртуальная (представление)"],right:["CREATE VIEW","Результат подзапроса","CREATE TABLE","DROP TABLE"],a:[2,1,0]}
])});

ext("t03",{html:String.raw`
<h2>Кодировки по учебнику 10 класса</h2>
<table>
<tr><th>Кодировка</th><th>Где и когда применялась</th></tr>
<tr><td>ASCII</td><td>Американский стандарт, 7 бит, 128 символов (0–127). Коды 0–31 управляющие (непечатаемые), с 32 (пробел, 20₁₆) начинаются печатаемые</td></tr>
<tr><td>КОИ-8</td><td>Русские буквы с 1970-х годов, ЕС ЭВМ, затем UNIX</td></tr>
<tr><td>CP866</td><td>MS-DOS, начало 1990-х (CP — Code Page, кодовая страница)</td></tr>
<tr><td>Mac</td><td>Компьютеры Apple с Mac OS</td></tr>
<tr><td>ISO 8859-5</td><td>Предложена Международной организацией по стандартизации</td></tr>
<tr><td>Windows-1251</td><td>Кириллица в Windows</td></tr>
<tr><td>Unicode</td><td>Введён в 1991 году. В учебнике: 16-разрядный, 2 байта на символ, до 65 536 символов</td></tr>

<p>Если в задаче ЕНТ сказано «16-битная кодировка Unicode», на символ отводят 2 байта. Однобайтовые кодировки (КОИ-8, CP866, Windows-1251) дают по 8 бит на символ. Один и тот же текст в разных однобайтовых кодировках выглядит по-разному: так появляются «кракозябры».</p>
`,

])});

ext("t02",{html:String.raw`
<h2>Идентификация и сетевые устройства по учебнику 10 класса</h2>
<p>Порядок входа по учебнику: <b>регистрация</b> (пользователь задаёт почту или телефон и пароль, которые не должны повторяться в системе) → <b>идентификация</b> (ввод данных, указанных при регистрации) → <b>аутентификация</b> (сервер проверяет правильность логина и пароля).</p>
<table>
<tr><th>Метод идентификации</th><th>Особенности</th></tr>
<tr><td>Пароль</td><td><b>Постоянный</b> меняется только по желанию пользователя, <b>динамический</b> (одноразовый, SMS-код) — по определённым параметрам</td></tr>
<tr><td>Специальные предметы</td><td>Карточки, браслеты, флеш-ключи</td></tr>
<tr><td>Биометрия</td><td>Отпечатки пальцев, радужная оболочка глаза, форма лица. Одна из самых надёжных, но дорогих систем</td></tr>
<tr><td>Конфиденциальная информация</td><td>Проверка кэша браузера, местоположения и других параметров. Чаще используется для защиты ПО</td></tr>
</table>
<p>Сетевые устройства по учебнику. <b>Концентратор</b> (хаб) пересылает данные, пришедшие в один порт, на <b>все</b> остальные порты. <b>Коммутатор</b> (switch) работает похоже, но эффективнее: по <b>MAC-адресу</b> отправляет кадр только адресату. <b>Маршрутизатор</b> (router) — «умное» устройство, которое передаёт пакеты <b>между сетями</b> по IP-адресам. Аналогия учебника: коммутатор похож на почтовый сервер внутри компании, маршрутизатор — на почтовое отделение.</p>
`,

{t:"single",lv:"A",q:"Как называется этап, на котором сервер проверяет правильность введённых логина и пароля?",opts:["Аутентификация","Идентификация","Регистрация","Авторизация"],a:0},
{t:"match",lv:"A",q:"Установите соответствие между методом идентификации и примером.",left:["Биометрия","Специальный предмет","Динамический пароль"],right:["Карта-пропуск","Одноразовый SMS-код","Скан радужной оболочки","Постоянный пароль"],a:[2,0,1]}
])});

<p>Учебники оформляют страницы атрибутами HTML 3–4, которые в HTML5 заменены на CSS. Браузеры их ещё понимают, и на ЕНТ их могут спросить, поэтому знайте назначение:</p>

<tr><td><code>&lt;font face="Arial" size="4" color="red"&gt;</code></td><td>Шрифт, размер (1–7), цвет текста</td><td>CSS font-family, font-size, color</td></tr>

<tr><td><code>&lt;table border="1" bordercolor="#rrggbb" bgcolor cellpadding cellspacing&gt;</code></td><td>Рамка таблицы, её цвет, фон, отступы внутри ячеек и между ними</td><td>CSS border, padding, border-spacing</td></tr>

<p>Подключение внешней таблицы стилей в учебнике: <code>&lt;link rel="stylesheet" type="text/css" href="style.css"&gt;</code>. Скрипт: <code>&lt;script type="text/javascript"&gt;</code>. В HTML5 атрибут type у script можно не писать.</p>

<h2>Процессор и конфигурация по учебникам 8–9 классов</h2>
<p><b>Процессор</b> (CPU, Central Processing Unit) — вычислительный и управляющий элемент компьютера, «мозг». Это полупроводниковый кристалл с транзисторами в керамическом корпусе. <b>Графический процессор (GPU)</b> обрабатывает графику и вычисления с плавающей точкой, разгружая основной процессор. <b>Техпроцесс</b> — размер транзисторов в процессоре (в нанометрах): чем меньше транзистор, тем больше их помещается на кристалле. Первый микропроцессор Intel 4004 (1971) содержал 2300 транзисторов.</p>
<table>
<tr><th>Характеристика процессора (учебник 8 класса)</th><th>Смысл</th></tr>
<tr><td>Компания-разработчик</td><td>Intel, AMD, Apple Silicon</td></tr>
<tr><td>Тактовая частота</td><td>Показатель скорости выполнения команд за 1 секунду, в герцах (Гц). <b>Такт</b> — время на одну простую операцию</td></tr>
<tr><td>Разрядность</td><td>Сколько бит процессор обрабатывает в регистрах за один такт (32 или 64)</td></tr>
<tr><td>Объём кэш-памяти</td><td>Сверхбыстрая энергозависимая память-буфер. L1 — самый быстрый и маленький (до 128 КБ), L2 — больше и медленнее, L3 — самый большой и общий для всех ядер</td></tr>
<tr><td>Частота и разрядность системной шины</td><td>Шина состоит из шины адреса, шины данных и шины управления. Чем выше частота и разрядность, тем выше производительность</td></tr>
<tr><td>Количество ядер</td><td><b>Ядро</b> — часть процессора, выполняющая один поток команд. Двухъядерный процессор выполняет две задачи одновременно</td></tr>
</table>
<p>Объём оперативной памяти <b>не</b> является характеристикой процессора: так звучит типичный вопрос «что не относится».</p>
<h3>Конфигурация компьютера</h3>
<p><b>Конфигурация</b> — набор комплектующих, выбранный под назначение компьютера. <b>Базовая конфигурация</b>: системный блок, монитор, клавиатура, мышь. Внутри системного блока: <b>материнская плата</b> (главная плата, на которой установлены основные узлы и разъёмы), процессор, ОЗУ, жёсткий диск, видеокарта, блок питания. По назначению учебник делит ПК на <b>офисные</b> (стабильность, офисные программы), <b>домашние</b>, <b>игровые</b> (мощная видеокарта и процессор) и <b>дизайнерские</b> (графические станции). Конфигурацию можно узнать программами CPU-Z и EVEREST, а также через «Сведения о системе» (msinfo32) или Диспетчер задач (Ctrl + Shift + Esc).</p>

ext("t02",{html:String.raw`
<h2>Сети и безопасность по учебникам 7–9 классов</h2>
<h3>Термины сети (8 класс)</h3>
<ul>
<li><b>Компьютерная сеть</b> — группа взаимосвязанных вычислительных устройств, способных передавать и принимать данные. Вычислительное устройство — не только компьютер, но и планшет, телефон, смарт-датчик.</li>
<li><b>Рабочая станция</b> — компьютер, подключённый к сети и имеющий доступ к её ресурсам. <b>Сервер</b> хранит общие данные, организует к ним доступ и передаёт их клиенту. <b>Клиент</b> обрабатывает полученные данные и показывает результат пользователю.</li>
<li><b>Канал связи</b> — физическая среда, по которой передаются сигналы: <b>витая пара</b> (CAT5, четыре пары медных проводов, электрические импульсы, стандарт Ethernet), <b>оптоволокно</b> (световые импульсы, гораздо выше скорость, соединяет континенты), <b>беспроводная связь</b> (радиоволны).</li>
<li>Характеристики сети: производительность, время реакции, <b>пропускная способность</b>, задержка передачи. <b>Пропускная способность</b> — максимальная скорость передачи, количество информации за 1 секунду (бит/с).</li>
</ul>
<p>Учебник считает приставки скорости двоичными: <span class="f">1 Кбит/с = 1024 бит/с, 1 Мбит/с = 1024 Кбит/с</span>. Например, 1,25 Мбит/с = 1,25 · 1024 · 1024 = 1 310 720 бит/с. Пособие считает так же.</p>
<div class="task"><b>Задача (тип из учебника 8 класса)</b>Устройство A передаёт данные устройству B через промежуточное устройство C. Пакеты по 300 байт. Скорость A→C 150 байт/с, C→B 100 байт/с. C может одновременно принимать новый пакет и передавать уже полученный, но начинает передавать пакет только после того, как получил его целиком. Буфер C не ограничен. Через сколько секунд B получит все 3 пакета?
<details class="sol"><summary>Решение</summary>Каждый пакет идёт от A к C 2 с, от C к B 3 с. Пакеты приходят в C в моменты 2, 4 и 6 с. Передача к B: первый пакет 2–5 с, второй 5–8 с (он уже ждёт в буфере), третий 8–11 с. Ответ: 11 с. Узкое место — медленный канал C→B.</details></div>
<h3>Виды сетей и топологии (7 класс)</h3>
<p>По охвату сети бывают локальные (LAN), региональные (MAN) и глобальные (WAN, охватывает весь мир). Топологии: <b>шина</b> (все компьютеры на одном кабеле), <b>кольцо</b> (сигнал идёт по кругу в одном направлении), <b>звезда</b> (все подключены к центральному узлу).</p>
<h3>Компьютерные вирусы (7 класс)</h3>
<table>
<tr><th>Признак классификации</th><th>Виды</th></tr>
<tr><td>По способу заражения</td><td><b>Резидентные</b> остаются в памяти и действуют долго; <b>нерезидентные</b> активны ограниченное время</td></tr>
<tr><td>По среде обитания</td><td><b>Файловые</b> (заражают файлы), <b>загрузочные</b> (загрузочный сектор диска), <b>макровирусы</b> (макросы офисных документов, чаще MS Word), <b>сетевые</b> (распространяются по сети, не изменяя файлы)</td></tr>
<tr><td>По алгоритму работы</td><td><b>Паразитические</b> (дописывают свой код в файл), <b>черви</b> (рассылают свои копии по сетевым адресам), <b>невидимки (стелс)</b> (подменяют заражённые участки чистыми при обращении ОС), <b>мутанты (полиморфные)</b> (шифруются, копии не повторяются), <b>троянские</b> (маскируются под полезную программу)</td></tr>
</table>
<table>
<tr><th>Вид антивирусной программы</th><th>Что делает</th></tr>
<tr><td>Детекторы</td><td>Ищут характерные для известных вирусов сигнатуры в памяти и файлах и сообщают о них</td></tr>
<tr><td>Доктора (фаги)</td><td>Находят вирусы и лечат заражённые файлы</td></tr>
<tr><td>Ревизоры</td><td>Запоминают исходное состояние файлов и сравнивают с ним текущее</td></tr>
<tr><td>Фильтры (мониторы, сторожа)</td><td>Резидентно следят за подозрительными действиями</td></tr>
<tr><td>Вакцины (иммунизаторы)</td><td>Резидентные программы, предотвращающие заражение. Сейчас почти не используются</td></tr>
</table>
<h3>Угрозы и этикет (8–9 классы)</h3>
<ul>
<li><b>Претекстинг</b> — обман по заранее составленному сценарию (претексту), чтобы жертва выдала информацию. <b>Фишинг</b> — получение конфиденциальных данных обманом, например поддельным письмом от банка. <b>Кибербуллинг</b> — травля и угрозы через электронные средства связи. <b>Цифровая репутация</b> — позитивная или негативная информация о человеке в Сети.</li>
<li><b>Сетевой этикет</b> — правила поведения в Сети. <b>Флейм</b> — эмоциональный «спор ради спора» без учёта мнения других, обычно наказывается модераторами.</li>
<li>Облака по учебнику 9 класса: <b>частное</b> (для одной организации), <b>публичное</b> (для всех пользователей Интернета: почта, соцсети), <b>общественное</b> (для сообщества организаций с общей целью), <b>гибридное</b> (сочетание видов).</li>
</ul>
`,

ext("t03",{html:String.raw`
<h2>Алфавитный подход и свойства информации по учебникам 8–9 классов</h2>
<p><b>Алфавит</b> — совокупность символов для представления информации. <b>Мощность алфавита N</b> — количество символов в нём: кириллица 33, казахский алфавит 42, латиница 26, двоичный алфавит 2. В алфавитном подходе у каждого символа есть <b>информационный вес i</b>, связанный с мощностью <b>формулой Хартли</b> <span class="f">N = 2ⁱ</span>. Объём текста <span class="f">I = K · i</span>, где K — число символов. Компьютерный алфавит текста содержит 256 символов, поэтому i = 8 бит = 1 байт.</p>
<div class="task"><b>Задача (из учебника 8 класса)</b>Текст на 3 страницах по 25 строк, в строке 60 символов, весь текст занимает 1125 байт. Какова мощность алфавита?
<details class="sol"><summary>Решение</summary>K = 3 · 25 · 60 = 4500 символов. I = 1125 · 8 = 9000 бит. i = 9000 / 4500 = 2 бита, N = 2² = 4 символа.</details></div>
<p>Если мощность не степень двойки, вес округляют вверх: для казахского алфавита (42 буквы) i = 6 бит, потому что 2⁵ = 32 &lt; 42 ≤ 64 = 2⁶.</p>
<h3>Свойства информации (9 класс)</h3>
<table>
<tr><th>Свойство</th><th>Пример из учебника</th></tr>
<tr><td>Актуальность</td><td>Предоставлена вовремя: «Сейчас на вашем счёте 1360 тенге»</td></tr>
<tr><td>Точность</td><td>Степень соответствия реальности: «2 · 25 = 50»</td></tr>
<tr><td>Достоверность</td><td>Отражает истинное положение дел: «В сутках 24 часа»</td></tr>
<tr><td>Ценность (полезность)</td><td>Помогает решить задачу: «Возьмите зонт, ожидается дождь»</td></tr>
<tr><td>Полнота</td><td>Достаточна для решения: «4 июня — день рождения мамы», а не «летом»</td></tr>
<tr><td>Объективность</td><td>Можно проверить и измерить, не зависит от мнения: «Астана — столица Казахстана»</td></tr>
<tr><td>Доступность, ясность</td><td>Можно получить при необходимости; выражена на понятном языке</td></tr>
</table>
`,
