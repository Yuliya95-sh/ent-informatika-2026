ext("t06",{html:String.raw`
<h2>Циклы, ошибки и массивы по учебникам 7–9 классов</h2>
<h3>Термины циклов (8 класс)</h3>
<ul>
<li><b>Цикл</b> — последовательность команд, которая выполняется многократно. <b>Тело цикла</b> — код, который повторяется. <b>Итерация</b> — однократное выполнение тела. <b>Параметр цикла (счётчик)</b> — переменная, связанная с условием выхода и меняющая значение в цикле.</li>
<li><code>continue</code> пропускает остаток текущей итерации, <code>break</code> досрочно завершает цикл, <code>else</code> после цикла выполняется, только если цикл завершился без <code>break</code>.</li>
<li><b>Трассировка</b> — пошаговое выполнение программы для проверки и поиска ошибок.</li>
</ul>
[[py]]
s = 0
for i in range(1, 8):
    if i % 3 == 0:
        continue      # пропускаем 3 и 6
    s += i
print(s)              # 1+2+4+5+7 = 19

for i in range(2, 7):
    if i % 5 == 0:
        break
else:
    print("нет")      # не выполнится: был break
print(i)              # 5
[[/py]]
<h3>Ошибки и тестирование (7–8 классы)</h3>
<p><b>Синтаксические ошибки</b> нарушают правила записи языка, программа не запускается. <b>Логические</b> возникают из-за ошибки в алгоритме: программа работает, но результат неверный. Исключения во время выполнения из учебника: <code>NameError</code> (переменная не объявлена), <code>ValueError</code> (<code>int('Hi')</code>), <code>TypeError</code> (<code>8 + '3'</code>), <code>ZeroDivisionError</code> (<code>1/0</code>).</p>
<p><b>Отладка</b> — поиск и исправление ошибок. <b>Тестирование</b> — выполнение программы на данных с заранее известным результатом. Учебник 8 класса выделяет три этапа проверки: в <b>нормальных</b> условиях (обычные данные), в <b>экстремальных</b> (граничные значения) и в <b>исключительных</b> (данные вне допустимой области). Отсутствие сообщений об ошибках не означает, что программа правильная. Типичные ошибки циклов: неверное начало, неверное условие окончания, неверное число повторений, бесконечный цикл.</p>
<h3>Массивы (9 класс)</h3>
<p><b>Массив</b> — совокупность переменных <b>одного типа</b> под общим именем, доступ к элементу по индексу с нуля. <b>Список</b> Python может хранить элементы <b>любых</b> типов. Настоящий массив создаётся модулем array: <code>import array as arr; a = arr.array('i')</code>, где 'i' — целые числа. В заданиях Атамұра массивы чаще заполняют по формуле от индекса:</p>

X = [0] * 6
for k in range(6):

Y = [1] * 5

[[/py]]

        return s
    return f(s[1:]) + s[0]

<h2>Задачи на кодирование записей (уровень C)</h2>
<p>В задачах ЕНТ запись об объекте состоит из нескольких параметров. Порядок решения всегда один:</p>
<ol>
<li>Для каждого параметра с <i>N</i> возможными значениями берём <span class="f">i = ⌈log₂N⌉</span> бит (наименьшее i, при котором 2<sup>i</sup> ≥ N). Число от 0 до 100 — это 101 значение, то есть 7 бит.</li>
<li>Если строка кодируется посимвольно, умножаем вес одного символа на число символов: PIN из 5 десятичных цифр = 5 · 4 = 20 бит.</li>
<li>Складываем биты всех параметров и <b>округляем вверх до целого числа байт</b>, если запись хранится «в минимальном целом числе байт».</li>
<li>Умножаем на количество записей и переводим в нужные единицы через степени двойки.</li>
</ol>
<div class="task"><b>Пример</b>Камера каждые 5 с записывает тип кузова (8 значений), цвет (32 значения) и скорость (0–127). Каков объём базы за 16 часов?
<details class="sol"><summary>Решение</summary>3 + 5 + 7 = 15 бит → 2 байта на запись. Записей: 16 · 3600 / 5 = 11 520. Объём: 23 040 байт = 22,5 Кбайт. Если забыть округление до байт, получится 21,1 Кбайт — это неверный ответ.</details></div>
<div class="task"><b>Ловушка «ничего не изменилось»</b>Пиксель хранит температуру (64 уровня), давление (32) и облачность (4), упаковка в целые байты. Облачность стали кодировать 8 уровнями. На сколько вырос размер карты 1024 × 1024?
<details class="sol"><summary>Решение</summary>Было 6 + 5 + 2 = 13 бит → 2 байта, стало 6 + 5 + 3 = 14 бит → тоже 2 байта. Размер не изменился: 0 Кбайт.</details></div>
<div class="note trap"><b>Частые ошибки в учебных материалах</b><ul>
<li>«1 Мбайт = 10<sup>20</sup> байт» — опечатка: 1 Мбайт = 2<sup>20</sup> байт, 1 Гбайт = 2<sup>30</sup> байт, 1 Тбайт = 2<sup>40</sup> байт.</li>
<li>«Байт — наименьшая единица измерения»: наименьшая единица — <b>бит</b>. Байт — наименьшая адресуемая единица памяти.</li>
<li>Слово «бит» предложил Джон Тьюки, а в теорию информации его ввёл Клод Шеннон (1948).</li>
</ul></div>
`,

<h2>Маски подсети и скорость передачи: разбор типичных задач</h2>
<p>IPv4-адрес — это 32 бита, записанные <b>четырьмя</b> десятичными числами от 0 до 255 через точку (например, 192.168.10.1). Маска показывает, сколько старших бит занимает номер сети. Число узлов в подсети: <span class="f">2<sup>(32 − длина префикса)</sup> − 2</span> (адрес сети и широковещательный адрес узлам не выдаются).</p>
<table>
<tr><th>Маска</th><th>Префикс</th><th>Бит на узлы</th><th>Узлов</th></tr>
<tr><td>255.255.255.0</td><td>/24</td><td>8</td><td>254</td></tr>
<tr><td>255.255.255.224</td><td>/27</td><td>5</td><td>30</td></tr>
<tr><td>255.255.255.248</td><td>/29</td><td>3</td><td>6</td></tr>
<tr><td>255.255.254.0</td><td>/23</td><td>9</td><td>510</td></tr>
<tr><td>255.255.252.0</td><td>/22</td><td>10</td><td>1022</td></tr>
</table>
<p>Сеть /24 (класс C), разбитая на подсети /29, даёт 2<sup>29−24</sup> = 32 подсети по 6 узлов.</p>
<h3>Скорость передачи</h3>
<p><span class="f">t = V / v</span>, где V — объём в битах, v — скорость в бит/с. На ЕНТ и в учебнике приставки двоичные: 1 Кбит = 1024 бит, 1 Мбит = 1024 Кбит. Не смешивайте в одной задаче 10<sup>6</sup> и 2<sup>20</sup>: если в условии нет оговорки, используйте степени двойки. Пример: файл 2 Мбайт = 16 Мбит, по каналу 1 Мбит/с он передаётся 16 с.</p>

</ul></div>

<h2>Законы алгебры логики: полный список</h2>
<table>
<tr><th>Закон</th><th>Формулы</th></tr>
<tr><td>Коммутативность</td><td>X∧Y = Y∧X; X∨Y = Y∨X; (X⇔Y) = (Y⇔X)</td></tr>
<tr><td>Ассоциативность</td><td>(X∧Y)∧Z = X∧(Y∧Z); (X∨Y)∨Z = X∨(Y∨Z)</td></tr>
<tr><td>Дистрибутивность</td><td>X∧(Y∨Z) = (X∧Y)∨(X∧Z); X∨(Y∧Z) = (X∨Y)∧(X∨Z)</td></tr>
<tr><td>Де Морган</td><td>¬(X∨Y) = ¬X∧¬Y; ¬(X∧Y) = ¬X∨¬Y</td></tr>
<tr><td>Идемпотентность</td><td>X∧X = X; X∨X = X</td></tr>
<tr><td>Противоречие и исключённое третье</td><td>X∧¬X = 0; X∨¬X = 1</td></tr>
<tr><td>Поглощение</td><td>X∨(X∧Y) = X; X∧(X∨Y) = X; X∨(¬X∧Y) = X∨Y; ¬X∧(X∨Y) = ¬X∧Y</td></tr>
<tr><td>Склеивание</td><td>(X∧Y)∨(X∧¬Y) = X; (X∨Y)∧(X∨¬Y) = X</td></tr>
<tr><td>Контрапозиция</td><td>(X→Y) = (¬Y→¬X)</td></tr>
<tr><td>Выражение импликации</td><td>(X→Y) = ¬X∨Y; ¬(X→Y) = X∧¬Y</td></tr>
</table>
<div class="note trap"><b>Частые ошибки в учебных материалах</b><ul>
<li>Формулу (X⇔Y) = (Y⇔X) иногда называют «законом контрапозиции». Это коммутативность эквиваленции. Контрапозиция — (X→Y) = (¬Y→¬X).</li>
<li>Формулы (X→Y) = ¬X∨Y и ¬(X→Y) = X∧¬Y — не законы де Моргана, а правило замены импликации (вторая получается из первой применением де Моргана).</li>
<li>Обратная импликация Y→X и противоположная ¬X→¬Y <b>не</b> равносильны X→Y.</li>
</ul></div>
`,

/* ===================== t06 Python: списки и матрицы ===================== */
ext("t06",{html:String.raw`
<h2>Списки и двумерные массивы: что проверяют на ЕНТ</h2>
<h3>Методы списков</h3>
<table>
<tr><th>Запись</th><th>Что делает</th></tr>
<tr><td><code>a.append(x)</code></td><td>Добавляет x в конец</td></tr>
<tr><td><code>a.insert(i, x)</code></td><td>Вставляет x так, что он получает индекс i</td></tr>
<tr><td><code>a.remove(x)</code></td><td>Удаляет первое вхождение x (ValueError, если x нет)</td></tr>
<tr><td><code>a.pop(i)</code></td><td>Удаляет элемент с индексом i и возвращает его (без i — последний)</td></tr>
<tr><td><code>a[-1]</code>, <code>a[1:3]</code></td><td>Последний элемент; срез с 1 по 2 (правая граница не входит)</td></tr>
<tr><td><code>b = a</code> / <code>b = a.copy()</code></td><td>Второе имя того же списка / независимая копия</td></tr>
</table>
[[py]]
a = [1, 2, 3]
b = a            # b и a — один и тот же список
b.append(4)
print(a)         # [1, 2, 3, 4]

m = [[0] * 3] * 2      # ловушка: две ссылки на одну строку
m[0][0] = 5
print(m)               # [[5, 0, 0], [5, 0, 0]]
m = [[0] * 3 for i in range(2)]   # правильно: строки независимы
[[/py]]
<h3>Матрица N × N</h3>
<ul>
<li>Главная диагональ: <code>A[i][i]</code>. Побочная: <code>A[i][N-1-i]</code>.</li>
<li>Ниже главной диагонали: <code>j &lt; i</code>; выше: <code>j &gt; i</code>.</li>
<li>Транспонирование меняет местами <code>A[i][j]</code> и <code>A[j][i]</code> только для <code>j &lt; i</code>, иначе каждая пара поменяется дважды и матрица вернётся в исходное состояние.</li>
<li><code>len(A)</code> — число строк, <code>len(A[0])</code> — число столбцов.</li>
</ul>
<div class="note trap"><b>Частые ошибки в учебных материалах</b><ul>
<li>Запись <code>min := a[0][0]</code> — синтаксис Pascal. В Python присваивание пишется через <code>=</code>, а имя <code>min</code> лучше не занимать: это встроенная функция.</li>
<li>Сдвиг строк «затиранием» не уменьшает список в Python. Удалять строку нужно через <code>del A[k]</code> или <code>A.pop(k)</code>.</li>

</ul></div>

<h2>Трассировка рекурсии и сортировки</h2>
<p>Рекурсивную функцию удобно трассировать «деревом вызовов»: записать вызов, под ним — вызовы, которые он делает, и так до базового случая. При процедуре с <code>print</code> печать идёт в порядке обхода дерева сверху вниз и слева направо.</p>
[[py]]
def F(n):
    print(n)
    if n < 5:
        F(n + 1)
        F(n + 3)

F(1)   # печатает 1 2 3 4 5 7 6 5 4 5 7 6
       # сумма напечатанных чисел = 49
[[/py]]
<p>Наивная рекурсия Фибоначчи делает <span class="f">2·F(n+1) − 1</span> вызовов: для n = 5 это 15 вызовов, для n = 40 — около 331 миллиона. Глубина рекурсии в Python по умолчанию ограничена примерно 1000 вызовами, при превышении возникает <code>RecursionError</code>.</p>
<h3>Сортировка пузырьком</h3>
<p>Для N элементов нужен <b>N − 1</b> проход: <code>for k in range(1, N)</code>, внутренний цикл <code>for i in range(N - k)</code>. Число сравнений: N(N − 1)/2. Если сделать на один проход меньше (<code>range(1, N - 1)</code>), массив, упорядоченный по убыванию, останется неотсортированным: <code>[5, 4, 3, 2, 1]</code> превратится в <code>[2, 1, 3, 4, 5]</code>.</p>
<h3>Строки: методы, которые путают</h3>
<table>
<tr><th>Метод</th><th>Результат</th></tr>
<tr><td><code>s.find(x)</code> / <code>s.index(x)</code></td><td>Индекс первого вхождения; если нет: find → −1, index → ошибка ValueError</td></tr>
<tr><td><code>s.rfind(x)</code></td><td>Индекс последнего вхождения</td></tr>
<tr><td><code>s.count(x)</code></td><td>Число непересекающихся вхождений</td></tr>
<tr><td><code>s.replace(a, b, k)</code></td><td>Заменяет только первые k вхождений</td></tr>
<tr><td><code>s.strip()</code></td><td>Убирает пробелы, \t и \n по краям</td></tr>
<tr><td><code>s.split(",")</code></td><td>Пустые куски между соседними запятыми сохраняются</td></tr>
</table>
<p>Строки сравниваются посимвольно по кодам Unicode: все заглавные латинские буквы (65–90) меньше строчных (97–122), поэтому <code>"Z" &lt; "a"</code> истинно.</p>
<div class="note trap"><b>Частые ошибки в учебных материалах</b><ul>
<li>Алгоритм Евклида находит <b>наибольший</b> общий делитель (НОД), а не «наименьший».</li>
<li>Локальные переменные функции — это область видимости, а не инкапсуляция (инкапсуляция — понятие ООП).</li>
<li>Для fib(40) нужно около 331 млн вызовов, а не «миллиард операций».</li>
</ul></div>
`,

<h2>Шины, принципы фон Неймана и история ЭВМ</h2>
<p>Системная шина состоит из трёх частей:</p>
<table>
<tr><th>Шина</th><th>Что передаёт</th><th>Направление</th></tr>
<tr><td>Шина адреса</td><td>Адрес ячейки памяти или порта</td><td>Однонаправленная: от процессора</td></tr>
<tr><td>Шина данных</td><td>Данные <b>и коды команд</b>, считанные из памяти</td><td>Двунаправленная</td></tr>
<tr><td>Шина управления</td><td>Сигналы чтения, записи, прерываний, тактовые сигналы</td><td>В обе стороны (разные линии)</td></tr>
</table>
<p>Принципы фон Неймана (1945): <b>программное управление</b> (команды выполняются автоматически одна за другой), <b>однородность памяти</b> (программы и данные хранятся в одной памяти), <b>адресность</b> (память состоит из пронумерованных ячеек), <b>двоичное кодирование</b>.</p>
<p>ENIAC запущен в 1946 году (Дж. Эккерт и Дж. Моучли, около 18 тысяч ламп, около 30 тонн). Первая советская ЭВМ — МЭСМ (1950–1951), затем БЭСМ (1952–1953); обе созданы под руководством С. А. Лебедева.</p>
<div class="note trap"><b>Частые ошибки в учебных материалах</b><ul>
<li>«Командной шины» в классической схеме нет: команды приходят из памяти по шине данных, а третья шина — шина управления.</li>
<li>Северный и южный мосты — устаревшая схема. С конца 2000-х контроллер памяти и линии PCI Express для видеокарты встроены в процессор, а на плате остаётся один чип (PCH).</li>
<li>1 наносекунда = 10<sup>−9</sup> с, а не 10<sup>−10</sup> с.</li>
<li>ПЗУ с BIOS/UEFI в современных компьютерах — флеш-память: её можно перезаписать (обновить прошивку). Кэш процессора сегодня измеряется мегабайтами, а не сотнями килобайт.</li>
<li>В лазерном принтере барабан заряжают целиком, а лазер <b>снимает</b> заряд с участков изображения; тонер притягивается к ним.</li>
</ul></div>
`,

<h2>Драйверы и утилиты</h2>
<p><b>Драйвер</b> — системная программа-посредник между операционной системой и конкретным устройством (ОС → драйвер → устройство). Без подходящего драйвера устройство не работает или работает не полностью. Драйверы ставятся вместе с ОС, через обновления, с сайта производителя или с диска устройства.</p>
<table>
<tr><th>Класс драйвера</th><th>Как идут данные</th><th>Примеры</th></tr>
<tr><td>Символьные</td><td>Поток байт, последовательно</td><td>Клавиатура, мышь, последовательный порт</td></tr>
<tr><td>Блочные</td><td>Блоки с произвольным доступом</td><td>HDD, SSD, оптические диски</td></tr>
<tr><td>Сетевые</td><td>Пакеты по сети</td><td>Сетевая карта, Wi-Fi-адаптер</td></tr>
</table>
<p><b>Утилита</b> (от лат. utilitas — польза) — служебная программа для проверки, настройки и обслуживания системы. В отличие от драйвера, компьютер работает и без неё. Виды: диагностика (CPU-Z, AIDA64, DxDiag, msinfo32), обслуживание дисков (проверка, очистка, дефрагментация — только для HDD), антивирусы, архиваторы (7-Zip, WinRAR), файловые менеджеры, резервное копирование, системные (Диспетчер задач, Диспетчер устройств).</p>
<p>Критерии качества ПО: функциональность, надёжность, эффективность, эргономичность и <b>мобильность</b> (переносимость на другую платформу).</p>
`,

<p><b>Нормализация</b> — разбиение данных на таблицы так, чтобы не хранить один факт дважды. 1НФ: в каждой ячейке одно значение. 2НФ: неключевые поля зависят от всего составного ключа. 3НФ: неключевые поля не зависят друг от друга. Вычисляемые поля (сумма = цена × количество) в нормализованной БД не хранят, а считают запросом.</p>
<p>Первичный ключ уникален и не может быть NULL. Таблицу, на которую ссылается внешний ключ, создают и заполняют первой.</p>
`,

/* ===================== t10 SQL ===================== */
ext("t10",{html:String.raw`
<h2>SQL: группы команд, JOIN и ловушки с NULL</h2>
<table>
<tr><th>Группа</th><th>Назначение</th><th>Команды</th></tr>
<tr><td>DDL</td><td>Структура</td><td>CREATE, ALTER, DROP, TRUNCATE</td></tr>
<tr><td>DML</td><td>Данные</td><td>SELECT, INSERT, UPDATE, DELETE</td></tr>
<tr><td>DCL</td><td>Права</td><td>GRANT, REVOKE</td></tr>
<tr><td>TCL</td><td>Транзакции</td><td>COMMIT, ROLLBACK</td></tr>
</table>
<table>
<tr><th>Команда</th><th>Строки</th><th>Таблица</th></tr>
<tr><td>DELETE FROM t WHERE …</td><td>Удаляются подходящие</td><td>Остаётся</td></tr>
<tr><td>TRUNCATE TABLE t</td><td>Удаляются все</td><td>Остаётся, счётчик AUTO_INCREMENT сбрасывается</td></tr>
<tr><td>DROP TABLE t</td><td>Удаляются все</td><td>Удаляется сама таблица</td></tr>
</table>
<ul>
<li><b>WHERE</b> отбирает строки до группировки и не может содержать агрегатные функции; <b>HAVING</b> отбирает группы после GROUP BY.</li>
<li>Сравнение с NULL через <code>=</code> всегда даёт «неизвестно»: пишут <code>IS NULL</code>. <code>COUNT(поле)</code> не считает NULL, <code>COUNT(*)</code> считает все строки.</li>
<li>AND выполняется раньше OR — ставьте скобки.</li>
<li>В LIKE (MySQL) только два спецсимвола: <code>%</code> — любое число символов, <code>_</code> — ровно один. Шаблоны <code>[abc]</code> работают в SQL Server и Access, но не в MySQL.</li>
<li>BETWEEN включает обе границы. ORDER BY по умолчанию сортирует по возрастанию (ASC).</li>
<li>UPDATE и DELETE без WHERE затрагивают <b>все</b> строки.</li>
</ul>
<p>JOIN: таблица «Инструменты» (5 строк), «Заказы» (4 строки, каждый заказ ссылается на инструмент), один инструмент не заказан. INNER JOIN — 4 строки, Инструменты LEFT JOIN Заказы — 5 строк (у незаказанного поля заказа NULL), CROSS JOIN — 5 · 4 = 20 строк. Условие соединения — «внешний ключ = первичный ключ»: <code>ON Orders.ProductID = Product.ProductID</code>, а не <code>= Orders.OrderID</code>.</p>
`,

{t:"match",lv:"A",q:"Установите соответствие между командой и группой SQL.",left:["CREATE","GRANT","UPDATE"],right:["DML","DDL","DCL","TCL"],a:[1,2,0]},

{t:"single",lv:"B",q:"Сколько строк вернёт запрос, если у 3 из 10 учеников телефон не указан (NULL)?",code:"SELECT * FROM Ученики WHERE Телефон = NULL;",lang:"sql",opts:["0","3","7","10"],a:0,ex:"Сравнение с NULL через = не бывает истинным; нужно IS NULL."},
{t:"single",lv:"B",q:"В таблице 6 строк, в поле Телефон у двух строк NULL. Что вернёт SELECT COUNT(Телефон)?",opts:["4","6","2","NULL"],a:0},

ext("t13",{html:String.raw`
<h2>Уточнения по HTML, CSS и JavaScript</h2>
<h3>Единицы CSS</h3>
<p><b>Абсолютные</b>: px, pt, cm, mm. <b>Относительные</b>: % (от родителя), em (от размера шрифта родителя; 16 px — лишь значение браузера по умолчанию), rem (от шрифта корневого элемента), vw и vh (доля окна). В <code>font-family</code> шрифты перечисляют <b>через запятую</b>, последним ставят общий тип: <code>font-family: Arial, sans-serif</code>.</p>
<h3>Устаревшие теги</h3>
<p>В HTML5 сняты с использования теги оформления <code>&lt;font&gt;</code>, <code>&lt;center&gt;</code>, <code>&lt;big&gt;</code>, <code>&lt;strike&gt;</code> и атрибуты <code>bgcolor</code>, <code>align</code>: внешний вид задают через CSS. Якорь <code>&lt;a name="…"&gt;</code> заменён атрибутом <code>id</code> у любого элемента. Логические теги <code>&lt;strong&gt;</code> и <code>&lt;em&gt;</code> остаются.</p>
<h3>История</h3>
<p>HTML создал Тим Бернерс-Ли (проект WWW, 1989–1991; язык основан на SGML 1986 года). HTML 2.0 — 1995, HTML 3.2 (таблицы) — 1997, HTML 4.01 — 1999, HTML5 рекомендован W3C в 2014 году. CSS — отдельный стандарт (CSS1, 1996). JavaScript создал Брендан Эйх в Netscape за 10 дней в 1995 году (названия Mocha → LiveScript → JavaScript).</p>
<h3>JavaScript: что спрашивают</h3>
<ul>
<li><code>5 == "5"</code> — true (с приведением типов), <code>5 === "5"</code> — false.</li>
<li><code>var</code> — область видимости функции; <code>let</code> и <code>const</code> — блока. <code>const</code> нельзя переприсвоить, <code>let</code> нельзя повторно объявить в том же блоке.</li>
<li>Фазы события: погружение (capturing) → целевая фаза → всплытие (bubbling).</li>
<li><code>async</code> — скрипт выполняется сразу после загрузки, порядок не гарантирован; <code>defer</code> — после разбора HTML, с сохранением порядка.</li>
<li><code>element.onclick = …</code> хранит один обработчик, <code>addEventListener</code> — сколько угодно.</li>
<li><code>0.1 + 0.2 === 0.3</code> — false: числа хранятся в двоичном формате с плавающей точкой.</li>
</ul>
<div class="note trap"><b>Частые ошибки в учебных материалах</b><ul>
<li>«Проценты — абсолютная единица»: % относительна.</li>
<li>HTML 4.01 вышел в 1999, а не в 2004 году; таблицы появились в HTML 3.2, а не в 3.0.</li>
<li>Брендан Эйх — создатель JavaScript и сооснователь Mozilla, но не автор Firefox (его создали Блейк Росс и Дейв Хайятт).</li>
</ul></div>
`,
traps:["em считается от шрифта родителя, rem — от корневого элемента.","== сравнивает с приведением типов, === — строго."],
quiz:tbMix([

/* ===================== t11 IoT и ИИ ===================== */
ext("t11",{html:String.raw`
<h2>Интернет вещей и история искусственного интеллекта</h2>
<h3>Интернет вещей (IoT)</h3>
<p><b>IoT</b> — сеть физических устройств со встроенными датчиками, которые обмениваются данными друг с другом и с облаком без участия человека. Термин предложил Кевин Эштон в 1999 году. Развитие: <b>SCADA</b> (диспетчерское управление промышленным оборудованием) → <b>M2M</b> (обмен данными «машина — машина») → <b>IoT</b> (миллиарды устройств, облако, большие данные).</p>
<p>Трёхуровневая архитектура IoT: <b>уровень восприятия</b> (датчики и исполнительные устройства) → <b>сетевой уровень</b> (Wi-Fi, GSM, шлюз) → <b>прикладной уровень</b> (облако, приложение на смартфоне). Цепочка «умного дома»: датчик → контроллер → исполнительное устройство (реле, сирена, спринклер) + интерфейс пользователя. Пример сценария в Cisco Packet Tracer: датчик дыма → Home Gateway → сирена и спринклер.</p>
<p>Мобильные платформы: Android основан на ядре Linux и открыт (Open Handset Alliance, Google); iOS — закрытая система Apple на базе Unix-подобного ядра. MIT App Inventor — облачная визуальная среда, где приложение собирают из блоков: режим «Дизайнер» задаёт интерфейс, режим «Блоки» — логику (событие «когда Кнопка1.Щелчок» → действие).</p>
<h3>Хронология ИИ</h3>
<table>
<tr><th>Год</th><th>Событие</th></tr>
<tr><td>1943</td><td>Модель искусственного нейрона (Маккаллок и Питтс)</td></tr>
<tr><td>1950</td><td>Алан Тьюринг — статья «Вычислительные машины и разум», тест Тьюринга</td></tr>
<tr><td>1956</td><td>Дартмутская конференция, термин «искусственный интеллект» (Джон Маккарти)</td></tr>
<tr><td>1958</td><td>Язык Лисп (Маккарти)</td></tr>
<tr><td>1966</td><td>ELIZA — первая программа-собеседник (чат-бот), Дж. Вейценбаум</td></tr>
<tr><td>1966–1972</td><td>Робот Shakey (Стэнфордский исследовательский институт)</td></tr>
<tr><td>1982</td><td>Японский проект ЭВМ пятого поколения (логическое программирование)</td></tr>
<tr><td>1997</td><td>Deep Blue (IBM) обыграл Гарри Каспарова</td></tr>
</table>
<p>Виды машинного обучения: <b>с учителем</b> (на размеченных примерах с правильными ответами), <b>без учителя</b> (поиск закономерностей и групп в неразмеченных данных), <b>с подкреплением</b> (агент учится по наградам и штрафам). <b>Глубокое обучение</b> — обучение нейросетей с большим числом слоёв; оно может быть и с учителем, и без. Нейросеть — математическая модель из связанных искусственных нейронов, а не «множество процессоров». Три закона робототехники придумал писатель Айзек Азимов (1942) — это литературная идея, а не научный закон.</p>
<div class="note trap"><b>Частые ошибки в учебных материалах</b><ul>
<li>Термин ИИ прозвучал на Дартмутской конференции, а не в Карнеги-Меллоне; Маккарти — автор языка Лисп, а не «основоположник программирования».</li>
<li>ELIZA — программа-чат-бот, а не робот. Kismet — социальный робот MIT, Антарктиду исследовал робот Nomad.</li>
<li>«С 2008 года началась эра сингулярности» — прогноз футурологов, а не факт.</li>
<li>Столица Казахстана с 2022 года снова называется Астана.</li>
</ul></div>
`,
traps:["Термин IoT — Кевин Эштон, 1999; термин ИИ — Маккарти, 1956.","Тьюринг в 1950 году предложил тест, а не анализ шахмат."],

{t:"single",lv:"A",q:"Что предложил Алан Тьюринг в 1950 году?",opts:["Тест для проверки, может ли машина мыслить","Язык Лисп","Робота Shakey","Шахматный компьютер Deep Blue"],a:0},

const PYKW="def|return|if|elif|else|for|while|in|not|and|or|import|from|as|with|print|input|range|len|int|str|float|list|dict|set|tuple|True|False|None|break|continue|lambda|global|nonlocal|pass|try|except|is|open|sorted|sum|max|min|abs|round|map|enumerate|bool|ord|chr|bin|oct|hex|append|split|join";
function hl(lang,src){
  let re,cls;
  if(lang==="py"){re=new RegExp('(#[^\\n]*)|("(?:[^"\\\\\\n]|\\\\.)*"|\'(?:[^\'\\\\\\n]|\\\\.)*\')|\\b('+PYKW+')\\b|\\b(\\d+(?:\\.\\d+)?)\\b','g');cls=["cm","s","k","d"]}
  else if(lang==="sql"){re=/(--[^\n]*)|('(?:[^'\n])*')|\b(SELECT|FROM|WHERE|AND|OR|NOT|ORDER|BY|GROUP|HAVING|INSERT|INTO|VALUES|UPDATE|SET|DELETE|CREATE|TABLE|DROP|ALTER|ADD|COLUMN|PRIMARY|FOREIGN|KEY|REFERENCES|INTEGER|INT|VARCHAR|CHAR|DATE|DECIMAL|FLOAT|TEXT|BOOLEAN|NULL|IS|LIKE|BETWEEN|IN|AS|ASC|DESC|DISTINCT|COUNT|SUM|AVG|MIN|MAX|JOIN|INNER|LEFT|RIGHT|ON|LIMIT|UNIQUE|DEFAULT|DATABASE)\b|\b(\d+(?:\.\d+)?)\b/gi;cls=["cm","s","k","d"]}
  else if(lang==="html"){re=/(<!--[\s\S]*?-->)|("[^"\n]*")|(<\/?[a-zA-Z][a-zA-Z0-9]*|\/?>)|([a-z-]+(?=\s*:))/g;cls=["cm","s","tg","k"]}
  else return esc(src);
  let out="",last=0,m;re.lastIndex=0;
  while((m=re.exec(src))){out+=esc(src.slice(last,m.index));let g=1;while(g<m.length&&m[g]===undefined)g++;out+='<span class="'+cls[g-1]+'">'+esc(m[0])+"</span>";last=re.lastIndex;if(m[0]==="")re.lastIndex++}
  return out+esc(src.slice(last));
}

function codeBlock(lang,src){src=src.replace(/^\n+|\s+$/g,"");return '<pre class="code"><code>'+(LN[lang]?'<span class="lang">'+LN[lang]+'</span>':"")+hl(lang,src)+"</code></pre>"}

/* ---------- живой фон из битов ---------- */
let anims=[];

function bitField(canvas,colors,opts){
  opts=opts||{};const ctx=canvas.getContext("2d");let w,h,cols,rows,cells,raf=null,last=0,alive=true;const fs=opts.fs||16;
  function size(){const r=canvas.getBoundingClientRect();const dpr=Math.min(2,window.devicePixelRatio||1);w=r.width;h=r.height;canvas.width=Math.max(1,w*dpr);canvas.height=Math.max(1,h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);cols=Math.ceil(w/fs);rows=Math.ceil(h/(fs*1.15));cells=[];for(let i=0;i<cols*rows;i++)cells.push({v:Math.random()<.5?0:1,a:Math.random()*opts.max,c:Math.floor(Math.random()*6)})}
  function draw(){const cs=colors().map(cssVar);ctx.clearRect(0,0,w,h);ctx.font="600 "+(fs-3)+"px JetBrains Mono, monospace";ctx.textBaseline="top";
    for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const c=cells[y*cols+x];if(c.a<.02)continue;ctx.globalAlpha=c.a;ctx.fillStyle=cs[c.c%cs.length];ctx.fillText(String(c.v),x*fs+3,y*fs*1.15+2)}ctx.globalAlpha=1}
  function step(t){if(!alive)return;if(t-last>90){last=t;for(let k=0;k<Math.ceil(cells.length/30);k++){const c=cells[Math.floor(Math.random()*cells.length)];c.v^=1;c.a=Math.random()<.18?opts.max:c.a*.6}cells.forEach(c=>{c.a*=.985});draw()}raf=requestAnimationFrame(step)}

  if(!RM){raf=requestAnimationFrame(step)}
  const onR=()=>{size();draw()};window.addEventListener("resize",onR);
  return {stop(){alive=false;cancelAnimationFrame(raf);window.removeEventListener("resize",onR)}};
}

const LETTERS="ABCDEFGH";
const TYPE_NAME={single:"Один правильный ответ",multi:"Один или несколько правильных",match:"Соответствие",ctx:"На основе контекста"};
function shuffleIdx(n){const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function grade(q,sel){
  if(q.t==="single"||q.t==="ctx")return sel===q.a?1:0;
  if(q.t==="multi"){const A=new Set(q.a),S=new Set(sel||[]);let e=0;S.forEach(x=>{if(!A.has(x))e++});A.forEach(x=>{if(!S.has(x))e++});return e===0?2:e===1?1:0}
  if(q.t==="match"){let e=0;q.left.forEach((_,i)=>{if((sel||[])[i]!==q.a[i])e++});return e===0?2:e===1?1:0}
}
function renderQ(q,uid,num,opt){
  opt=opt||{};const el=document.createElement("div");el.className="q"+(opt.sec?" "+secCls(opt.sec):"");
  const lv=q.lv||"A";
  el.innerHTML='<div class="meta"><b>'+num+'</b><span class="chip">'+TYPE_NAME[q.t]+'</span><span class="chip lv-'+lv+'">Уровень '+lv+'</span><span>'+maxOf(q)+' '+(maxOf(q)===1?'балл':'балла')+'</span>'+(opt.topic?'<span>Тема '+opt.topic+'</span>':'')+'</div><p class="qt">'+q.q+'</p>'+(q.code?codeBlock(q.lang||"py",q.code):'');
  let get;
  if(q.t==="match"){
    const box=document.createElement("div");box.className="match";
    q.left.forEach((l,i)=>{const r=document.createElement("div");r.className="row";r.innerHTML='<div>'+(i+1)+') '+l+'</div><select id="'+uid+'-m'+i+'" aria-label="Соответствие для пункта '+(i+1)+'"><option value="">— выберите —</option>'+q.right.map((x,j)=>'<option value="'+j+'">'+LETTERS[j]+') '+x.replace(/<[^>]+>/g,"")+'</option>').join("")+'</select>';box.appendChild(r)});
    el.appendChild(box);
    get=()=>q.left.map((_,i)=>{const v=el.querySelector("#"+uid+"-m"+i).value;return v===""?null:+v});
  }else{
    const box=document.createElement("div");box.className="opts";const multi=q.t==="multi";
    q.opts.forEach((o,j)=>{const lab=document.createElement("label");lab.className="opt";lab.innerHTML='<input type="'+(multi?"checkbox":"radio")+'" name="'+uid+'" id="'+uid+'-'+j+'" value="'+j+'"><span class="L">'+LETTERS[j]+'</span><span>'+o+'</span>';box.appendChild(lab)});
    el.appendChild(box);
    get=()=>{const c=[...el.querySelectorAll("input:checked")].map(x=>+x.value);return multi?c:(c.length?c[0]:null)};
  }
  function reveal(sel,pts){
    if(q.t==="match"){el.querySelectorAll(".match .row").forEach((r,i)=>{r.classList.add(sel[i]===q.a[i]?"right":"wrong");if(sel[i]!==q.a[i]){const d=document.createElement("div");d.className="ans";d.innerHTML="Верно: "+LETTERS[q.a[i]]+") "+q.right[q.a[i]];r.appendChild(d)}});el.querySelectorAll("select").forEach(s=>s.disabled=true)}
    else{const A=Array.isArray(q.a)?q.a:[q.a];el.querySelectorAll(".opt").forEach((lab,j)=>{const ch=lab.querySelector("input").checked;if(A.includes(j))lab.classList.add("right");else if(ch)lab.classList.add("wrong")});el.querySelectorAll("input").forEach(i=>i.disabled=true)}
    const mx=maxOf(q);const res=el.querySelector(".res");if(res){res.className="res "+(pts===mx?"ok":pts>0?"part":"bad");res.textContent=(pts===mx?"✓ Верно":pts>0?"◐ Частично":"✗ Неверно")+" · "+pts+" из "+mx}
    if(q.ex){const e=document.createElement("div");e.className="expl";e.innerHTML="<b>Разбор.</b> "+q.ex;el.appendChild(e)}
  }
  if(!opt.exam){
    const qa=document.createElement("div");qa.className="qa";qa.innerHTML='<button class="btn" type="button">Проверить</button><span class="res"></span>';el.appendChild(qa);
    qa.querySelector("button").addEventListener("click",ev=>{const sel=get();const pts=grade(q,sel);ev.target.disabled=true;reveal(sel,pts);
      el.classList.remove("pop","shake");void el.offsetWidth;el.classList.add(pts===maxOf(q)?"pop":"shake");if(pts===maxOf(q))burst(el,true);
      if(opt.onGrade)opt.onGrade(pts)});
  }
  el._get=get;el._reveal=reveal;el._q=q;return el;
}

/* ---------- пробный тест ---------- */
let timerId=null;
function pick(arr,n){return shuffleIdx(arr.length).slice(0,n).map(i=>arr[i])}
function buildMock(){
  const pool={single:[],multi:[],match:[]};
  Object.keys(TOPIC).forEach(id=>qs(id).forEach(q=>{if(pool[q.t])pool[q.t].push({q,topic:id.slice(1)})}));
  const byT={};pool.single.forEach(x=>{(byT[x.topic]=byT[x.topic]||[]).push(x)});
  let singles=Object.values(byT).map(a=>a[Math.floor(Math.random()*a.length)]);
  const rest=pool.single.filter(x=>!singles.includes(x));singles=singles.concat(pick(rest,25-singles.length));
  singles=pick(singles,singles.length);
  const ctx=CONTEXTS[Math.floor(Math.random()*CONTEXTS.length)];
  return {singles,ctx,multi:pick(pool.multi,5),match:pick(pool.match,5)};
}
const secOf=topic=>TOPIC["t"+topic].sec.n;
function showMock(){
  const v=$("#view");v.className="col";
  v.innerHTML='<section class="hero fade"><canvas aria-hidden="true"></canvas><div class="prompt"><span class="u">student@ent</span>:~$ ./mock_test --tasks 40 --time 80m</div><h1>Пробный тест ЕНТ</h1><p>40 заданий в пропорциях спецификации: 25 с одним ответом, 5 по контексту, 5 с несколькими ответами, 5 на соответствие. Максимум 50 баллов, 80 минут. Каждый запуск собирает новый вариант из заданий всех 13 тем.</p><div class="cta"><button class="btn" id="startMock" type="button">▶ Начать вариант</button></div></section>'+pager("mock");

  $("#startMock").addEventListener("click",startMock);
}
function startMock(){
  const M=buildMock();const n0=M.singles.length,nc=M.ctx.questions.length;
  runExam({label:"Пробный тест",minutes:80,again:startMock,logKind:"mock",parts:[
    {title:"Часть 1. Задания с одним правильным ответом",items:M.singles},

/* общий движок экзамена: части, таймер, проверка, итог по темам */
function runExam(P){
  askStudent(false);stopAnims();const v=$("#view");v.className="col";clearInterval(timerId);
  const ctxN=p=>(Array.isArray(p.ctx)?p.ctx:[p.ctx]).reduce((a,c)=>a+c.questions.length,0);
  let total=0;P.parts.forEach(p=>total+=p.ctx?ctxN(p):p.items.length);
  let maxPts=0;P.parts.forEach(p=>{if(p.ctx)maxPts+=ctxN(p);else p.items.forEach(x=>maxPts+=maxOf(x.q))});
  const mm=String(P.minutes).padStart(2,"0")+":00";
  v.innerHTML='<div class="sticky"><div><div class="eyebrow">'+P.label+'</div><b id="answered">Отвечено 0 из '+total+'</b><div class="bar" style="width:180px;margin-top:6px"><i id="ansbar" style="width:0%"></i></div></div><span class="timer" id="timer">'+mm+'</span><button class="btn" id="finish" type="button">Завершить и проверить</button></div>';
  const cards=[];let n=0;
  const add=(q,topic,idx)=>{n++;const el=renderQ(q,"m"+n,n+".",{exam:true,topic,sec:secOf(topic)});el._topic=topic;el._idx=idx;cards.push(el);v.appendChild(el)};
  const h=t=>{const x=document.createElement("h2");x.textContent=t;v.appendChild(x)};
  P.parts.forEach(p=>{const from=n+1;
    if(p.ctx){const cs=Array.isArray(p.ctx)?p.ctx:[p.ctx];const cnt=cs.reduce((a,c)=>a+c.questions.length,0);if(!cnt)return;h(p.title+" ("+from+"–"+(from+cnt-1)+")");
      cs.forEach(c=>{const b=document.createElement("div");b.className="ctx";b.innerHTML='<b>'+c.title+'</b>'+prep(c.text);v.appendChild(b);c.questions.forEach(q=>{q.t="ctx";add(q,c.topic)})})}
    else{if(!p.items.length)return;h(p.title+" ("+from+"–"+(from+p.items.length-1)+")");p.items.forEach(x=>add(x.q,x.topic,x.idx))}});
  const isAns=s=>s!==null&&!(Array.isArray(s)&&(s.length===0||s.every(z=>z===null)));
  const upd=()=>{let a=0;cards.forEach(c=>{if(isAns(c._get()))a++});$("#answered").textContent="Отвечено "+a+" из "+total;$("#ansbar").style.width=(a/total*100)+"%"};
  v.addEventListener("change",upd);
  const fmt=x=>{const hh=Math.floor(x/3600),mi=Math.floor(x%3600/60),se=x%60;return (hh?hh+":"+String(mi).padStart(2,"0"):String(mi).padStart(2,"0"))+":"+String(se).padStart(2,"0")};
  let left=P.minutes*60;$("#timer").textContent=fmt(left);timerId=setInterval(()=>{left--;const t=$("#timer");if(!t){clearInterval(timerId);return}t.textContent=fmt(left);t.classList.toggle("low",left<=300);if(left<=0)finish()},1000);
  let done=false;
  function finish(){if(done)return;done=true;clearInterval(timerId);let tot=0;const per={};
    cards.forEach(c=>{const s=c._get();const p=grade(c._q,s);tot+=p;const k=c._topic;per[k]=per[k]||[0,0];per[k][0]+=p;per[k][1]+=maxOf(c._q);c._reveal(s,p);
      if(P.saveProgress&&c._idx!==undefined&&isAns(s)){const key="t"+k+":"+c._idx;store[key]=p;logEvent({k:"q",t:k,i:c._idx,p,m:maxOf(c._q)})}});
    if(P.saveProgress){save();buildNav();mark(location.hash.slice(1))}
    const rows=Object.keys(per).sort().map(k=>{const [a,b]=per[k];return '<tr class="'+secCls(secOf(k))+'"><td><a href="#t'+k+'">'+k+'. '+TOPIC["t"+k].title+'</a></td><td class="c">'+a+' / '+b+'</td><td style="min-width:120px"><div class="bar"><i style="width:'+Math.round(a/b*100)+'%;background:var(--c)"></i></div></td></tr>'}).join("");
    const pct=Math.round(tot/maxPts*100);
    const verdict=pct>=80?"Отличный результат: раздел усвоен.":pct>=60?"Хороший уровень. Повторите темы с низкой долей верных ответов.":pct>=40?"Базовый уровень. Перечитайте теорию слабых тем и пройдите их тренажёры.":"Раздел пока не усвоен. Начните с теории и тренажёров каждой темы.";
    const box=document.createElement("div");box.className="note ex";box.innerHTML='<b>Результат</b><div class="kv"><div><b id="totB">0</b><span>баллов из '+maxPts+'</span></div><div><b id="pctB">0%</b><span>выполнения</span></div></div><p>'+verdict+'</p><div class="tw"><table><tr><th>Тема</th><th class="c">Баллы</th><th>Доля</th></tr>'+rows+'</table></div><p>Ниже разобраны все задания. Слабые темы откройте по ссылкам в таблице.</p><div class="qa"><button class="btn" type="button" id="again">Новый вариант</button></div>';
    $(".sticky").after(box);$("#finish").disabled=true;$("#again").addEventListener("click",P.again);window.scrollTo({top:0});
    if(P.logKind==="mock"){const perT={};Object.keys(per).forEach(k=>perT[k]=per[k][0]+"/"+per[k][1]);logEvent({k:"mock",s:tot,per:perT})}
    countUp($("#totB"),tot," / "+maxPts);countUp($("#pctB"),pct,"%");if(pct>=70)burst(box,true);
  }
  $("#finish").addEventListener("click",finish);
}

/* ---------- тест по разделу: 100 заданий в пропорциях ЕНТ ---------- */
const SEC_PLAN={single:65,ctx:10,multi:12,match:13};
function secPool(sn){const S=SECTIONS.find(s=>s.n===sn);const pool={single:[],multi:[],match:[]};
  S.topics.forEach(([id])=>qs(id).forEach((q,i)=>{if(pool[q.t])pool[q.t].push({q,topic:id.slice(1),idx:i})}));
  const ctx=CONTEXTS.filter(c=>S.topics.some(([id])=>id.slice(1)===c.topic));return {S,pool,ctx}}
function buildSection(sn){const {pool,ctx}=secPool(sn);
  const cx=pick(ctx,Math.min(ctx.length,Math.ceil(SEC_PLAN.ctx/5)));const nCtx=cx.reduce((a,c)=>a+c.questions.length,0);
  const nMulti=Math.min(SEC_PLAN.multi,pool.multi.length),nMatch=Math.min(SEC_PLAN.match,pool.match.length);
  const nSingle=Math.min(pool.single.length,100-nCtx-nMulti-nMatch);
  return {ctx:cx,singles:pick(pool.single,nSingle),multi:pick(pool.multi,nMulti),match:pick(pool.match,nMatch)}}
function showSection(sn){
  const v=$("#view");const {S,pool,ctx}=secPool(sn);v.className="col "+secCls(sn);
  const tot=pool.single.length+pool.multi.length+pool.match.length+ctx.reduce((a,c)=>a+c.questions.length,0);
  v.innerHTML='<header class="banner fade"><canvas aria-hidden="true"></canvas><div class="eyebrow">Раздел '+sn+' · итоговый тест</div><h1>Тест по разделу '+sn+'. '+S.t+'</h1><p class="lead" style="margin:0">100 заданий по темам '+S.topics.map(([id])=>id.slice(1)).join(", ")+' в пропорциях ЕНТ. Максимум 125 баллов, время 200 минут (по 2 минуты на задание). Каждый запуск собирает новый вариант из банка раздела.</p></header>'+
    '<div class="tw"><table><tr><th>Часть</th><th class="c">Заданий</th><th class="c">Баллов за задание</th><th class="c">Всего баллов</th></tr><tr><td>1. Один правильный ответ</td><td class="c">65</td><td class="c">1</td><td class="c">65</td></tr><tr><td>2. На основе контекста</td><td class="c">10</td><td class="c">1</td><td class="c">10</td></tr><tr><td>3. Один или несколько правильных ответов</td><td class="c">12</td><td class="c">2</td><td class="c">24</td></tr><tr><td>4. Соответствие</td><td class="c">13</td><td class="c">2</td><td class="c">26</td></tr><tr><td><b>Итого</b></td><td class="c"><b>100</b></td><td class="c"></td><td class="c"><b>125</b></td></tr></table></div>'+
    '<p style="color:var(--muted)">В банке раздела '+tot+' заданий. Результаты попадут в прогресс по темам'+(statsOn()?' и в статистику учителя':'')+'.</p><div class="qa"><button class="btn" id="startSec" type="button">▶ Начать тест по разделу</button></div>'+pager("sec"+sn);
  const sv="--s"+(+sn);anims.push(bitField(v.querySelector(".banner canvas"),()=>[sv],{fs:15,max:.35}));
  $("#startSec").addEventListener("click",()=>startSection(sn));
}
function startSection(sn){const M=buildSection(sn);
  runExam({label:"Тест по разделу "+sn,minutes:200,again:()=>startSection(sn),saveProgress:true,parts:[
    {title:"Часть 1. Задания с одним правильным ответом",items:M.singles},
    {title:"Часть 2. Задания на основе контекста",ctx:M.ctx},
    {title:"Часть 3. Один или несколько правильных ответов",items:M.multi},
    {title:"Часть 4. Задания на соответствие",items:M.match}]});
  document.getElementById("view").classList.add(secCls(sn).split(" ")[1]);
}

/* ---------- кабинет учителя ---------- */
let teacherData=null;
function fmtDate(t){if(!t)return"—";const d=new Date(t);return d.toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})}
function showTeacher(){
  const v=$("#view");v.className="col";
  let h='<section class="hero fade"><canvas aria-hidden="true"></canvas><div class="prompt"><span class="u">teacher@ent</span>:~$ SELECT * FROM results ORDER BY class;</div><h1>Кабинет учителя</h1><p>Сводка по ученикам: сколько заданий решено в каждой теме, доля верных ответов и результаты пробных тестов. Данные хранятся в вашей Google Таблице.</p></section>';
  if(!statsOn()){
    h+='<div class="note trap"><b>Статистика ещё не подключена</b>Чтобы ученики отправляли результаты, подключите Google Таблицу. Инструкция и код скрипта лежат в репозитории в файле <code>google-apps-script.gs</code>. Когда скрипт будет развёрнут, URL веб-приложения нужно вписать в строку <code>STATS_URL</code> в файле <code>index.html</code>.</div>';
    v.innerHTML=h;anims.push(bitField(v.querySelector(".hero canvas"),()=>["--s2","--s4","--s1"],{fs:17,max:.35}));return}
  h+='<form class="filters" id="tkForm"><div class="fld"><label for="tKey">Пароль учителя</label><input id="tKey" type="password" autocomplete="current-password"></div><button class="btn" type="submit">Показать статистику</button></form><div class="err" id="tErr"></div><div id="tOut"></div>';
  v.innerHTML=h;anims.push(bitField(v.querySelector(".hero canvas"),()=>["--s2","--s4","--s1"],{fs:17,max:.35}));
  let saved="";try{saved=sessionStorage.getItem("ent-tkey")||""}catch(e){}
  $("#tKey").value=saved;
  $("#tkForm").addEventListener("submit",e=>{e.preventDefault();loadTeacher($("#tKey").value)});
  if(saved)loadTeacher(saved);else if(teacherData)renderTeacher();
}
async function loadTeacher(key){
  $("#tErr").textContent="";$("#tOut").innerHTML='<p style="color:var(--muted)">Загружаю данные из таблицы…</p>';
  try{const r=await fetch(STATS_URL,{method:"POST",body:JSON.stringify({action:"stats",key})});const j=await r.json();
    if(!j.ok){$("#tOut").innerHTML="";$("#tErr").textContent=j.error==="bad_key"?"Неверный пароль. Он задан в строке TEACHER_KEY скрипта таблицы.":"Таблица ответила ошибкой: "+j.error;return}
    try{sessionStorage.setItem("ent-tkey",key)}catch(e){}teacherData=j;renderTeacher();
  }catch(e){$("#tOut").innerHTML="";$("#tErr").textContent="Не удалось связаться с таблицей. Проверьте интернет и то, что веб-приложение развёрнуто с доступом «Все»."}
}
function topicTotals(){const o={};Object.keys(TOPIC).forEach(id=>o[id.slice(1)]=qs(id).length);return o}
const TKEYS=ORDER.filter(x=>/^t\d\d$/.test(x)).map(x=>x.slice(1));
function renderTeacher(){
  const out=$("#tOut");const S=teacherData.students||[];const TT=topicTotals();const nAll=Object.values(TT).reduce((a,b)=>a+b,0);
  if(!S.length){out.innerHTML='<div class="note"><b>Пока пусто</b>Ни один ученик ещё не отправил результаты. Они появятся здесь, когда ученики укажут имя и класс и решат хотя бы одно задание.</div>';return}
  const classes=[...new Set(S.map(s=>s.cls))].sort((a,b)=>a.localeCompare(b,"ru",{numeric:true}));
  out.innerHTML='<div class="filters"><div class="fld"><label for="tCls">Класс</label><select id="tCls"><option value="">Все классы</option>'+classes.map(c=>'<option>'+esc(c)+'</option>').join("")+'</select></div><div class="fld"><label for="tSort">Сортировка</label><select id="tSort"><option value="ok">По верным ответам</option><option value="name">По имени</option><option value="last">По последней активности</option><option value="mock">По пробному тесту</option></select></div><button class="btn ghost" type="button" id="tReload">Обновить</button></div><div class="kv" id="tKv"></div><div class="tw"><table class="tbl-st"><thead><tr><th>Ученик</th><th class="c">Класс</th><th class="c">Решено</th><th class="c">Верно</th><th>Темы 01–13 (доля верных от всех заданий темы)</th><th class="c">Пробный тест</th><th>Активность</th></tr></thead><tbody id="tBody"></tbody></table></div><p class="privacy">Нажмите на строку, чтобы увидеть темы ученика подробно. Таблица обновлена: '+fmtDate(teacherData.generated)+'.</p>';
  const draw=()=>{const cf=$("#tCls").value,so=$("#tSort").value;let L=S.filter(s=>!cf||s.cls===cf).map(s=>{let done=0,ok=0;Object.values(s.topics).forEach(t=>{done+=t.done;ok+=t.ok});const best=s.mocks.length?Math.max(...s.mocks.map(m=>m.s)):null;const lastM=s.mocks.length?s.mocks.slice().sort((a,b)=>b.t-a.t)[0].s:null;return Object.assign({},s,{done,ok,best,lastM})});
    L.sort((a,b)=>so==="name"?a.name.localeCompare(b.name,"ru"):so==="last"?b.last-a.last:so==="mock"?(b.best??-1)-(a.best??-1):b.ok-a.ok);
    const avg=L.length?Math.round(L.reduce((x,s)=>x+(s.done?s.ok/s.done:0),0)/L.length*100):0;const mk=L.filter(s=>s.best!==null);
    $("#tKv").innerHTML='<div><b>'+L.length+'</b><span>учеников</span></div><div><b>'+L.reduce((x,s)=>x+s.done,0)+'</b><span>решённых заданий</span></div><div><b>'+avg+'%</b><span>в среднем верных ответов</span></div><div><b>'+(mk.length?Math.round(mk.reduce((x,s)=>x+s.best,0)/mk.length):"—")+'</b><span>средний лучший балл пробного теста</span></div>';
    $("#tBody").innerHTML=L.map((s,ix)=>{const cells=TKEYS.map(k=>{const t=s.topics[k]||{done:0,ok:0};const pct=TT[k]?t.ok/TT[k]:0;const sec=TOPIC["t"+k].sec.n;return '<i class="'+secCls(sec)+'" title="Тема '+k+': верно '+t.ok+' из '+TT[k]+', решено '+t.done+'" style="background:color-mix(in srgb,var(--c) '+Math.round(8+pct*72)+'%,var(--sunk))">'+k+'</i>'}).join("");
      return '<tr class="st" data-ix="'+ix+'" tabindex="0"><td class="nm">'+esc(s.name)+'</td><td class="c">'+esc(s.cls)+'</td><td class="c">'+s.done+' / '+nAll+'</td><td class="c">'+(s.done?Math.round(s.ok/s.done*100)+'%':'—')+'</td><td><div class="heat">'+cells+'</div></td><td class="c">'+(s.best!==null?'лучший '+s.best+'<br><span class="privacy">последний '+s.lastM+', всего '+s.mocks.length+'</span>':'—')+'</td><td>'+fmtDate(s.last)+'</td></tr>'}).join("");
    $("#tBody").onclick=$("#tBody").onkeydown=e=>{if(e.type==="keydown"&&e.key!=="Enter")return;const tr=e.target.closest("tr.st");if(!tr)return;const nx=tr.nextElementSibling;if(nx&&nx.classList.contains("detail")){nx.remove();return}const s=L[+tr.dataset.ix];
      const rows=TKEYS.map(k=>{const t=s.topics[k]||{done:0,ok:0};return '<tr class="'+secCls(TOPIC["t"+k].sec.n)+'"><td><a href="#t'+k+'">'+k+'. '+TOPIC["t"+k].title+'</a></td><td class="c">'+t.done+' / '+TT[k]+'</td><td class="c">'+t.ok+'</td><td style="min-width:110px"><div class="bar"><i style="width:'+Math.round(t.ok/TT[k]*100)+'%;background:var(--c)"></i></div></td></tr>'}).join("");
      tr.insertAdjacentHTML("afterend",'<tr class="detail"><td colspan="7"><div class="tw"><table><tr><th>Тема</th><th class="c">Решено</th><th class="c">Верно</th><th>Доля верных</th></tr>'+rows+'</table></div></td></tr>')}};
  $("#tCls").onchange=draw;$("#tSort").onchange=draw;$("#tReload").onclick=()=>{let k="";try{k=sessionStorage.getItem("ent-tkey")||""}catch(e){}loadTeacher(k||$("#tKey").value)};
  draw();
}

/* ---------- роутер ---------- */
function mark(id){document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.id===id))}
function route(){
  let id=(location.hash||"#spec").slice(1);if(!ORDER.includes(id)&&id!=="teacher")id="spec";
  clearInterval(timerId);stopAnims();
  if(id==="spec")showSpec();else if(id==="mock")showMock();else if(id==="teacher")showTeacher();else if(/^sec\d\d$/.test(id))showSection(id.slice(3));else showTopic(id);
  mark(id);$("#aside").classList.remove("open");$("#menuBtn").setAttribute("aria-expanded","false");window.scrollTo(0,0);
}
buildNav();renderWho();route();window.addEventListener("hashchange",route);flush();
</script>
