html:String.raw`
<h2>Современные тенденции IT</h2>
<h3>Искусственный интеллект</h3>
<p><b>ИИ</b> — системы, выполняющие задачи, для которых обычно нужен человеческий интеллект: распознавание, перевод, прогноз, генерация текста и изображений.</p>
<table>
<tr><th>Понятие</th><th>Суть</th></tr>
<tr><td>Машинное обучение</td><td>Модель учится на данных, а не программируется правилами</td></tr>
<tr><td>Обучение с учителем</td><td>Данные размечены: известен правильный ответ (спам или не спам)</td></tr>
<tr><td>Обучение без учителя</td><td>Разметки нет, модель сама ищет структуру (кластеризация покупателей)</td></tr>
<tr><td>Обучение с подкреплением</td><td>Агент получает награду или штраф за действия (игры, роботы)</td></tr>
<tr><td>Нейронная сеть, глубокое обучение</td><td>Многослойные сети искусственных нейронов</td></tr>
<tr><td>Генеративный ИИ, LLM</td><td>Большие языковые модели создают текст, код, изображения по запросу</td></tr>
<tr><td>Компьютерное зрение, NLP</td><td>Анализ изображений; обработка естественного языка</td></tr>
</table>
<p>Риски ИИ: предвзятость данных, дипфейки, ошибки («галлюцинации»), вопросы авторского права и приватности.</p>

<h3>Другие технологии</h3>
<table>
<tr><th>Технология</th><th>Суть</th></tr>
<tr><td>Большие данные (Big Data)</td><td>Наборы данных, которые не обработать обычными средствами. Характеристики «V»: объём (volume), скорость (velocity), разнообразие (variety), достоверность, ценность</td></tr>
<tr><td>Облачные вычисления</td><td>Ресурсы по запросу через интернет. IaaS — аренда серверов и хранилищ; PaaS — платформа для разработки и запуска своих приложений; SaaS — готовое приложение в браузере (почта, офисные пакеты)</td></tr>
<tr><td>Интернет вещей (IoT)</td><td>Устройства с датчиками обмениваются данными через сеть: умный дом, умный город, носимые трекеры</td></tr>
<tr><td>Блокчейн</td><td>Распределённый реестр. Каждый блок содержит хеш предыдущего, поэтому старую запись нельзя незаметно изменить. Криптовалюты, смарт-контракты</td></tr>
<tr><td>VR / AR / MR</td><td>VR — полное погружение в виртуальный мир; AR — цифровые объекты поверх реального изображения; MR — смешанная реальность, где виртуальные объекты взаимодействуют с реальными</td></tr>
<tr><td>5G, периферийные вычисления</td><td>Высокая скорость и малая задержка связи; обработка данных ближе к источнику</td></tr>
<tr><td>Квантовые вычисления</td><td>Кубиты могут находиться в суперпозиции состояний 0 и 1</td></tr>
<tr><td>Цифровой двойник</td><td>Виртуальная копия реального объекта или процесса для моделирования</td></tr>
<tr><td>Цифровое государство</td><td>Электронные госуслуги (eGov.kz), ЭЦП, цифровые документы</td></tr>
</table>

<h2>IT-стартап</h2>
<p><b>Стартап</b> — молодая компания, которая создаёт новый продукт и ищет масштабируемую бизнес-модель в условиях неопределённости.</p>
<h3>Этапы развития</h3>
<table>
<tr><th>Этап</th><th>Что делают</th></tr>
<tr><td>Идея</td><td>Находят реальную проблему целевой аудитории</td></tr>
<tr><td>Проверка (валидация)</td><td>Опросы, интервью, анализ рынка и конкурентов</td></tr>
<tr><td>MVP</td><td>Минимально жизнеспособный продукт: только ключевые функции, чтобы быстро проверить спрос</td></tr>
<tr><td>Product-market fit</td><td>Продукт нужен рынку, пользователи готовы платить</td></tr>
<tr><td>Масштабирование</td><td>Рост команды, рынков, выручки</td></tr>
<tr><td>Выход</td><td>Продажа компании или IPO</td></tr>
</table>
<p><b>Пивот</b> — смена направления продукта или бизнес-модели, когда первоначальная гипотеза не подтвердилась.</p>
<h3>Финансирование</h3>
<table>
<tr><th>Стадия или источник</th><th>Описание</th></tr>
<tr><td>Bootstrapping, FFF</td><td>Собственные деньги основателей, а также друзей и семьи</td></tr>
<tr><td>Pre-seed, seed (посевная)</td><td>Первые инвестиции на проверку идеи и создание MVP</td></tr>
<tr><td>Раунды A, B, C</td><td>Крупные вложения венчурных фондов на рост после подтверждения спроса</td></tr>
<tr><td>IPO</td><td>Первичное публичное размещение акций на бирже</td></tr>
<tr><td>Бизнес-ангел</td><td>Частный инвестор, вкладывающий личные деньги на ранней стадии</td></tr>
<tr><td>Венчурный фонд</td><td>Инвестирует деньги многих вкладчиков в рискованные компании в обмен на долю</td></tr>
<tr><td>Инкубатор, акселератор</td><td>Инкубатор помогает с идеей и офисом; акселератор — короткая интенсивная программа роста с менторами и инвестициями</td></tr>
<tr><td>Краудфандинг</td><td>Сбор денег с большого числа людей через интернет-платформы</td></tr>
<tr><td>Гранты</td><td>Безвозвратное финансирование от государства или фондов</td></tr>
</table>
<p>В Казахстане IT-стартапы поддерживает международный технопарк <b>Astana Hub</b>: акселерационные программы, налоговые льготы для участников.</p>
<h3>Инструменты</h3>
<p><b>Business Model Canvas</b> описывает бизнес в 9 блоках: потребительские сегменты, ценностное предложение, каналы сбыта, отношения с клиентами, потоки доходов, ключевые ресурсы, ключевые виды деятельности, ключевые партнёры, структура издержек. <b>Lean Canvas</b> — его вариант для стартапов (проблема, решение, ключевые метрики, уникальное преимущество). <b>SWOT-анализ</b>: сильные и слабые стороны, возможности и угрозы. <b>Питч</b> — короткая презентация проекта для инвесторов; <b>elevator pitch</b> укладывается в 30–60 секунд. <b>Единорог</b> — стартап с оценкой больше 1 млрд долларов.</p>

<h2>3D-моделирование</h2>
<p><b>3D-модель</b> — цифровое описание объекта в трёх измерениях (оси X, Y, Z).</p>
<h3>Полигональная сетка</h3>
<table>
<tr><th>Элемент</th><th>Определение</th></tr>
<tr><td>Вершина (vertex)</td><td>Точка в пространстве с координатами (x, y, z)</td></tr>
<tr><td>Ребро (edge)</td><td>Отрезок между двумя вершинами</td></tr>
<tr><td>Грань, полигон (face)</td><td>Плоская фигура, ограниченная рёбрами: треугольник или четырёхугольник</td></tr>
<tr><td>Сетка (mesh)</td><td>Совокупность вершин, рёбер и граней, задающая форму</td></tr>
</table>
<p>У куба 8 вершин, 12 рёбер и 6 граней. Для выпуклых многогранников верна формула Эйлера <span class="f">В − Р + Г = 2</span>: 8 − 12 + 6 = 2.</p>
<h3>Виды моделирования и операции</h3>
<ul>
<li><b>Полигональное</b> — из сетки полигонов (игры, анимация).</li>
<li><b>Сплайновое (NURBS)</b> — из гладких кривых (автомобильный дизайн).</li>
<li><b>Твердотельное (CAD)</b> — точные детали с размерами для производства.</li>
<li><b>Скульптинг</b> — «лепка» цифровой глины (персонажи).</li>
</ul>
<p>Базовые операции: создание <b>примитивов</b> (куб, сфера, цилиндр, конус, тор); перемещение, поворот, масштабирование; <b>экструзия</b> (выдавливание грани для создания объёма); <b>булевы операции</b> (объединение, вычитание, пересечение тел); сглаживание; модификаторы.</p>
<h3>Этапы создания</h3>
<p>Моделирование геометрии → текстурирование (UV-развёртка, материалы) → освещение → настройка камеры → <b>рендеринг</b> (расчёт итогового изображения) → анимация при необходимости.</p>
<h3>Программы и форматы</h3>
<table>
<tr><th>Программа</th><th>Особенность</th></tr>
<tr><td>Blender</td><td>Свободная, полный цикл: моделирование, анимация, рендеринг. Формат .blend</td></tr>
<tr><td>Tinkercad</td><td>Онлайн, для начинающих, сборка из примитивов</td></tr>
<tr><td>SketchUp</td><td>Архитектура и интерьеры</td></tr>
<tr><td>Autodesk 3ds Max, Maya</td><td>Визуализация, игры, кино</td></tr>
<tr><td>Fusion 360, КОМПАС-3D, AutoCAD</td><td>САПР: инженерные детали и чертежи</td></tr>
</table>
<table>
<tr><th>Формат</th><th>Что хранит</th></tr>
<tr><td>STL</td><td>Только геометрию поверхности из треугольников. Стандарт для 3D-печати</td></tr>
<tr><td>OBJ</td><td>Геометрию, текстурные координаты, ссылку на материалы</td></tr>
<tr><td>FBX</td><td>Геометрию, материалы, анимацию, скелет</td></tr>
<tr><td>glTF / GLB</td><td>Компактный формат для веба и AR</td></tr>
<tr><td>3MF</td><td>Современный формат 3D-печати с цветом и материалами</td></tr>
</table>
<h3>3D-печать</h3>
<p>3D-печать — <b>аддитивная технология</b>: объект создаётся послойным наращиванием материала. Обработка на фрезерном станке с ЧПУ, наоборот, субтрактивная: материал снимают.</p>
<table>
<tr><th>Технология</th><th>Принцип</th></tr>
<tr><td>FDM</td><td>Расплавленная пластиковая нить (PLA, ABS) выдавливается через сопло слой за слоем</td></tr>
<tr><td>SLA</td><td>Жидкая фотополимерная смола отверждается лазером или УФ-светом</td></tr>
<tr><td>SLS</td><td>Лазер спекает порошок (полиамид, металл)</td></tr>
</table>
<p>Перед печатью модель обрабатывает <b>слайсер</b> (Cura, PrusaSlicer): нарезает её на слои и создаёт G-код с командами для принтера. Применение: прототипы, медицина (протезы, импланты), архитектурные макеты, образование.</p>

<div class="note trap"><b>Ловушки ЕНТ</b>
<ul>
<li>SaaS — готовая программа, PaaS — платформа для своих программ, IaaS — «железо» в аренду.</li>
<li>AR дополняет реальность, VR её полностью заменяет.</li>
<li>MVP — не «прототип для красоты», а продукт для проверки спроса на реальных пользователях.</li>
<li>Рендеринг — расчёт изображения, а не создание модели.</li>
<li>STL не хранит цвет и текстуры.</li>
</ul></div>

<h2>Электронные таблицы</h2>
<p>Книга состоит из листов, лист — из ячеек. Адрес ячейки — буква столбца и номер строки: <code>B3</code>. Диапазон <code>B2:D5</code> — прямоугольник от B2 до D5: 3 столбца × 4 строки = 12 ячеек. В ячейке может быть число, текст, дата или формула. Формула начинается со знака <code>=</code>.</p>

<h3>Относительные, абсолютные и смешанные ссылки</h3>
<table>
<tr><th>Ссылка</th><th>Вид</th><th>При копировании</th></tr>
<tr><td>Относительная</td><td><code>A1</code></td><td>Меняются и столбец, и строка</td></tr>
<tr><td>Абсолютная</td><td><code>$A$1</code></td><td>Не меняется</td></tr>
<tr><td>Смешанная</td><td><code>$A1</code></td><td>Столбец закреплён, строка меняется</td></tr>
<tr><td>Смешанная</td><td><code>A$1</code></td><td>Строка закреплена, столбец меняется</td></tr>
</table>
<p>Знак <code>$</code> закрепляет то, перед чем стоит. В Excel ссылки переключаются клавишей F4.</p>
<div class="note ex"><b>Пример</b>В D3 записано <code>=$A3+B$2</code>. Формулу скопировали в F5: сдвиг на 2 столбца вправо и 2 строки вниз. $A не меняется, 3 → 5; B → D, $2 не меняется. Получится <code>=$A5+D$2</code>.</div>

<h3>Основные функции</h3>
<p>В русской версии Excel аргументы разделяются точкой с запятой, в английской — запятой.</p>
<table>
<tr><th>Русская</th><th>Английская</th><th>Что делает</th></tr>
<tr><td>СУММ</td><td>SUM</td><td>Сумма</td></tr>
<tr><td>СРЗНАЧ</td><td>AVERAGE</td><td>Среднее арифметическое. Пустые ячейки и текст не учитываются</td></tr>
<tr><td>МИН, МАКС</td><td>MIN, MAX</td><td>Наименьшее и наибольшее</td></tr>
<tr><td>СЧЁТ</td><td>COUNT</td><td>Число ячеек с числами</td></tr>
<tr><td>СЧЁТЗ</td><td>COUNTA</td><td>Число непустых ячеек</td></tr>
<tr><td>СЧЁТЕСЛИ</td><td>COUNTIF</td><td>Число ячеек, удовлетворяющих условию: <code>=СЧЁТЕСЛИ(A1:A5;">5")</code></td></tr>
<tr><td>СУММЕСЛИ</td><td>SUMIF</td><td>Сумма ячеек по условию</td></tr>
<tr><td>ЕСЛИ</td><td>IF</td><td><code>=ЕСЛИ(условие;значение_если_да;значение_если_нет)</code></td></tr>
<tr><td>И, ИЛИ, НЕ</td><td>AND, OR, NOT</td><td>Составные условия: <code>=ЕСЛИ(И(B2>=40;C2>=40);"да";"нет")</code></td></tr>
<tr><td>ВПР</td><td>VLOOKUP</td><td>Ищет значение в первом столбце таблицы и возвращает значение из указанного столбца</td></tr>
<tr><td>ОКРУГЛ</td><td>ROUND</td><td>Округление до заданного числа знаков</td></tr>
</table>
<div class="note ex"><b>Пример</b>A1 = 5, A2 = 8, A3 пустая, A4 = 3, A5 = 12. <code>=СЧЁТ(A1:A5)</code> = 4. <code>=СУММ(A1:A5)</code> = 28. <code>=СРЗНАЧ(A1:A5)</code> = 28 / 4 = 7 (пустая ячейка не считается). <code>=СЧЁТЕСЛИ(A1:A5;">5")</code> = 2. <code>=МАКС(A1:A5)-МИН(A1:A5)</code> = 9.</div>

<h3>Ошибки в формулах</h3>
<table>
<tr><th>Ошибка</th><th>Причина</th></tr>
<tr><td>#ДЕЛ/0! (#DIV/0!)</td><td>Деление на ноль или на пустую ячейку</td></tr>
<tr><td>#ЗНАЧ! (#VALUE!)</td><td>Неверный тип аргумента, например текст в арифметике</td></tr>
<tr><td>#ИМЯ? (#NAME?)</td><td>Неизвестное имя функции или опечатка</td></tr>
<tr><td>#ССЫЛКА! (#REF!)</td><td>Ссылка на удалённую ячейку</td></tr>
<tr><td>#Н/Д (#N/A)</td><td>Значение не найдено (часто у ВПР)</td></tr>
<tr><td>#####</td><td>Число не помещается в ширину столбца</td></tr>
</table>

<h3>Диаграммы и обработка данных</h3>
<table>
<tr><th>Тип</th><th>Для чего</th></tr>
<tr><td>Гистограмма, линейчатая</td><td>Сравнение величин по категориям</td></tr>
<tr><td>Круговая</td><td>Доли целого (сумма 100%)</td></tr>
<tr><td>График (линейная)</td><td>Изменение во времени</td></tr>
<tr><td>Точечная</td><td>Зависимость одной величины от другой</td></tr>
</table>
<p>Сортировка упорядочивает строки, фильтр временно скрывает строки, не подходящие под условие. Условное форматирование меняет вид ячейки в зависимости от значения.</p>

<h2>Текстовые документы</h2>
<table>
<tr><th>Уровень</th><th>Что форматируют</th></tr>
<tr><td>Символ</td><td>Шрифт, размер (пт), начертание (полужирный, курсив, подчёркивание), цвет, надстрочный и подстрочный</td></tr>
<tr><td>Абзац</td><td>Выравнивание (по левому краю, по центру, по правому, по ширине), отступы, отступ первой строки, межстрочный интервал, интервалы до и после</td></tr>
<tr><td>Страница</td><td>Поля, ориентация (книжная, альбомная), размер бумаги (A4 — 210 × 297 мм), колонтитулы, нумерация</td></tr>
</table>
<p><b>Стили</b> задают оформление заголовков и текста одним набором. На их основе строится <b>автоматическое оглавление</b>. Также используются сноски, разрывы страниц и разделов, таблицы, списки. Совместная работа: облачные редакторы (Google Документы, Word Online), комментарии, режим рецензирования, история версий. Форматы: .docx, .odt, .rtf, .txt (без форматирования), .pdf (для просмотра и печати, вид не меняется).</p>

<h2>Графика</h2>
<table>
<tr><th>Формат</th><th>Тип</th><th>Особенности</th></tr>
<tr><td>JPEG</td><td>Растровый</td><td>Сжатие с потерями, фотографии, нет прозрачности</td></tr>
<tr><td>PNG</td><td>Растровый</td><td>Сжатие без потерь, прозрачность, скриншоты и логотипы</td></tr>
<tr><td>GIF</td><td>Растровый</td><td>До 256 цветов, простая анимация</td></tr>
<tr><td>BMP</td><td>Растровый</td><td>Обычно без сжатия, большой объём</td></tr>
<tr><td>TIFF</td><td>Растровый</td><td>Полиграфия, сканирование, без потерь</td></tr>
<tr><td>SVG</td><td>Векторный</td><td>Для веба, текстовое описание в XML</td></tr>
<tr><td>CDR, AI</td><td>Векторный</td><td>Форматы CorelDRAW и Adobe Illustrator</td></tr>
</table>
<p>Растровые редакторы: Adobe Photoshop, GIMP, Krita. Векторные: CorelDRAW, Adobe Illustrator, Inkscape, Figma. Работа со <b>слоями</b> позволяет менять части изображения независимо. Преобразования: обрезка, изменение размера и разрешения, коррекция цвета, перевод формата. При увеличении растрового изображения появляется пикселизация.</p>

<h2>Презентации и мультимедиа</h2>
<p>Презентация состоит из слайдов на основе макетов. Переходы применяются между слайдами, анимация — к объектам на слайде. Хороший слайд содержит одну мысль, крупный контрастный текст и минимум текста.</p>
<p>Видеомонтаж ведётся на <b>монтажной шкале</b> (таймлайне): нарезка, переходы, титры, наложение звука. Готовый проект <b>экспортируется</b> (рендерится) в файл, например MP4 с кодеком H.264. Аудио редактируют, например, в Audacity: обрезка, нормализация громкости, шумоподавление. <b>Инфографика</b> передаёт данные с помощью графики, иконок и диаграмм.</p>

<div class="note trap"><b>Ловушки ЕНТ</b>
<ul>
<li>При копировании формулы смещение считается от исходной ячейки до новой, отдельно по столбцам и по строкам.</li>
<li>СРЗНАЧ делит на число числовых ячеек, а не на размер диапазона.</li>
<li>СЧЁТ не считает текст, СЧЁТЗ считает.</li>
<li>Курсив — форматирование символов, а не абзаца.</li>
<li>Для долей целого подходит круговая диаграмма, для динамики — график.</li>
</ul></div>

reg("t13",{lead:"Разметка HTML, оформление CSS, адаптивная вёрстка и этапы создания сайта. Задания проверяют знание тегов, атрибутов, селекторов и блочной модели.",

<h2>Как работает веб</h2>
<p><b>Браузер</b> (клиент) по протоколу HTTP или HTTPS запрашивает страницу у <b>веб-сервера</b> по адресу <b>URL</b>. Сервер возвращает HTML-файл, а браузер отображает его вместе со стилями CSS и скриптами JavaScript. <b>Хостинг</b> — место на сервере для файлов сайта, <b>домен</b> — имя сайта (например, testcenter.kz), которое DNS переводит в IP-адрес.</p>
<table>
<tr><th>Часть</th><th>Технологии</th><th>Отвечает за</th></tr>
<tr><td>Frontend (клиентская)</td><td>HTML, CSS, JavaScript</td><td>Структура, оформление, поведение страницы в браузере</td></tr>
<tr><td>Backend (серверная)</td><td>Python, PHP, Node.js, базы данных</td><td>Обработка данных, логика, хранение</td></tr>
</table>
<p><b>Статический сайт</b> — одни и те же готовые HTML-файлы. <b>Динамический</b> — страницы формируются на сервере, часто из базы данных.</p>

<h2>Структура HTML-документа</h2>
[[html]]
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Моя школа</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Школа-лицей № 1</h1></header>
  <nav><a href="about.html">О школе</a> | <a href="#contacts">Контакты</a></nav>
  <main>
    <p>Добро пожаловать! <b>Набор</b> в 10 класс открыт.</p>
    <img src="images/school.jpg" alt="Здание школы" width="400">
  </main>
  <footer id="contacts">Телефон: 8 (7172) 00-00-00</footer>
</body>
</html>
[[/html]]
<p>Тег <code>head</code> содержит служебные сведения (заголовок вкладки, кодировку, подключения), тег <code>body</code> — видимое содержимое. Теги бывают <b>парными</b> (<code>&lt;p&gt;…&lt;/p&gt;</code>) и <b>одиночными</b> (<code>&lt;br&gt;</code>, <code>&lt;img&gt;</code>, <code>&lt;hr&gt;</code>, <code>&lt;input&gt;</code>, <code>&lt;meta&gt;</code>, <code>&lt;link&gt;</code>). <b>Атрибуты</b> уточняют тег: <code>href</code>, <code>src</code>, <code>alt</code>, <code>width</code>, <code>id</code>, <code>class</code>.</p>

<h2>Основные теги</h2>
<table>
<tr><th>Тег</th><th>Назначение</th></tr>
<tr><td><code>&lt;h1&gt;…&lt;h6&gt;</code></td><td>Заголовки шести уровней, h1 самый крупный</td></tr>
<tr><td><code>&lt;p&gt;</code>, <code>&lt;br&gt;</code>, <code>&lt;hr&gt;</code></td><td>Абзац, перенос строки, горизонтальная линия</td></tr>
<tr><td><code>&lt;b&gt;</code>/<code>&lt;strong&gt;</code>, <code>&lt;i&gt;</code>/<code>&lt;em&gt;</code>, <code>&lt;u&gt;</code></td><td>Полужирный (важный), курсив (выделение), подчёркнутый</td></tr>
<tr><td><code>&lt;a href="…"&gt;</code></td><td>Гиперссылка. <code>target="_blank"</code> открывает в новой вкладке, <code>href="#id"</code> ведёт к элементу на странице</td></tr>
<tr><td><code>&lt;img src="…" alt="…"&gt;</code></td><td>Изображение. alt — альтернативный текст для незрячих и при ошибке загрузки</td></tr>
<tr><td><code>&lt;ul&gt;</code>, <code>&lt;ol&gt;</code>, <code>&lt;li&gt;</code></td><td>Маркированный список, нумерованный список, пункт списка</td></tr>
<tr><td><code>&lt;table&gt;</code>, <code>&lt;tr&gt;</code>, <code>&lt;th&gt;</code>, <code>&lt;td&gt;</code></td><td>Таблица, строка, ячейка заголовка, ячейка данных. <code>colspan</code> объединяет ячейки по горизонтали, <code>rowspan</code> — по вертикали</td></tr>
<tr><td><code>&lt;div&gt;</code>, <code>&lt;span&gt;</code></td><td>Блочный контейнер (с новой строки, на всю ширину); строчный контейнер внутри текста</td></tr>
<tr><td><code>&lt;form&gt;</code>, <code>&lt;input&gt;</code>, <code>&lt;button&gt;</code>, <code>&lt;select&gt;</code>, <code>&lt;textarea&gt;</code>, <code>&lt;label&gt;</code></td><td>Форма и её элементы. Типы input: text, password, email, number, checkbox, radio, submit</td></tr>
<tr><td><code>&lt;header&gt;</code>, <code>&lt;nav&gt;</code>, <code>&lt;main&gt;</code>, <code>&lt;section&gt;</code>, <code>&lt;article&gt;</code>, <code>&lt;footer&gt;</code></td><td>Семантические теги HTML5: шапка, навигация, основное содержимое, раздел, статья, подвал</td></tr>
<tr><td><code>&lt;!-- … --&gt;</code></td><td>Комментарий, браузер его не показывает</td></tr>
</table>
<p>Ссылки бывают <b>абсолютными</b> (<code>https://site.kz/page.html</code>) и <b>относительными</b> (<code>about.html</code>, <code>../index.html</code>, <code>images/logo.png</code>).</p>

<h2>CSS</h2>
[[html]]
/* селектор { свойство: значение; } */
body   { font-family: Arial, sans-serif; background-color: #f5f5f5; }
h1     { color: #0b7564; text-align: center; }
.card  { width: 200px; padding: 10px; border: 2px solid #ccc; margin: 5px; }
#main  { font-size: 18px; }
nav a:hover { text-decoration: underline; }
@media (max-width: 600px) { .card { width: 100%; } }
[[/html]]
<h3>Способы подключения</h3>
<table>
<tr><th>Способ</th><th>Как</th><th>Когда</th></tr>
<tr><td>Встроенный (inline)</td><td><code>&lt;p style="color: red"&gt;</code></td><td>Для одного элемента. Наивысший приоритет</td></tr>
<tr><td>Внутренний</td><td><code>&lt;style&gt;…&lt;/style&gt;</code> в head</td><td>Для одной страницы</td></tr>
<tr><td>Внешний</td><td><code>&lt;link rel="stylesheet" href="style.css"&gt;</code></td><td>Один файл стилей для всего сайта. Лучший вариант</td></tr>
</table>
<h3>Селекторы и приоритет</h3>
<table>
<tr><th>Селектор</th><th>Выбирает</th></tr>
<tr><td><code>p</code></td><td>Все абзацы</td></tr>
<tr><td><code>.menu</code></td><td>Все элементы с <code>class="menu"</code></td></tr>
<tr><td><code>#logo</code></td><td>Элемент с <code>id="logo"</code> (id уникален на странице)</td></tr>
<tr><td><code>div p</code></td><td>Абзацы внутри div</td></tr>
<tr><td><code>h1, h2</code></td><td>Все h1 и все h2</td></tr>
<tr><td><code>a:hover</code></td><td>Ссылку под курсором мыши</td></tr>
</table>
<p>Приоритет (специфичность): <span class="f">inline-стиль &gt; #id &gt; .класс &gt; тег</span>. При равной специфичности побеждает правило, записанное позже.</p>

<h3>Блочная модель</h3>
<p>Каждый элемент — прямоугольник из содержимого (width × height), внутреннего отступа <b>padding</b>, рамки <b>border</b> и внешнего отступа <b>margin</b>.</p>
<p><span class="f">полная ширина = width + 2·padding + 2·border + 2·margin</span></p>
<div class="note ex"><b>Пример</b>width 200px, padding 10px, border 2px, margin 5px. Видимая ширина блока с рамкой: 200 + 20 + 4 = 224px. Место на странице с учётом margin: 224 + 10 = 234px. Если задать <code>box-sizing: border-box</code>, width будет включать padding и border.</div>
<p>Основные свойства: <code>color</code>, <code>background-color</code>, <code>font-family</code>, <code>font-size</code>, <code>font-weight</code>, <code>text-align</code>, <code>width</code>, <code>height</code>, <code>display</code> (block, inline, flex, grid, none), <code>position</code>. Цвет задаётся названием (<code>red</code>), шестнадцатеричным кодом (<code>#FF0000</code>) или функцией (<code>rgb(255, 0, 0)</code>).</p>

<h2>Адаптивная вёрстка</h2>
<p>Сайт должен корректно выглядеть на телефоне, планшете и компьютере:</p>
<ul>
<li>метатег <code>viewport</code>;</li>
<li>медиазапросы <code>@media (max-width: 600px) {…}</code>;</li>
<li>относительные единицы: %, em, rem, vw;</li>
<li>гибкие раскладки Flexbox и Grid;</li>
<li>изображения с <code>max-width: 100%</code>.</li>
</ul>

<h2>JavaScript</h2>
<p>JavaScript добавляет странице поведение: реакцию на клики, проверку форм, изменение содержимого без перезагрузки.</p>
[[html]]
<button onclick="greet()">Нажми</button>
<p id="out"></p>
<script>
  function greet() {
    document.getElementById("out").textContent = "Сәлем, ЕНТ!";
  }
<\/script>
[[/html]]

<p>Без программирования сайт можно собрать в конструкторах (Tilda, Wix) или системах управления содержимым (CMS), например WordPress.</p>

<h2>Машинные команды и язык ассемблера</h2>
<p>Каждая машинная команда состоит из <b>кода операции</b> (что делать) и <b>адресной части</b> (с какими данными). Набор всех команд процессора называется его <b>системой команд</b>.</p>
<table>
<tr><th></th><th>CISC</th><th>RISC</th></tr>
<tr><td>Команды</td><td>Много сложных команд разной длины</td><td>Мало простых команд одинаковой длины</td></tr>
<tr><td>Выполнение</td><td>Одна команда может занимать много тактов</td><td>Большинство команд за один такт, удобно для конвейера</td></tr>
<tr><td>Примеры</td><td>Intel и AMD x86 (настольные ПК)</td><td>ARM (смартфоны, Apple M), RISC-V</td></tr>
</table>
<p>Язык ассемблера записывает машинные команды мнемониками. Учебная машина с аккумулятором:</p>
<table>
<tr><th>Команда</th><th>Действие</th></tr>
<tr><td><code>LDA x</code></td><td>ACC ← содержимое ячейки x</td></tr>
<tr><td><code>ADD x</code></td><td>ACC ← ACC + содержимое ячейки x</td></tr>
<tr><td><code>SUB x</code></td><td>ACC ← ACC − содержимое ячейки x</td></tr>
<tr><td><code>STO x</code></td><td>ячейка x ← ACC</td></tr>
<tr><td><code>JMP x</code></td><td>PC ← x (безусловный переход)</td></tr>
<tr><td><code>HLT</code></td><td>остановка</td></tr>
</table>
<div class="task"><b>Разбор</b>Программа в ячейках 0–3: <code>LDA 10</code>, <code>ADD 11</code>, <code>STO 12</code>, <code>HLT</code>. В ячейке 10 число 7, в ячейке 11 число 5. Проследите регистры.
<details class="sol"><summary>Решение</summary>
<table>
<tr><th>Шаг</th><th class="c">PC</th><th class="c">MAR</th><th class="c">MDR</th><th class="c">CIR</th><th class="c">ACC</th></tr>
<tr><td>Выборка LDA 10</td><td class="c">0 → 1</td><td class="c">0</td><td class="c">LDA 10</td><td class="c">LDA 10</td><td class="c">—</td></tr>
<tr><td>Выполнение</td><td class="c">1</td><td class="c">10</td><td class="c">7</td><td class="c">LDA 10</td><td class="c">7</td></tr>
<tr><td>Выборка ADD 11</td><td class="c">1 → 2</td><td class="c">1</td><td class="c">ADD 11</td><td class="c">ADD 11</td><td class="c">7</td></tr>
<tr><td>Выполнение</td><td class="c">2</td><td class="c">11</td><td class="c">5</td><td class="c">ADD 11</td><td class="c">12</td></tr>
<tr><td>Выборка STO 12</td><td class="c">2 → 3</td><td class="c">2</td><td class="c">STO 12</td><td class="c">STO 12</td><td class="c">12</td></tr>
<tr><td>Выполнение</td><td class="c">3</td><td class="c">12</td><td class="c">12</td><td class="c">STO 12</td><td class="c">12</td></tr>
</table>
<p>В ячейку 12 записано 12, затем HLT останавливает программу. При записи данные сначала попадают в MDR, затем в память по адресу из MAR.</p>
</details></div>

<h2>Прерывания</h2>
<p><b>Прерывание</b> — сигнал, который заставляет процессор приостановить текущую программу и выполнить обработчик. Источники: аппаратные (нажатие клавиши, конец печати, таймер, сбой питания) и программные (деление на ноль, системный вызов).</p>
<ol class="steps">
<li>В конце каждого цикла «выборка — декодирование — выполнение» процессор проверяет, есть ли прерывание.</li>
<li>Если есть и его приоритет выше текущей задачи, содержимое регистров (PC, ACC и других) сохраняется в стеке.</li>
<li>В PC загружается адрес обработчика прерывания (ISR), и он выполняется.</li>
<li>Регистры восстанавливаются из стека, прерванная программа продолжается с того же места.</li>
</ol>
<p>Без прерываний процессору пришлось бы постоянно опрашивать устройства (polling) и тратить на это время.</p>

<h2>Производительность: расчёты</h2>
<p><span class="f">t = N / f</span>: время выполнения равно числу тактов, делённому на тактовую частоту. Программе из 6·10⁹ тактов на процессоре 3 ГГц нужно 6·10⁹ / 3·10⁹ = 2 с.</p>
<p><span class="f">пропускная способность шины = разрядность (байт) × частота × передач за такт</span>. Шина 64 бит при 100 МГц: 8 байт × 10⁸ = 8·10⁸ байт/с = 800 МБ/с (здесь приставки десятичные, как у частоты).</p>
<p><b>Кэш</b> работает благодаря <b>локальности</b>: программа часто обращается к одним и тем же данным (временная локальность) и к соседним адресам (пространственная). <b>Попадание</b> — данные нашлись в кэше, <b>промах</b> — пришлось обращаться к ОЗУ.</p>
<div class="task"><b>Задача</b>Доступ к кэшу занимает 2 нс, к ОЗУ 60 нс. 90% обращений попадают в кэш. Найдите среднее время доступа (считайте, что при промахе тратится только время ОЗУ).
<details class="sol"><summary>Решение</summary>0,9 · 2 + 0,1 · 60 = 1,8 + 6 = 7,8 нс. Без кэша было бы 60 нс, то есть ускорение почти в 8 раз.</details></div>
<h3>Способы ускорения</h3>
<ul>
<li><b>Конвейер</b>: пока одна команда выполняется, следующая декодируется, а третья выбирается.</li>
<li><b>Многоядерность</b>: по закону Амдала ускорение ограничено частью программы, которую нельзя распараллелить.</li>
<li><b>Больше кэша, выше частота, шире шины</b>. Повышение частоты увеличивает нагрев и энергопотребление.</li>
</ul>

<h2>Модель OSI подробно</h2>
<table>
<tr><th>Уровень</th><th>Блок данных</th><th>Протоколы, стандарты</th><th>Оборудование</th></tr>
<tr><td>7 Прикладной</td><td>Данные</td><td>HTTP, FTP, SMTP, DNS, DHCP</td><td>—</td></tr>
<tr><td>6 Представления</td><td>Данные</td><td>Кодировки, сжатие, шифрование (TLS)</td><td>—</td></tr>
<tr><td>5 Сеансовый</td><td>Данные</td><td>Установка и завершение сеанса</td><td>—</td></tr>
<tr><td>4 Транспортный</td><td>Сегмент (TCP), датаграмма (UDP)</td><td>TCP, UDP, порты</td><td>—</td></tr>
<tr><td>3 Сетевой</td><td>Пакет</td><td>IP, ICMP</td><td>Маршрутизатор</td></tr>
<tr><td>2 Канальный</td><td>Кадр</td><td>Ethernet, Wi-Fi, MAC-адреса</td><td>Коммутатор, мост, сетевая карта</td></tr>
<tr><td>1 Физический</td><td>Бит</td><td>Сигналы, разъёмы, кабели</td><td>Концентратор, повторитель, кабель</td></tr>
</table>
<p><b>Инкапсуляция</b>: при отправке каждый уровень добавляет к данным свой заголовок (HTTP-запрос → TCP-сегмент → IP-пакет → Ethernet-кадр → биты). Получатель снимает заголовки в обратном порядке.</p>

<h2>Транспортный уровень</h2>
<table>
<tr><th></th><th>TCP</th><th>UDP</th></tr>
<tr><td>Соединение</td><td>Устанавливается заранее</td><td>Нет</td></tr>
<tr><td>Надёжность</td><td>Подтверждения, повтор потерянных сегментов, правильный порядок</td><td>Без гарантий</td></tr>
<tr><td>Скорость</td><td>Ниже из-за служебного обмена</td><td>Выше</td></tr>
<tr><td>Где</td><td>Веб, почта, передача файлов</td><td>Видеозвонки, стриминг, игры, DNS-запросы</td></tr>
</table>
<p>Установка TCP-соединения — <b>трёхстороннее рукопожатие</b>: клиент отправляет SYN, сервер отвечает SYN-ACK, клиент подтверждает ACK. <b>Порт</b> — число от 0 до 65 535, которое указывает программу на компьютере. Пара «IP-адрес + порт» называется <b>сокетом</b>: <code>93.184.216.34:443</code>.</p>

<h2>Что происходит при открытии сайта</h2>
<ol class="steps">
<li>Браузер разбирает URL и спрашивает у DNS-сервера IP-адрес домена. DNS обходит иерархию: корневой сервер → сервер зоны .kz → сервер домена. Ответ кэшируется.</li>
<li>Устанавливается TCP-соединение с сервером (порт 443).</li>
<li>По TLS проверяется сертификат сервера и согласуется сеансовый ключ шифрования.</li>
<li>Браузер отправляет HTTP-запрос <code>GET /index.html</code>.</li>
<li>Сервер возвращает ответ с кодом (200 — успешно, 404 — не найдено, 301 — перемещено, 500 — ошибка сервера) и HTML-код.</li>
<li>Браузер загружает CSS, изображения, скрипты и отображает страницу.</li>
</ol>
<p><b>DHCP</b> выдаёт адрес за четыре сообщения: Discover, Offer, Request, Acknowledge. <b>NAT</b> позволяет многим устройствам с частными адресами выходить в интернет через один публичный адрес маршрутизатора.</p>

<h2>Разбор задач на IP-адресацию</h2>
<div class="task"><b>Задача 1</b>IP-адрес 10.8.248.131, маска 255.255.240.0. Найдите адрес сети, широковещательный адрес, число узлов.
<details class="sol"><summary>Решение</summary>
<ol class="steps">
<li>Первые два октета маски 255, они переходят в адрес сети без изменений: 10.8.</li>
<li>Третий октет: 248 = 11111000₂, 240 = 11110000₂, конъюнкция 11110000₂ = 240.</li>
<li>Четвёртый октет маски 0, значит в адресе сети 0. Адрес сети 10.8.240.0.</li>
<li>В маске 8 + 8 + 4 = 20 единиц, на узлы 12 бит: 2¹² = 4096 адресов, 4094 узла.</li>
<li>Широковещательный: все биты узла равны 1. Третий октет 240 + 15 = 255, четвёртый 255: 10.8.255.255. Узлы от 10.8.240.1 до 10.8.255.254.</li>
</ol></details></div>
<div class="task"><b>Задача 2</b>Узлы 192.168.5.70 и 192.168.5.100 находятся в одной сети. Какое наибольшее число единиц может быть в маске?
<details class="sol"><summary>Решение</summary>70 = 01000110₂, 100 = 01100100₂. Совпадают только два старших бита (01), третий различается. В маске могут быть 24 + 2 = 26 единиц: 255.255.255.192. Проверка: 70 AND 192 = 64, 100 AND 192 = 64, сеть одна. При 27 единицах получились бы разные сети (64 и 96).</details></div>
<div class="task"><b>Задача 3</b>Запишите сокращённо IPv6-адрес 2001:0db8:0000:0000:0000:ff00:0042:8329.
<details class="sol"><summary>Решение</summary>Ведущие нули в группе можно опустить, а одну непрерывную цепочку нулевых групп заменить на <code>::</code> (только один раз в адресе): <code>2001:db8::ff00:42:8329</code>.</details></div>
<p>Адресов IPv4 всего 2³² ≈ 4,3 млрд, и они закончились. У IPv6 2¹²⁸ адресов, их хватит любому числу устройств.</p>

<h2>Беспроводные сети</h2>
<p>Wi-Fi работает в диапазонах 2,4 ГГц (дальше, но медленнее и больше помех) и 5 ГГц (быстрее, ближе). Защита: шифрование WPA2 или WPA3 со сложным паролем. Скрытое имя сети (SSID) и фильтр MAC-адресов почти не защищают: их легко обойти. Публичные открытые сети небезопасны, в них стоит использовать VPN.</p>

<h2>Криптография глубже</h2>
<h3>Шифр Виженера</h3>
<p>Многоалфавитная замена: сдвиг каждой буквы задаёт соответствующая буква ключа (A = 0, B = 1, …). Ключ повторяется по длине текста.</p>
[[txt]]
Текст:   A  T  T  A  C  K
Ключ:    L  E  M  O  N  L
Сдвиг:  11  4 12 14 13 11
Шифр:    L  X  F  O  P  V
[[/txt]]
<p>Шифр Цезаря взламывается перебором 25 сдвигов или частотным анализом. Шифр Виженера устойчивее, потому что одна и та же буква шифруется по-разному.</p>
<h3>RSA на маленьких числах</h3>
<ol class="steps">
<li>Простые p = 3, q = 11. n = p · q = 33, φ = (p − 1)(q − 1) = 20.</li>
<li>Открытая экспонента e = 3 (взаимно проста с 20). Закрытая d = 7, так как 3 · 7 = 21 ≡ 1 (mod 20).</li>
<li>Открытый ключ (3, 33), закрытый (7, 33).</li>
<li>Шифрование m = 4: c = 4³ mod 33 = 64 mod 33 = 31.</li>
<li>Расшифровка: 31⁷ mod 33 = 4. Стойкость RSA основана на том, что разложить огромное n на множители практически невозможно.</li>
</ol>
<h3>Хеш-функции</h3>
<p>Хеш-функция (например, SHA-256) превращает данные любой длины в строку фиксированной длины. Свойства: по хешу нельзя восстановить данные, малое изменение входа полностью меняет хеш, трудно найти два входа с одинаковым хешем. Сайты хранят не пароли, а их хеши с <b>солью</b> (случайной добавкой), поэтому утечка базы не раскрывает пароли сразу.</p>
<p><b>Цифровой сертификат</b> связывает открытый ключ с владельцем и подписан удостоверяющим центром. В Казахстане ключи ЭЦП выдаёт Национальный удостоверяющий центр (НУЦ РК). В HTTPS асимметричное шифрование используется, чтобы безопасно согласовать симметричный сеансовый ключ, которым затем шифруется весь трафик.</p>

<h2>Стойкость паролей и резервное копирование</h2>
<p>Число вариантов пароля: <span class="f">N = Aᴸ</span>, где A — число возможных символов, L — длина. Пароль из 8 символов латиницы обоих регистров и цифр (A = 62): 62⁸ ≈ 2,2·10¹⁴ вариантов. При переборе 10¹⁰ паролей в секунду это около 6 часов. У пароля из 12 таких символов уже 62¹² ≈ 3,2·10²¹ вариантов, и перебор с той же скоростью займёт около 10 000 лет. Каждый добавленный символ умножает число вариантов на A, поэтому длина пароля важнее всего.</p>
<p><b>Факторы аутентификации</b>: знание (пароль, PIN), владение (телефон, ключ, смарт-карта), биометрия (отпечаток, лицо). Двухфакторная аутентификация сочетает два разных фактора.</p>
<table>
<tr><th>Резервная копия</th><th>Что копируется</th><th>Восстановление</th></tr>
<tr><td>Полная</td><td>Все данные</td><td>Из одной копии, но копия большая</td></tr>
<tr><td>Инкрементная</td><td>Изменения с момента последней копии любого типа</td><td>Нужна полная и все последующие инкрементные</td></tr>
<tr><td>Дифференциальная</td><td>Изменения с момента последней полной копии</td><td>Нужна полная и последняя дифференциальная</td></tr>
</table>
<p><b>Правило 3-2-1</b>: три копии данных, на двух разных типах носителей, одна из них в другом месте (например, в облаке).</p>

<h2>Вероятностный подход и формула Шеннона</h2>
<p>Если события неравновероятны, сообщение о событии с вероятностью p несёт <span class="f">i = log₂(1/p)</span> бит. Чем менее вероятно событие, тем больше информации в сообщении о нём.</p>
<div class="task"><b>Задача</b>В корзине 8 белых и 24 чёрных шара. Сколько информации несёт сообщение «достали белый шар»?
<details class="sol"><summary>Решение</summary>p = 8 / 32 = 1/4, i = log₂ 4 = 2 бита. Сообщение о чёрном шаре: p = 3/4, i = log₂(4/3) ≈ 0,415 бита.</details></div>
<div class="task"><b>Обратная задача</b>Сообщение «достали белый шар» несёт 4 бита. Всего в корзине 64 шара. Сколько белых?
<details class="sol"><summary>Решение</summary>log₂(1/p) = 4, значит p = 1/16. Белых 64 / 16 = 4.</details></div>
<p>Средняя информация на один символ (энтропия) считается по формуле Шеннона:</p>
<p><span class="f">H = −(p₁·log₂p₁ + p₂·log₂p₂ + … + pₙ·log₂pₙ)</span></p>
<p>Для вероятностей 1/2, 1/4, 1/8, 1/8: H = 1/2 · 1 + 1/4 · 2 + 1/8 · 3 + 1/8 · 3 = 1,75 бита. Если все N событий равновероятны, формула Шеннона превращается в формулу Хартли log₂N, и это наибольшее возможное значение.</p>

<h2>Задачи с округлением до целых байтов</h2>
<div class="task"><b>Задача</b>Пароль из 10 символов составляется из 26 заглавных латинских букв и 10 цифр. Каждый символ кодируется минимально возможным одинаковым числом бит, каждый пароль — минимально возможным целым числом байт. Сколько байт займут 50 паролей?
<details class="sol"><summary>Решение</summary>
<ol class="steps">
<li>Алфавит 26 + 10 = 36 символов, i = 6 бит (2⁵ = 32 мало, 2⁶ = 64 хватает).</li>
<li>Один пароль: 10 · 6 = 60 бит = 7,5 байта. Округляем вверх до 8 байт.</li>
<li>50 паролей: 50 · 8 = 400 байт.</li>
</ol>
<p>Если бы пароли хранились подряд без округления, получилось бы 50 · 60 = 3000 бит = 375 байт. Внимательно читайте условие.</p></details></div>

<h2>Как устроена кодировка UTF-8</h2>
<table>
<tr><th>Байт</th><th>Шаблон</th><th>Символы</th></tr>
<tr><td>1</td><td><code>0xxxxxxx</code></td><td>ASCII: латиница, цифры, знаки (U+0000–U+007F)</td></tr>
<tr><td>2</td><td><code>110xxxxx 10xxxxxx</code></td><td>Кириллица, в том числе казахские ә, ғ, қ, ң, ө, ұ, ү, һ, і; греческий, арабский</td></tr>
<tr><td>3</td><td><code>1110xxxx 10xxxxxx 10xxxxxx</code></td><td>Большинство остальных, например китайские иероглифы</td></tr>
<tr><td>4</td><td><code>11110xxx</code> + 3 байта <code>10xxxxxx</code></td><td>Эмодзи, редкие символы</td></tr>
</table>
<p>По первым битам байта программа понимает, сколько байт занимает символ. Первые 128 символов совпадают с ASCII, поэтому английский текст в ASCII уже является корректным UTF-8.</p>
<div class="task"><b>Задача</b>Сколько байт занимает строка «Сәлем, ЕНТ!» в UTF-8?
<details class="sol"><summary>Решение</summary>Кириллических букв 8 (С, ә, л, е, м, Е, Н, Т), по 2 байта: 16. Запятая, пробел и «!» по 1 байту: 3. Итого 19 байт. Проверка в Python: <code>len("Сәлем, ЕНТ!".encode("utf-8"))</code> даёт 19.</details></div>

<h2>Построение кода Хаффмана</h2>
<p>Строка <code>AAAAABBBCCD</code>: частоты A = 5, B = 3, C = 2, D = 1.</p>
<ol class="steps">
<li>Объединяем два самых редких: D(1) + C(2) = 3.</li>
<li>Снова два наименьших: (CD)(3) + B(3) = 6.</li>
<li>Последнее объединение: A(5) + 6 = 11 — корень дерева.</li>
<li>Левая ветвь — 0, правая — 1. Коды: A = 0, B = 10, C = 110, D = 111.</li>
</ol>
<p>Длина сообщения: 5 · 1 + 3 · 2 + 2 · 3 + 1 · 3 = 20 бит. Равномерным 2-битным кодом было бы 22 бита, в ASCII 88 бит. Код Хаффмана всегда удовлетворяет условию Фано.</p>
<p><span class="f">коэффициент сжатия = исходный объём / сжатый объём</span>. Сжатие файла с 10 МБ до 2 МБ — коэффициент 5.</p>

<h2>Объём изображения: прямые и обратные задачи</h2>
<div class="task"><b>Сканирование</b>Фото 4 × 6 дюймов сканируется с разрешением 300 dpi и глубиной цвета 24 бита. Объём?
<details class="sol"><summary>Решение</summary>(4 · 300) × (6 · 300) = 1200 × 1800 = 2 160 000 пикселей. По 3 байта: 6 480 000 байт ≈ 6,18 Мбайт.</details></div>
<div class="task"><b>Обратная задача</b>Изображение 640 × 480 пикселей занимает 150 Кбайт. Какое наибольшее число цветов в палитре?
<details class="sol"><summary>Решение</summary>150 · 1024 · 8 = 1 228 800 бит. Пикселей 640 · 480 = 307 200. i = 1 228 800 / 307 200 = 4 бита, N = 2⁴ = 16 цветов.</details></div>

<h2>Звук и видео: дополнительные приёмы</h2>
<p><b>Теорема Котельникова (Найквиста)</b>: чтобы сигнал можно было точно восстановить, частота дискретизации должна быть хотя бы вдвое выше наибольшей частоты в сигнале. Человек слышит примерно до 20 кГц, поэтому для CD выбрана частота 44,1 кГц.</p>
<div class="task"><b>Задача на изменение параметров</b>Частоту дискретизации увеличили в 2 раза, глубину кодирования уменьшили с 24 до 16 бит, стереозапись заменили на моно. Как изменился объём?
<details class="sol"><summary>Решение</summary>Множители: 2 · (16 / 24) · (1 / 2) = 2/3. Объём уменьшился в 1,5 раза. Время записи не менялось, поэтому оно в расчёт не входит.</details></div>
<table>
<tr><th>Стандарт</th><th>Разрешение</th></tr>
<tr><td>HD</td><td>1280 × 720</td></tr>
<tr><td>Full HD</td><td>1920 × 1080</td></tr>
<tr><td>QHD (2K)</td><td>2560 × 1440</td></tr>
<tr><td>4K UHD</td><td>3840 × 2160</td></tr>
</table>
<p>Несжатое видео Full HD, 24 бита, 30 кадров/с, 10 секунд: 1920 · 1080 · 3 = 6 220 800 байт на кадр, умножить на 300 кадров ≈ 1,74 Гбайт. Поэтому видео всегда сжимают кодеками. Для сжатого видео объём считают по <b>битрейту</b>: <span class="f">I = битрейт · t</span>. 5 Мбит/с × 60 с = 300 Мбит = 37,5 Мбайт.</p>
<p><b>Кодек</b> (H.264, H.265, AAC) сжимает данные, <b>контейнер</b> (MP4, MKV, AVI) хранит видео, звук и субтитры в одном файле.</p>

<h2>Сравнение способов передачи</h2>
<div class="task"><b>Задача</b>Документ 20 Мбайт. Способ А: сжать архиватором за 18 с (объём уменьшится на 75%), передать, распаковать за 2 с. Способ Б: передать без сжатия. Скорость канала 2²³ бит/с. Какой способ быстрее и на сколько?
<details class="sol"><summary>Решение</summary>2²³ бит/с = 1 Мбайт/с. Б: 20 с. А: после сжатия 5 Мбайт, передача 5 с, всего 18 + 5 + 2 = 25 с. Способ Б быстрее на 5 с.</details></div>

<h2>Исправление ошибок</h2>
<p>Бит чётности только обнаруживает одиночную ошибку. <b>Код Хэмминга (7, 4)</b> добавляет к 4 битам данных 3 контрольных бита, и это позволяет найти позицию одиночной ошибки и исправить её. Так работает память ECC в серверах. Двумерный контроль чётности (по строкам и столбцам блока) тоже указывает на ошибочный бит: он стоит на пересечении «неправильных» строки и столбца.</p>

<h2>Арифметика в восьмеричной и шестнадцатеричной системах</h2>
<p>Складывают столбиком. Если сумма в разряде ≥ q, записывают сумму − q и переносят 1 в старший разряд.</p>
[[txt]]
  57₈            3A₁₆
+ 25₈          + 2F₁₆
-----          ------
 104₈            69₁₆
7+5 = 12 = 8+4 → 4, перенос 1      A+F = 25 = 16+9 → 9, перенос 1
5+2+1 = 8 = 8+0 → 0, перенос 1     3+2+1 = 6
[[/txt]]
<p>Проверка: 47 + 21 = 68 = 104₈; 58 + 47 = 105 = 69₁₆.</p>
<p>Двоичное вычитание: 10110₂ − 1011₂ = 1011₂ (22 − 11 = 11). Двоичное умножение: 101₂ × 11₂ = 101 + 1010 = 1111₂ (5 · 3 = 15).</p>

<h2>Переход между 8 и 16 через двоичную систему</h2>
<p>375₈ → триады 011 111 101 → 11111101₂ → тетрады 1111 1101 → FD₁₆. Проверка: 3 · 64 + 7 · 8 + 5 = 253 = FD₁₆.</p>

<h2>Дробные двоичные числа</h2>
<p>Разряды после запятой: 2⁻¹ = 0,5; 2⁻² = 0,25; 2⁻³ = 0,125. 101,101₂ = 4 + 1 + 0,5 + 0,125 = 5,625.</p>
<p>Многие десятичные дроби в двоичной системе бесконечны: 0,1₁₀ = 0,0001100110011…₂ (период 0011). Компьютер хранит приближение, поэтому <code>0.1 + 0.2 == 0.3</code> в Python даёт False. Сравнивать вещественные числа нужно с допуском: <code>abs(a - b) &lt; 1e-9</code>.</p>

<h2>Задачи на поиск основания</h2>
<div class="task"><b>Задача 1</b>Десятичное число 100 в системе с основанием q записывается как 202. Найдите q.
<details class="sol"><summary>Решение</summary>2q² + 0 · q + 2 = 100, q² = 49, q = 7.</details></div>
<div class="task"><b>Задача 2</b>В какой системе счисления верно равенство 23 + 14 = 41?
<details class="sol"><summary>Решение</summary>Младший разряд: 3 + 4 = 7, а записано 1, значит был перенос: 7 = q + 1, q = 6. Старший разряд: 2 + 1 + 1 = 4, совпадает. Ответ: 6.</details></div>
<div class="task"><b>Задача 3</b>Укажите все основания, в которых запись числа 31₁₀ оканчивается на 3.
<details class="sol"><summary>Решение</summary>Последняя цифра — остаток от деления на q: 31 mod q = 3, значит q делит 28 и q > 3. Делители 28, большие 3: 4, 7, 14, 28.</details></div>

<h2>Дополнительный код: сложение и переполнение</h2>
<p>Вычитание заменяется сложением с дополнительным кодом. 5 + (−3) в 8 битах:</p>
[[txt]]
  00000101   (5)
+ 11111101   (−3)
----------
1 00000010   → перенос за 8-й бит отбрасывается → 2
[[/txt]]
<p>Чтобы прочитать отрицательное число в дополнительном коде, снова инвертируйте биты и прибавьте 1: 11110110 → 00001001 + 1 = 00001010 = 10, то есть исходное число −10.</p>
<p><b>Переполнение</b>: результат не помещается в разрядную сетку. В 8-битном знаковом формате 100 + 50 = 150 > 127, процессор получит 10010110₂, то есть −106.</p>

<h2>Вещественные числа (IEEE 754)</h2>
<p>Число записывается в нормализованном виде ±1,M × 2ᴱ. 5,625 = 101,101₂ = 1,01101 × 2².</p>
<table>
<tr><th>Формат</th><th>Знак</th><th>Порядок</th><th>Мантисса</th></tr>
<tr><td>Одинарная точность (32 бита, float)</td><td>1</td><td>8 (смещение 127)</td><td>23</td></tr>
<tr><td>Двойная точность (64 бита, float в Python)</td><td>1</td><td>11 (смещение 1023)</td><td>52</td></tr>
</table>
<p>Больше бит мантиссы — выше точность, больше бит порядка — шире диапазон.</p>

<h2>Побитовые операции в Python</h2>
<table>

def to_base(n, b):
    digits = "0123456789ABCDEF"
    if n == 0:
        return "0"
    s = ""
    while n > 0:
        s = digits[n % b] + s     # остаток дописываем слева
        n //= b
    return s

print(to_base(253, 16))   # FD

<h2>Построение формулы по таблице истинности</h2>
<p><b>СДНФ</b> (совершенная дизъюнктивная нормальная форма): для каждой строки, где F = 1, записываем конъюнкцию всех переменных (с отрицанием, если переменная равна 0), и соединяем их знаком ∨.</p>
<p><b>СКНФ</b>: для каждой строки, где F = 0, записываем дизъюнкцию всех переменных (с отрицанием, если переменная равна 1), и соединяем знаком ∧.</p>
<table>
<tr><th class="c">A</th><th class="c">B</th><th class="c">F</th><th>Слагаемое СДНФ</th><th>Множитель СКНФ</th></tr>
<tr><td class="c">0</td><td class="c">0</td><td class="c">0</td><td></td><td>A ∨ B</td></tr>
<tr><td class="c">0</td><td class="c">1</td><td class="c">1</td><td>¬A ∧ B</td><td></td></tr>
<tr><td class="c">1</td><td class="c">0</td><td class="c">1</td><td>A ∧ ¬B</td><td></td></tr>
<tr><td class="c">1</td><td class="c">1</td><td class="c">0</td><td></td><td>¬A ∨ ¬B</td></tr>
</table>
<p>СДНФ: (¬A ∧ B) ∨ (A ∧ ¬B). СКНФ: (A ∨ B) ∧ (¬A ∨ ¬B). Обе формулы задают A ⊕ B.</p>

<h2>Определение функции по фрагменту таблицы</h2>
<div class="task"><b>Задача</b>Дан фрагмент таблицы истинности: (A, B, C) = (1, 0, 0) → F = 1; (0, 1, 1) → F = 0; (1, 1, 0) → F = 1. Какое выражение подходит: A ∨ B, ¬B ∧ A, A → C или A ∧ ¬C?
<details class="sol"><summary>Решение</summary>Подставляем строки в каждый вариант и отбрасываем те, что расходятся хотя бы в одной строке. A ∨ B во второй строке даёт 1, а нужно 0. ¬B ∧ A в третьей строке даёт 0. A → C в первой строке даёт 1 → 0 = 0. A ∧ ¬C даёт 1, 0, 1 — совпадает. Ответ: A ∧ ¬C.</details></div>

<h2>Упрощение выражений: разборы</h2>
<div class="task"><b>Пример 1</b>Упростите ¬(A → B) ∨ (A ∧ B).
<details class="sol"><summary>Решение</summary>¬(A → B) = ¬(¬A ∨ B) = A ∧ ¬B. Тогда (A ∧ ¬B) ∨ (A ∧ B) = A ∧ (¬B ∨ B) = A ∧ 1 = A.</details></div>
<div class="task"><b>Пример 2</b>Упростите (A → B) ∧ (B → A).
<details class="sol"><summary>Решение</summary>Это определение эквиваленции: A ↔ B. Истинно, когда A и B совпадают.</details></div>
<div class="task"><b>Пример 3</b>Упростите ¬(¬A ∨ ¬B).
<details class="sol"><summary>Решение</summary>По де Моргану ¬¬A ∧ ¬¬B = A ∧ B.</details></div>

<h2>Логические уравнения и подсчёт решений</h2>
<div class="task"><b>Задача</b>Сколько наборов (A, B, C) удовлетворяют уравнению (A ∨ B) ∧ (B → C) = 1?
<details class="sol"><summary>Решение</summary>Разбор по B. При B = 0: B → C истинно всегда, нужно A = 1, C любое — 2 набора. При B = 1: A ∨ B истинно всегда, нужно C = 1, A любое — 2 набора. Итого 4.</details></div>
[[py]]
count = 0
for a in (0, 1):
    for b in (0, 1):
        for c in (0, 1):
            if (a or b) and (b <= c):    # b <= c — это импликация b → c
                count += 1
print(count)    # 4
[[/py]]
<div class="task"><b>Задача с числами</b>Для скольких целых X ложно высказывание (X > 2) → (X > 6)?
<details class="sol"><summary>Решение</summary>Импликация ложна, когда посылка истинна, а следствие ложно: X > 2 и X ≤ 6. Это X = 3, 4, 5, 6 — четыре числа.</details></div>

<h2>Разбор логической схемы</h2>
<div class="task"><b>Задача</b>Входы A и B подаются на элемент И-НЕ. Его выход и вход C подаются на элемент ИЛИ, выход которого — F. Запишите формулу и найдите, при каких входах F = 0.

<h2>Логические значения и сокращённое вычисление</h2>
<p>В условии ложными считаются <code>0</code>, <code>0.0</code>, <code>""</code>, <code>[]</code>, <code>{}</code>, <code>None</code>, <code>False</code>. Всё остальное истинно, в том числе <code>"0"</code> и <code>[0]</code>.</p>
<p><code>and</code> и <code>or</code> вычисляются слева направо и останавливаются, как только результат ясен. Они возвращают один из операндов, а не обязательно True или False: <code>0 or 5</code> даёт 5, <code>3 and 0</code> даёт 0, <code>"" or "нет"</code> даёт "нет". Поэтому проверка <code>if b != 0 and a / b > 1</code> безопасна: при b = 0 деление не выполнится.</p>

<h2>break, continue и else в циклах</h2>
[[py]]
for n in range(2, 10):
    if n % 3 == 0:
        continue          # пропустить 3 и 6
    if n == 8:
        break             # выйти из цикла на 8
    print(n, end=" ")     # 2 4 5 7

for d in range(2, 9):
    if 91 % d == 0:
        print("делитель", d)     # делитель 7
        break
else:                     # выполняется, только если не было break
    print("простое")
[[/py]]

def power(a, n):                 # O(log n) умножений
    if n == 0:
        return 1
    if n % 2 == 0:
        half = power(a, n // 2)
        return half * half
    return a * power(a, n - 1)

def fib(n):

def balanced(s):
    stack, pairs = [], {")": "(", "]": "["}
    for ch in s:
        if ch in "([":
            stack.append(ch)
        elif ch in pairs:
            if not stack or stack.pop() != pairs[ch]:
                return False
    return not stack

<h2>Файлы и обработка ошибок</h2>
<p>Пусть файл <code>scores.csv</code> содержит строки <code>Айгерим,118</code>, <code>Данияр,96</code> и т. д. Найдём средний балл и лучшего ученика:</p>
[[py]]
try:
    with open("scores.csv", encoding="utf-8") as f:
        rows = []
        for line in f:
            name, score = line.strip().split(",")
            rows.append((name, int(score)))
except FileNotFoundError:
    print("Файл не найден")
except ValueError:
    print("В файле есть нечисловой балл")
else:
    avg = sum(s for _, s in rows) / len(rows)
    best = max(rows, key=lambda r: r[1])
    with open("report.txt", "w", encoding="utf-8") as out:
        out.write(f"Средний балл: {avg:.1f}\n")
        out.write(f"Лучший: {best[0]} ({best[1]})\n")
[[/py]]
<p>Блок <code>try</code> содержит код, который может вызвать ошибку; <code>except</code> обрабатывает конкретный тип ошибки; <code>else</code> выполняется, если ошибки не было; <code>finally</code> выполняется всегда. Числа в одной строке файла читают так: <code>nums = list(map(int, f.read().split()))</code>.</p>
<p><b>Текстовые</b> файлы хранят символы в кодировке (UTF-8), <b>двоичные</b> (изображения, звук, .exe) открываются в режиме <code>"rb"</code> и читаются как байты.</p>

<h2>Сортировки: код и трассировка</h2>
[[py]]
def selection(a):                # выбором
    n = len(a)
    for i in range(n - 1):
        m = i
        for j in range(i + 1, n):
            if a[j] < a[m]:
                m = j
        a[i], a[m] = a[m], a[i]

def insertion(a):                # вставками
    for i in range(1, len(a)):
        key, j = a[i], i - 1
        while j >= 0 and a[j] > key:
            a[j + 1] = a[j]
            j -= 1
        a[j + 1] = key

def quick(a):                    # быстрая
    if len(a) <= 1:
        return a
    p = a[len(a) // 2]
    return quick([x for x in a if x < p]) + [x for x in a if x == p] + quick([x for x in a if x > p])

def merge_sort(a):               # слиянием
    if len(a) <= 1:
        return a
    mid = len(a) // 2
    L, R = merge_sort(a[:mid]), merge_sort(a[mid:])
    res, i, j = [], 0, 0
    while i < len(L) and j < len(R):
        if L[i] <= R[j]:
            res.append(L[i]); i += 1
        else:
            res.append(R[j]); j += 1
    return res + L[i:] + R[j:]
[[/py]]

<h3>Минимальное остовное дерево (алгоритм Краскала)</h3>
<p>Остовное дерево соединяет все вершины без циклов. Рёбра сортируются по весу и добавляются, если не образуют цикл: B–C (1), C–D (1), A–B (2), D–E (3). Ребро B–D (4) образовало бы цикл B–C–D, A–C и C–E тоже. Вес дерева 1 + 1 + 2 + 3 = 7, рёбер 4 = 5 − 1.</p>
<h3>Пути через обязательную вершину</h3>

<h2>Классы компьютеров</h2>
<table>
<tr><th>Класс</th><th>Назначение</th></tr>
<tr><td>Суперкомпьютер</td><td>Сложнейшие расчёты: климат, физика, обучение ИИ. Производительность измеряется во FLOPS (операций с плавающей точкой в секунду)</td></tr>

<tr><td>Сервер</td><td>Предоставляет услуги другим компьютерам сети: сайты, почта, базы данных</td></tr>

</table>

<h2>Операционная система изнутри</h2>
<p>ОС состоит из <b>ядра</b> (управляет процессором, памятью, устройствами), <b>драйверов</b> (переводят общие команды ОС в команды конкретного устройства) и <b>оболочки</b> (интерфейс пользователя: графический или командная строка).</p>
<h3>Процессы</h3>
<p><b>Процесс</b> — выполняющаяся программа со своей памятью. <b>Поток</b> — часть процесса, которая может выполняться параллельно с другими потоками того же процесса.</p>
<table>
<tr><th>Состояние</th><th>Смысл</th></tr>
<tr><td>Новый</td><td>Процесс создаётся</td></tr>
<tr><td>Готов</td><td>Ждёт, когда ему выделят процессор</td></tr>
<tr><td>Выполняется</td><td>Использует процессор</td></tr>
<tr><td>Ожидание (блокирован)</td><td>Ждёт события: ввода с клавиатуры, чтения с диска</td></tr>
<tr><td>Завершён</td><td>Работа окончена, ресурсы освобождаются</td></tr>
</table>
<h3>Планирование процессов</h3>
<table>
<tr><th>Алгоритм</th><th>Принцип</th></tr>
<tr><td>FCFS (первым пришёл — первым обслужен)</td><td>Процессы выполняются по очереди до конца</td></tr>
<tr><td>SJF (кратчайший первым)</td><td>Сначала самые короткие задачи</td></tr>
<tr><td>Round Robin (карусель)</td><td>Каждый процесс получает квант времени, затем уходит в конец очереди</td></tr>
<tr><td>По приоритету</td><td>Сначала задачи с высоким приоритетом</td></tr>
</table>
<div class="task"><b>Задача</b>Процессы P1 (5 мс), P2 (3 мс), P3 (1 мс) пришли одновременно в этом порядке. Планирование Round Robin, квант 2 мс. В каком порядке и когда они завершатся?

<tr><td>2–4</td><td>P2</td><td>P2: 1</td></tr>

<tr><td>5–7</td><td>P1</td><td>P1: 1</td></tr>
<tr><td>7–8</td><td>P2</td><td>P2 завершён в 8 мс</td></tr>
<tr><td>8–9</td><td>P1</td><td>P1 завершён в 9 мс</td></tr>
</table></details></div>
<h3>Типы операционных систем</h3>
<ul>
<li><b>Однозадачные</b> (MS-DOS) и <b>многозадачные</b> (Windows, Linux, macOS).</li>
<li><b>Однопользовательские</b> и <b>многопользовательские</b> (серверные Linux и Windows Server).</li>
<li><b>Реального времени</b> (RTOS): гарантированно отвечают за заданное время. Управление станками, авионика, медицинская техника.</li>
<li><b>Мобильные</b> (Android, iOS) и <b>встроенные</b>.</li>
</ul>
<p><b>BIOS и UEFI</b>: UEFI — современная замена BIOS с графическим интерфейсом, безопасной загрузкой (Secure Boot) и поддержкой дисков больше 2 ТБ (разметка GPT).</p>

<h2>Хранение файлов на диске</h2>
<p>Диск делится на <b>кластеры</b> (блоки), и файл всегда занимает целое число кластеров. Файл 5 КБ при кластере 4 КБ займёт 2 кластера = 8 КБ. Десять файлов по 1 КБ займут 10 кластеров = 40 КБ. Чем больше кластер, тем больше потерь на мелких файлах.</p>
<table>
<tr><th>RAID</th><th>Принцип</th><th>Полезный объём из n дисков</th></tr>
<tr><td>RAID 0</td><td>Чередование: данные делятся между дисками, высокая скорость, защиты нет</td><td>n дисков</td></tr>
<tr><td>RAID 1</td><td>Зеркало: одинаковые копии на двух дисках</td><td>половина</td></tr>
<tr><td>RAID 5</td><td>Чередование с контрольной суммой, выдерживает отказ одного диска</td><td>n − 1 диск</td></tr>
</table>

<h2>Как работает компилятор</h2>
<ol class="steps">
<li><b>Лексический анализ</b>: текст делится на лексемы (ключевые слова, имена, числа, знаки).</li>
<li><b>Синтаксический анализ</b>: проверяется соответствие правилам языка, строится дерево разбора. Здесь выявляются синтаксические ошибки.</li>
<li><b>Семантический анализ</b>: проверяются типы, объявления переменных.</li>
<li><b>Оптимизация</b> и <b>генерация кода</b>: создаётся объектный (машинный) код.</li>
<li><b>Компоновщик (линкер)</b> объединяет объектные модули и библиотеки в исполняемый файл.</li>
</ol>
<p>Существуют и смешанные схемы. Java компилируется в байт-код, который выполняет виртуальная машина JVM. Python тоже сначала переводит программу в байт-код (файлы .pyc), а затем его исполняет интерпретатор. JIT-компиляция переводит байт-код в машинный код прямо во время выполнения.</p>

<h2>Ошибки, отладка и тестирование</h2>
<table>
<tr><th>Тип ошибки</th><th>Пример</th><th>Как обнаруживается</th></tr>
<tr><td>Синтаксическая</td><td>Нет двоеточия после if</td><td>Транслятором до выполнения</td></tr>
<tr><td>Времени выполнения</td><td>Деление на ноль, чтение несуществующего файла</td><td>Программа аварийно останавливается</td></tr>
<tr><td>Логическая</td><td>Вместо <code>&gt;=</code> написано <code>&gt;</code></td><td>Программа работает, но результат неверный. Находится тестированием</td></tr>
</table>
<p><b>Отладчик</b> позволяет ставить точки останова, выполнять программу по шагам и смотреть значения переменных.</p>
<p>Тестовые данные бывают трёх видов. Пусть программа принимает возраст от 1 до 100:</p>
<ul>
<li><b>нормальные</b> — типичные допустимые значения: 25, 60;</li>
<li><b>граничные</b> — на краях диапазона: 1 и 100 (и сразу за ними 0 и 101);</li>
<li><b>ошибочные</b> — недопустимые: −5, «abc».</li>
</ul>

<h2>Уровни и парадигмы языков программирования</h2>
<p>Машинный код → язык ассемблера (низкий уровень, привязан к процессору) → языки высокого уровня (не зависят от процессора, понятны человеку).</p>
<table>
<tr><th>Парадигма</th><th>Суть</th><th>Языки</th></tr>
<tr><td>Процедурная</td><td>Программа — последовательность процедур и функций</td><td>C, Pascal</td></tr>
<tr><td>Объектно-ориентированная</td><td>Программа — взаимодействующие объекты классов</td><td>Java, C#, C++, Python</td></tr>
<tr><td>Функциональная</td><td>Вычисление как применение функций без изменения состояния</td><td>Haskell, частично Python</td></tr>
<tr><td>Логическая</td><td>Описываются факты и правила, ответ выводится</td><td>Prolog</td></tr>
<tr><td>Декларативная</td><td>Описывается, что нужно получить, а не как</td><td>SQL</td></tr>
</table>
<p>HTML и CSS — языки разметки и оформления, а не языки программирования.</p>
<h3>ООП на Python</h3>
[[py]]
class Student:                      # класс — шаблон объектов
    def __init__(self, name, score):
        self.name = name            # атрибуты объекта
        self.score = score
    def passed(self):               # метод
        return self.score >= 50

class Graduate(Student):            # наследование
    def passed(self):               # полиморфизм: метод переопределён
        return self.score >= 70

s = Student("Дана", 60)
g = Graduate("Ерлан", 60)
print(s.passed(), g.passed())       # True False
[[/py]]
<p><b>Инкапсуляция</b> объединяет данные и методы в классе и скрывает детали реализации. <b>Наследование</b> позволяет новому классу получить свойства существующего. <b>Полиморфизм</b> — одинаково названный метод работает по-разному в разных классах.</p>

<h2>Нормализация на полном примере</h2>
<p>Исходная ненормализованная таблица заказов интернет-магазина: в одной строке заказа перечислено несколько товаров.</p>
<table>
<tr><th>НомерЗаказа</th><th>Дата</th><th>КодКлиента</th><th>Имя</th><th>Город</th><th>Товары</th></tr>
<tr><td>101</td><td>05.03</td><td>К1</td><td>Асель</td><td>Алматы</td><td>Т1 Мышь 5000 ×2; Т2 Клавиатура 12000 ×1</td></tr>
<tr><td>102</td><td>06.03</td><td>К2</td><td>Болат</td><td>Астана</td><td>Т1 Мышь 5000 ×1</td></tr>
</table>
<h3>Шаг 1. Первая нормальная форма</h3>
<p>Убираем повторяющуюся группу «Товары»: каждый товар заказа — отдельная строка. Ключ становится составным (НомерЗаказа, КодТовара).</p>
<table>
<tr><th>НомерЗаказа</th><th>КодТовара</th><th>Дата</th><th>КодКлиента</th><th>Имя</th><th>Город</th><th>Название</th><th>Цена</th><th>Кол-во</th></tr>
<tr><td>101</td><td>Т1</td><td>05.03</td><td>К1</td><td>Асель</td><td>Алматы</td><td>Мышь</td><td>5000</td><td>2</td></tr>
<tr><td>101</td><td>Т2</td><td>05.03</td><td>К1</td><td>Асель</td><td>Алматы</td><td>Клавиатура</td><td>12000</td><td>1</td></tr>
<tr><td>102</td><td>Т1</td><td>06.03</td><td>К2</td><td>Болат</td><td>Астана</td><td>Мышь</td><td>5000</td><td>1</td></tr>
</table>
<h3>Шаг 2. Вторая нормальная форма</h3>
<p>Дата и клиент зависят только от НомерЗаказа, название и цена — только от КодТовара. От всего ключа зависит лишь количество. Выносим частичные зависимости:</p>
<ul>
<li>Заказ(<u>НомерЗаказа</u>, Дата, КодКлиента, Имя, Город)</li>
<li>Товар(<u>КодТовара</u>, Название, Цена)</li>
<li>СоставЗаказа(<u>НомерЗаказа, КодТовара</u>, Кол-во)</li>
</ul>
<h3>Шаг 3. Третья нормальная форма</h3>
<p>В таблице Заказ имя и город зависят от КодКлиента, а не от номера заказа — транзитивная зависимость. Выносим клиента:</p>
<ul>
<li>Заказ(<u>НомерЗаказа</u>, Дата, КодКлиента → Клиент)</li>
<li>Клиент(<u>КодКлиента</u>, Имя, Город)</li>
<li>Товар(<u>КодТовара</u>, Название, Цена)</li>
<li>СоставЗаказа(<u>НомерЗаказа → Заказ, КодТовара → Товар</u>, Кол-во)</li>
</ul>
<p>Итог: 4 таблицы. Цену мыши теперь меняют в одной строке, клиента можно добавить без заказа, удаление заказа не стирает сведения о товаре.</p>

<h2>Функциональная зависимость</h2>
<p>Запись <b>A → B</b> означает: значение A однозначно определяет значение B. ИИН → ФИО, КодТовара → Цена. Первичный ключ функционально определяет все остальные поля таблицы. Нормальные формы формулируются именно через такие зависимости.</p>

<h2>Операции реляционной алгебры</h2>
<table>
<tr><th>Операция</th><th>Результат</th><th>В SQL</th></tr>
<tr><td>Выборка (селекция) σ</td><td>Строки, удовлетворяющие условию</td><td><code>WHERE</code></td></tr>

<tr><td>Объединение ∪</td><td>Строки из обеих таблиц без повторов</td><td><code>UNION</code></td></tr>
<tr><td>Пересечение ∩</td><td>Строки, которые есть в обеих</td><td><code>INTERSECT</code></td></tr>

</table>
<p>Декартово произведение таблиц из 6 и 3 строк содержит 18 строк. Для объединения, пересечения и разности таблицы должны иметь одинаковую структуру.</p>

<h2>Проектирование базы данных</h2>
<ol class="steps">

<div class="task"><b>Пример: школьная библиотека</b>Нужно хранить книги, авторов, читателей и выдачу книг. У книги может быть несколько авторов, автор пишет много книг. Читатель берёт много книг в разное время.

</ul></details></div>

<h2>Транзакции и ACID</h2>
<p><b>Транзакция</b> — группа операций, которая выполняется как единое целое. Пример: перевод 1000 ₸ — списать с одного счёта и зачислить на другой. Если после списания произойдёт сбой, списание должно отмениться.</p>
<table>
<tr><th>Свойство</th><th>Смысл</th></tr>
<tr><td>Атомарность (Atomicity)</td><td>Выполняются все операции транзакции или ни одна</td></tr>
<tr><td>Согласованность (Consistency)</td><td>После транзакции данные удовлетворяют всем ограничениям</td></tr>
<tr><td>Изолированность (Isolation)</td><td>Параллельные транзакции не мешают друг другу</td></tr>
<tr><td>Долговечность (Durability)</td><td>Подтверждённые изменения не теряются даже при сбое</td></tr>
</table>

<h2>Контроль ввода данных</h2>
<p><b>Валидация</b> (validation) автоматически проверяет, что значение допустимо:</p>
<ul>
<li>проверка диапазона (оценка от 1 до 5);</li>
<li>проверка типа (только число);</li>
<li>проверка формата (ИИН из 12 цифр, e-mail с @);</li>
<li>проверка наличия (поле обязательно);</li>

<p><b>Верификация</b> (verification) проверяет, что данные введены без ошибок переписывания: двойной ввод пароля, визуальная сверка с документом. Валидация не гарантирует правильность: дата рождения 01.01.2008 допустима, но может быть неверной.</p>
<p><b>Словарь данных</b> описывает каждое поле: имя, тип, размер, ограничения, описание.</p>

<table>

ext("t10",{html:String.raw`
<h2>Подзапросы</h2>
<p>Подзапрос — запрос внутри другого запроса. Он выполняется первым, а его результат используется во внешнем запросе.</p>
[[sql]]
-- ученики с баллом выше среднего (среднее = 631 / 6 ≈ 105,17)
SELECT name, score FROM students
WHERE score > (SELECT AVG(score) FROM students);
-- Айгерим 118, Мадина 124  (у Ерлана 105 — ниже среднего)

-- лучший ученик
SELECT name FROM students
WHERE score = (SELECT MAX(score) FROM students);   -- Мадина

-- ученики классов учителя Иванова
SELECT name FROM students
WHERE class IN (SELECT class FROM classes WHERE teacher = 'Иванов');
-- Данияр, Мадина
[[/sql]]

<h2>LEFT JOIN и подсчёт с нулями</h2>
<p>Добавим в таблицу classes класс 11D (учитель Омаров), в котором пока нет учеников.</p>
[[sql]]
SELECT c.class, COUNT(s.id) AS cnt
FROM classes c
LEFT JOIN students s ON s.class = c.class
GROUP BY c.class;
[[/sql]]
<table>
<tr><th>class</th><th>cnt</th></tr>
<tr><td>11A</td><td>3</td></tr>
<tr><td>11B</td><td>2</td></tr>
<tr><td>11C</td><td>1</td></tr>
<tr><td>11D</td><td>0</td></tr>
</table>
<p>LEFT JOIN сохранил 11D, а поля учеников заполнил NULL. <code>COUNT(s.id)</code> не считает NULL, поэтому получилось 0. <code>COUNT(*)</code> посчитал бы строку и дал 1. С обычным JOIN класс 11D не попал бы в результат вовсе.</p>

<h2>NULL в агрегатных функциях</h2>
<ul>
<li><code>COUNT(*)</code> считает все строки, <code>COUNT(поле)</code> — только строки, где поле не NULL.</li>
<li><code>SUM</code>, <code>AVG</code>, <code>MIN</code>, <code>MAX</code> пропускают NULL: AVG от значений 10, NULL, 20 равно 15, а не 10.</li>
<li>Любое сравнение с NULL (даже <code>NULL = NULL</code>) не даёт истины, поэтому используют <code>IS NULL</code> и <code>IS NOT NULL</code>.</li>
</ul>

<h2>Вычисляемые поля, псевдонимы, сортировка, LIMIT</h2>
[[sql]]
SELECT name, score, ROUND(score * 100.0 / 140, 1) AS percent
FROM students
ORDER BY class ASC, score DESC;      -- сначала по классу, внутри класса по убыванию балла

SELECT name, score FROM students
ORDER BY score DESC
LIMIT 3;                             -- Мадина 124, Айгерим 118, Ерлан 105

SELECT name FROM students ORDER BY score DESC LIMIT 2 OFFSET 2;   -- 3-е и 4-е места: Ерлан, Сауле
[[/sql]]

<h2>Ограничения целостности</h2>
[[sql]]
CREATE TABLE students (
  id      INTEGER PRIMARY KEY AUTOINCREMENT,
  iin     CHAR(12) UNIQUE NOT NULL,                 -- без повторов и обязательно
  name    VARCHAR(50) NOT NULL,
  class   CHAR(3) REFERENCES classes(class) ON DELETE CASCADE,
  score   INTEGER CHECK (score BETWEEN 0 AND 140),  -- условие на значение
  city    VARCHAR(30) DEFAULT 'Астана'              -- значение по умолчанию
);
CREATE INDEX idx_city ON students(city);           -- ускоряет поиск по городу
CREATE VIEW top_students AS
  SELECT name, score FROM students WHERE score >= 110;   -- представление: сохранённый запрос
[[/sql]]
<p><code>ON DELETE CASCADE</code>: при удалении класса автоматически удаляются его ученики. Без этого СУБД запретит удалить класс, на который есть ссылки.</p>

<h2>Транзакции и права доступа</h2>
[[sql]]
BEGIN TRANSACTION;
UPDATE accounts SET balance = balance - 1000 WHERE id = 1;
UPDATE accounts SET balance = balance + 1000 WHERE id = 2;
COMMIT;          -- подтвердить; ROLLBACK отменил бы обе операции

GRANT SELECT ON students TO teacher;    -- выдать право чтения
REVOKE SELECT ON students FROM teacher; -- отозвать
[[/sql]]

<h2>Составление запросов: типовые задачи</h2>
<div class="task"><b>Задача 1</b>Вывести учеников 11A по убыванию балла.
<details class="sol"><summary>Решение</summary><code>SELECT name, score FROM students WHERE class = '11A' ORDER BY score DESC;</code> → Айгерим 118, Ерлан 105, Нурлан 87.</details></div>
<div class="task"><b>Задача 2</b>Средний балл по городам, где учится больше одного ученика.
<details class="sol"><summary>Решение</summary><code>SELECT city, AVG(score) FROM students GROUP BY city HAVING COUNT(*) > 1;</code> → Алматы 114,33 (343 / 3), Астана 91,5. Шымкент отброшен условием HAVING.</details></div>
<div class="task"><b>Задача 3</b>Сколько учеников у каждого классного руководителя.
<details class="sol"><summary>Решение</summary><code>SELECT c.teacher, COUNT(*) FROM students s JOIN classes c ON s.class = c.class GROUP BY c.teacher;</code> → Ахметова 3, Иванов 2, Сериков 1.</details></div>
<div class="task"><b>Задача 4</b>Ученики, чьё имя оканчивается на «н».
<details class="sol"><summary>Решение</summary><code>SELECT name FROM students WHERE name LIKE '%н';</code> → Ерлан, Нурлан.</details></div>

<h2>SQL-инъекция</h2>
<p>Если программа склеивает запрос из введённого текста: <code>"SELECT * FROM users WHERE login = '" + login + "'"</code>, злоумышленник может ввести <code>' OR '1'='1</code>. Условие станет всегда истинным, и запрос вернёт всех пользователей. Защита — параметризованные запросы (<code>?</code> в sqlite3), проверка ввода, минимальные права у учётной записи приложения.</p>

<h2>Полный пример на Python</h2>
[[py]]
import sqlite3

con = sqlite3.connect(":memory:")     # база в оперативной памяти
cur = con.cursor()
cur.execute("CREATE TABLE students (name TEXT, city TEXT, score INTEGER)")
cur.executemany("INSERT INTO students VALUES (?, ?, ?)", [
    ("Айгерим", "Алматы", 118), ("Данияр", "Астана", 96), ("Мадина", "Алматы", 124)])
con.commit()

cur.execute("SELECT city, COUNT(*), MAX(score) FROM students GROUP BY city ORDER BY city")
print(cur.fetchall())    # [('Алматы', 2, 124), ('Астана', 1, 96)]
con.close()
[[/py]]

<h2>Как работает нейронная сеть</h2>
<p>Искусственный нейрон получает входы x₁…xₙ, умножает каждый на свой <b>вес</b> wᵢ, складывает и применяет <b>функцию активации</b>. Простейшая активация — порог: если сумма больше порога, выход 1, иначе 0.</p>
<div class="task"><b>Задача</b>Входы x = (1, 0, 1), веса w = (0,2; 0,5; 0,4), порог 0,5. Каков выход нейрона?
<details class="sol"><summary>Решение</summary>Сумма 1 · 0,2 + 0 · 0,5 + 1 · 0,4 = 0,6 > 0,5, выход 1.</details></div>
<p><b>Обучение</b>: сеть делает прогноз на примере, вычисляется ошибка, и методом обратного распространения ошибки веса немного корректируются. Один проход по всем обучающим данным называется <b>эпохой</b>.</p>
<table>
<tr><th>Понятие</th><th>Смысл</th></tr>
<tr><td>Обучающая, валидационная, тестовая выборки</td><td>Данные делят: на одной части учат, на другой подбирают настройки, на третьей честно проверяют</td></tr>
<tr><td>Переобучение</td><td>Модель «запомнила» обучающие примеры и плохо работает на новых</td></tr>
<tr><td>Недообучение</td><td>Модель слишком простая и ошибается даже на обучающих данных</td></tr>
<tr><td>Точность (accuracy)</td><td>Доля верных ответов: 90 из 100 — 90%</td></tr>
</table>
<table>
<tr><th>Задача</th><th>Пример</th><th>Тип обучения</th></tr>
<tr><td>Классификация</td><td>Спам или не спам, распознавание цифр</td><td>С учителем</td></tr>
<tr><td>Регрессия</td><td>Прогноз цены квартиры</td><td>С учителем</td></tr>
<tr><td>Кластеризация</td><td>Группировка покупателей по поведению</td><td>Без учителя</td></tr>
<tr><td>Управление</td><td>Игра, робот, беспилотник</td><td>С подкреплением</td></tr>
</table>
<p>Ответ языковой модели зависит от <b>запроса (промпта)</b>: чем точнее задача, контекст, формат ответа и примеры, тем полезнее результат. Ответы ИИ нужно проверять: модель может уверенно ошибаться.</p>

<h2>Большие данные: как их обрабатывают</h2>
<p>Путь данных: сбор → очистка (удаление дублей и ошибок) → хранение → анализ → визуализация → решение. Объёмы, которые не помещаются на один компьютер, обрабатывают <b>распределённо</b> (Hadoop, Spark). Модель <b>MapReduce</b>: на этапе map данные делятся между серверами и обрабатываются параллельно, на этапе reduce частичные результаты собираются в итог. Пример: подсчёт частоты слов в миллионах документов.</p>

<h2>Облака, IoT и блокчейн подробнее</h2>
<table>
<tr><th>Модель развёртывания облака</th><th>Описание</th></tr>
<tr><td>Публичное</td><td>Ресурсы провайдера доступны многим клиентам</td></tr>
<tr><td>Частное</td><td>Инфраструктура одной организации</td></tr>
<tr><td>Гибридное</td><td>Сочетание: чувствительные данные в частном облаке, остальное в публичном</td></tr>
</table>
<p>Плюсы облака: масштабирование по запросу, оплата за фактическое использование, доступ отовсюду. Минусы: зависимость от интернета и провайдера, вопросы приватности данных.</p>
<p><b>Архитектура IoT</b>: датчики и исполнительные устройства → шлюз → сеть → облачная платформа → приложение и аналитика. Пример: в умной теплице датчик влажности почвы передаёт данные, платформа сравнивает их с нормой и включает полив. Слабое место IoT — безопасность: заводские пароли, редкие обновления.</p>
<p><b>Блок блокчейна</b> содержит данные транзакций, временную метку, хеш предыдущего блока и собственный хеш. Чтобы добавить блок, узлы сети достигают <b>консенсуса</b>: в Proof of Work участники (майнеры) решают вычислительно сложную задачу, в Proof of Stake право создать блок зависит от доли монет. <b>Смарт-контракт</b> — программа в блокчейне, которая автоматически выполняет условия договора.</p>

<h2>Стартап: методы и расчёты</h2>
<h3>Бережливый стартап</h3>
<p>Цикл «<b>Создай — Измерь — Научись</b>» (Build — Measure — Learn): выдвинуть гипотезу, быстро сделать MVP, измерить реакцию пользователей, сделать вывод и продолжить или сменить курс (пивот). <b>A/B-тест</b> показывает двум группам пользователей разные версии и сравнивает результат. <b>Customer Development</b> — сначала поговорить с потенциальными клиентами и убедиться, что проблема реальна, и только потом строить продукт.</p>
<h3>Размер рынка</h3>
<table>
<tr><th>Показатель</th><th>Смысл</th></tr>
<tr><td>TAM</td><td>Весь объём рынка</td></tr>
<tr><td>SAM</td><td>Часть рынка, которую продукт может обслужить (по географии, сегменту)</td></tr>
<tr><td>SOM</td><td>Доля, которую реально занять в ближайшие годы</td></tr>
</table>
<h3>Юнит-экономика</h3>
<ul>
<li><b>CAC</b> — стоимость привлечения клиента: расходы на маркетинг / число новых клиентов.</li>
<li><b>LTV</b> — доход от клиента за всё время: средний платёж × срок жизни клиента.</li>
<li>Бизнес жизнеспособен, если LTV заметно больше CAC (ориентир — в 3 раза и больше).</li>
<li><b>Churn</b> — доля ушедших клиентов за период; <b>MRR</b> — ежемесячная регулярная выручка.</li>
</ul>
<div class="task"><b>Задача</b>На рекламу потратили 200 000 ₸ и привлекли 100 клиентов. Клиент платит 1000 ₸ в месяц и в среднем остаётся 6 месяцев. Найдите CAC, LTV и их отношение.
<details class="sol"><summary>Решение</summary>CAC = 200 000 / 100 = 2000 ₸. LTV = 1000 · 6 = 6000 ₸. LTV / CAC = 3 — модель окупается.</details></div>
<h3>Оценка компании и доля инвестора</h3>
<p><span class="f">post-money = pre-money + инвестиции</span>, <span class="f">доля инвестора = инвестиции / post-money</span>.</p>
<div class="task"><b>Задача</b>Инвестор вложил 50 000 $ и получил 10% компании. Какова оценка до и после инвестиций?
<details class="sol"><summary>Решение</summary>Post-money = 50 000 / 0,1 = 500 000 $. Pre-money = 500 000 − 50 000 = 450 000 $.</details></div>
<h3>Бизнес-модели и питч</h3>
<table>
<tr><th>Модель</th><th>Суть</th></tr>
<tr><td>B2B / B2C / B2G / C2C</td><td>Бизнес продаёт бизнесу / потребителю / государству; потребители продают друг другу</td></tr>
<tr><td>Freemium</td><td>Базовые функции бесплатно, расширенные за плату</td></tr>
<tr><td>Подписка</td><td>Регулярная плата за доступ</td></tr>
<tr><td>Маркетплейс</td><td>Площадка сводит продавцов и покупателей и берёт комиссию</td></tr>
<tr><td>Реклама</td><td>Бесплатно для пользователей, платят рекламодатели</td></tr>
</table>
<p>Структура <b>pitch deck</b>: проблема → решение → рынок → продукт → бизнес-модель → конкуренты и преимущество → команда → финансы и метрики → сколько денег нужно и на что. Роли в команде: CEO (руководитель), CTO (технологии), продакт-менеджер, дизайнер, маркетолог. В Казахстане стартап обычно регистрируют как ИП или ТОО. Идею и продукт защищают соглашением о неразглашении (NDA), товарным знаком, патентом, авторским правом на код.</p>

<h2>3D-моделирование глубже</h2>
<h3>Преобразования и геометрия</h3>
<p>Объект можно перемещать, поворачивать и масштабировать относительно <b>опорной точки</b> (pivot). <b>Нормаль</b> — вектор, перпендикулярный грани и направленный наружу. От нормалей зависят освещение и корректность модели для печати.</p>
<p><b>Подразделение</b> (subdivision) делит каждый четырёхугольник на 4 и сглаживает форму. Куб (6 граней) после одного подразделения — 24 грани, после двух — 96. Чем больше полигонов, тем детальнее модель и тяжелее расчёт, поэтому в играх используют уровни детализации (LOD).</p>
<p>Для многогранников проверяйте формулу Эйлера: тетраэдр 4 − 6 + 4 = 2, четырёхугольная пирамида 5 − 8 + 5 = 2, треугольная призма 6 − 9 + 5 = 2.</p>
<h3>Материалы, свет, камера</h3>
<ul>
<li><b>Материал</b>: базовый цвет, шероховатость (матовость или блеск), металличность, прозрачность, карта нормалей (имитирует мелкий рельеф без лишних полигонов).</li>
<li><b>Свет</b>: точечный, направленный («солнце»), прожектор, площадной. Тени придают объём.</li>
<li><b>Камера</b>: перспективная (как глаз, дальние объекты меньше) и ортографическая (без перспективы, для чертежей).</li>
</ul>
<h3>Рендеринг и анимация</h3>
<table>
<tr><th>Метод</th><th>Особенности</th></tr>
<tr><td>Растеризация</td><td>Быстро, в реальном времени: игры, Eevee в Blender</td></tr>
<tr><td>Трассировка лучей</td><td>Физически точный свет, отражения, тени, но медленно: кино, Cycles в Blender</td></tr>
</table>
<p>Анимация строится по <b>ключевым кадрам</b>: задаются положения в отдельные моменты, промежуточные кадры программа рассчитывает сама (интерполяция). Для персонажей создают скелет — <b>риггинг</b>. Расчёт: ролик 10 с при 24 кадрах/с — это 240 кадров; если кадр рендерится 30 с, весь ролик займёт 7200 с = 2 часа.</p>
<h3>Горячие клавиши Blender</h3>
<table>
<tr><th>Клавиша</th><th>Действие</th></tr>
<tr><td>G / R / S</td><td>Перемещение / поворот / масштаб</td></tr>
<tr><td>Tab</td><td>Переключение объектного режима и режима редактирования</td></tr>
<tr><td>E</td><td>Экструзия</td></tr>
<tr><td>Ctrl + R</td><td>Разрез петлёй</td></tr>
<tr><td>Shift + A</td><td>Добавить объект</td></tr>
<tr><td>F12</td><td>Рендер</td></tr>
</table>
<h3>Подготовка к 3D-печати</h3>
<p>Модель для печати должна быть <b>замкнутой</b> (без дыр в сетке), с правильно направленными нормалями и достаточной толщиной стенок. В слайсере задают высоту слоя (обычно 0,1–0,3 мм), процент заполнения, поддержки для нависающих частей, температуру. Модель высотой 30 мм при слое 0,2 мм печатается за 30 / 0,2 = 150 слоёв. Тоньше слой — глаже поверхность, но дольше печать.</p>

<h2>Функции поиска и условные функции</h2>
